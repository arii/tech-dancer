
      - name: Update Deployment Feedback (Initial Push)
        if: env.PUSH_COMPLETE == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branchName = context.ref.replace('refs/heads/', '');
            const baseUrl = `https://${owner}.github.io/${repo}/`;
            const previewUrl = branchName === 'main' ? baseUrl : `https://${owner}.github.io/${repo}/${branchName}/`;
            const dashboardUrl = `https://${owner}.github.io/${repo}/previews/index.html`;

            const pstTime = new Date().toLocaleString('en-US', {
              timeZone: 'America/Los_Angeles',
              dateStyle: 'medium',
              timeStyle: 'short'
            });

            if (branchName === 'main') return;

            console.log(`Setting initial feedback for branch: ${branchName}`);
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open'
            });

            const matchingPRs = pullRequests.filter(pr => pr.head.ref === branchName);
            for (const pr of matchingPRs) {
              const commentTag = `<!-- preview-url-comment-${branchName} -->`;
              const body = [
                `🚀 **Deployment Details** (Last updated: ${pstTime} PST)`,
                '',
                `⏳ **Build complete; waiting for GitHub Pages publish...**`,
                `- **Preview URL:** ${previewUrl}`,
                `- **Preview Dashboard:** ${dashboardUrl}`,
                `- **Commit SHA:** \`${process.env.GITHUB_SHA.slice(0, 7)}\``,
                '',
                commentTag
              ].join('\n');

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
              });

              const existingComment = comments.find(c => c.body.includes(commentTag));

              if (existingComment) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existingComment.id, body });
              } else {
                await github.rest.issues.createComment({ issue_number: pr.number, owner, repo, body });
              }
            }

      - name: Update Deployment Feedback (Final Result)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branchName = context.ref.replace('refs/heads/', '');
            const baseUrl = `https://${owner}.github.io/${repo}/`;
            const previewUrl = branchName === 'main' ? baseUrl : `https://${owner}.github.io/${repo}/${branchName}/`;
            const dashboardUrl = `https://${owner}.github.io/${repo}/previews/index.html`;
            const isVerified = process.env.VERIFIED === 'true';
            const markerUrl = branchName === 'main'
              ? `${baseUrl}.deploy.json`
              : `${baseUrl}${branchName}/.deploy.json`;

            const pstTime = new Date().toLocaleString('en-US', {
              timeZone: 'America/Los_Angeles',
              dateStyle: 'medium',
              timeStyle: 'short'
            });

            // Update Job Summary
            await core.summary
              .addHeading(isVerified ? '✅ Deployment Verified!' : '⚠️ Deployment Pushed (Pending Verify)')
              .addTable([
                ['Site', 'URL'],
                ['Main Site', `<a href="${baseUrl}">${baseUrl}</a>`],
                ['Preview URL', `<a href="${previewUrl}">${previewUrl}</a>`],
                ['Preview Dashboard', `<a href="${dashboardUrl}">${dashboardUrl}</a>`]
              ])
              .addRaw(`**Last updated:** ${pstTime} PST`)
              .write();

            if (branchName === 'main') return;

            console.log(`Searching for open PRs for branch: ${branchName}`);
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open'
            });

            const matchingPRs = pullRequests.filter(pr => pr.head.ref === branchName);
            console.log(`Found ${matchingPRs.length} matching PRs`);

            for (const pr of matchingPRs) {
              console.log(`Updating feedback for PR #${pr.number}`);
              const commentTag = `<!-- preview-url-comment-${branchName} -->`;
              const statusLine = isVerified
                ? `✅ **Published and verified**`
                : `⚠️ **Pushed to gh-pages but public URL did not verify within timeout**`;

              const body = [
                `🚀 **Deployment Details** (Last updated: ${pstTime} PST)`,
                '',
                statusLine,
                `- **Preview URL:** ${previewUrl}`,
                `- **Preview Dashboard:** ${dashboardUrl}`,
                `- **Commit SHA:** \`${process.env.GITHUB_SHA.slice(0, 7)}\``,
                `- **Marker File:** [verify here](${markerUrl})`,
                '',
                commentTag
              ].join('\n');

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
              });

              const existingComment = comments.find(c => c.body.includes(commentTag));

              try {
                if (existingComment) {
                  console.log(`Updating existing comment ${existingComment.id}`);
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: existingComment.id,
                    body,
                  });
                } else {
                  console.log(`Creating new comment for PR #${pr.number}`);
                  await github.rest.issues.createComment({
                    issue_number: pr.number,
                    owner,
                    repo,
                    body,
                  });
                }
              } catch (error) {
                console.warn(`Failed to update comment on PR #${pr.number}:`, error.message);
              }
            }
