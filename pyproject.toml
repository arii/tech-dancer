[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-review-pipeline"
version = "0.1.0"
description = "Lightweight local RAG PR review pipeline"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "requests",
    "chromadb",
    "sentence-transformers",
    "unidiff",
    "pytest",
    "PyGithub",
]

[project.scripts]
pr-review = "pr_review_pipeline.cli:app"

[tool.setuptools]
packages = ["pr_review_pipeline", "pr_review_pipeline.agents", "pr_review_pipeline.rag", "pr_review_pipeline.schemas"]

[tool.setuptools.package-data]
pr_review_pipeline = ["prompts/*.md"]
