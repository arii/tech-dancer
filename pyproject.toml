[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-dancer-dev-tools-sdk"
version = "0.1.0"
description = "Unified SDK and CLI for Tech Dancer dev-tools"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "dev-tools"}

[tool.setuptools.packages.find]
where = ["dev-tools"]
include = ["dev_tools_sdk*"]

[project.scripts]
td-sdk-cli = "dev_tools_sdk.cli:main"
