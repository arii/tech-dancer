<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google-site-verification" content="FGbpuhF_c3YUFon1LzrzqmW1jvVPFygugss24n0wn5k" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/assets/home/wcs-travel-pack.webp" type="image/webp" fetchpriority="high" />
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      #initial-loader {
        background-color: #020617;
        min-height: 100vh;
        display: block;
      }
      body:has(#root:not(:empty)) #initial-loader {
        display: none;
      }
      .sk-container {
        padding: 2rem;
        max-width: 1240px;
        margin: 0 auto;
        box-sizing: border-box;
      }
      .sk-layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 2rem;
        align-items: center;
      }
      @media (min-width: 1024px) {
        .sk-layout {
          grid-template-columns: minmax(0, 1fr) 420px;
          margin-top: 2rem;
        }
      }
      .sk-content {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .sk-text-lg {
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 800;
        color: #ffffff;
        font-size: clamp(24px, 5vw, 48px);
        margin: 0;
        line-height: 1.1;
      }
      .sk-text-accent {
        color: #22d3ee;
      }
      .sk-tagline {
        font-family: "Albert Sans", sans-serif;
        color: #cbd5e1;
        font-size: 1.125rem;
        max-width: 600px;
        margin-top: 1.5rem;
        opacity: 0.8;
      }
      .sk-hero-image {
        height: 400px;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 12px;
        width: 100%;
        box-sizing: border-box;
        overflow: hidden;
      }
      .sk-hero-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.4;
      }
      @keyframes sk-fade {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .sk-anim {
        animation: sk-fade 2s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="sk-container">
        <div class="sk-layout">
          <div class="sk-content">
            <div class="sk-anim" style="margin-bottom: 2rem;">
              <span style="font-weight: 800; color: white; font-family: 'Albert Sans', sans-serif;">boom<span style="color: #22d3ee;">tick</span><span style="opacity: 0.5;">.blog</span></span>
            </div>
            <div class="sk-text-lg sk-anim">Pack smart.<br /><span class="sk-text-accent">Dance more.</span></div>
            <p class="sk-tagline sk-anim">The west coast swing dancer's guide to gear, travel, and better dance weekends.</p>
          </div>
          <div class="sk-hero-image sk-anim">
             <img src="/assets/home/wcs-travel-pack.webp" alt="" fetchpriority="high" />
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
