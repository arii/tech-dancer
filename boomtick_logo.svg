<svg viewBox="0 0 450 110" fill="none" xmlns="http://www.w3.org/2000/svg" class="h-full w-auto max-w-none overflow-visible" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
  <style>
    .brand-stop-1 { stop-color: #F46241; }
    .brand-stop-2 { stop-color: #38A3A5; }
    .brand-text-accent { fill: #F46241; }
    .brand-text-muted { fill: #B8D6D4; }
    .brand-b-mark {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-style: italic;
    }
    .brand-wordmark {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
    }
  </style>
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" class="brand-stop-1" stop-color="#F46241" />
      <stop offset="100%" class="brand-stop-2" stop-color="#38A3A5" />
    </linearGradient>
    <filter id="logo-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(10, 85)">
    <!-- The "B" Mark -->
    <text
      x="0"
      y="0"
      font-size="85"
      fill="white"
      class="brand-b-mark"
    >B</text>
    
    <!-- The Glowing Gradient Dot -->
    <circle
      cx="82"
      cy="-28"
      r="16"
      fill="url(#logo-grad)"
      filter="url(#logo-glow)"
    />
  </g>

  <!-- Wordmark -->
  <text x="130" y="78" font-size="52" letter-spacing="-1.5" class="brand-wordmark">
    <tspan fill="white">boom</tspan>
    <tspan class="brand-text-accent" fill="#F46241">tick</tspan>
    <tspan class="brand-text-muted" fill="#B8D6D4" font-weight="300">.blog</tspan>
  </text>
</svg>
