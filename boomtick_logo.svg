<svg viewBox="0 0 450 110" fill="none" xmlns="http://www.w3.org/2000/svg" class="h-full w-auto max-w-none overflow-visible" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bt-logo-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" class="brand-stop-accent" />
      <stop offset="100%" class="brand-stop-purple" />
    </linearGradient>
    <filter id="bt-logo-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(10, 85)">
    <!-- The "B" Mark -->
    <text
      x="0"
      y="0"
      transform="skewX(-8)"
      class="brand-b-mark"
    >B</text>
    
    <!-- The Glowing Gradient Dot -->
    <circle
      cx="82"
      cy="-28"
      r="16"
      fill="url(#bt-logo-grad)"
      filter="url(#bt-logo-glow)"
    />
  </g>

  <!-- Wordmark -->
  <text x="130" y="78" class="brand-wordmark-text">
    <tspan class="brand-text-white">boom</tspan>
    <tspan class="brand-text-accent">tick</tspan>
    <tspan class="brand-text-muted">.blog</tspan>
  </text>
</svg>
