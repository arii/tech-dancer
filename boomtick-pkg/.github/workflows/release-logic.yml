name: Release boomtick-cli

on:
  workflow_call:
    inputs:
      dry_run:
        description: 'Dry run (skip PyPI upload)'
        required: false
        default: false
        type: boolean
    secrets:
      PYPI_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip PyPI upload)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # This allows the workflow to be migration-ready.
      # In the monorepo, SUBPKG_PATH is 'boomtick-pkg'
      # We detect monorepo by checking if boomtick-pkg directory exists
      SUBPKG_PATH: boomtick-pkg
    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Resolve Subpackage Path
        id: resolve-path
        shell: bash
        run: |
          set -eo pipefail
          if [ -d "boomtick-pkg" ]; then
            echo "path=boomtick-pkg" >> "$GITHUB_OUTPUT"
          else
            echo "path=." >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          node-version-file: ${{ steps.resolve-path.outputs.path }}/.node-version

      - name: Setup Python
        uses: actions/setup-python@v6 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pnpm
        uses: pnpm/action-setup@v6 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Install dependencies
        run: |
          set -eo pipefail
          pnpm install --frozen-lockfile
          pip install -r ${{ steps.resolve-path.outputs.path }}/cli/requirements.txt
          pip install build twine

      - name: Sync schemas/contracts
        run: |
          set -eo pipefail
          # Use relative paths from repo root
          PYTHONPATH="$PYTHONPATH:$(pwd)/${{ steps.resolve-path.outputs.path }}/cli"
          export PYTHONPATH
          python3 ${{ steps.resolve-path.outputs.path }}/cli/dev_tools/schema_gen.py
          pnpm exec tsx ${{ steps.resolve-path.outputs.path }}/mcp/scripts/sync-contracts.ts

      - name: Build TypeScript MCP
        run: |
          set -eo pipefail
          pnpm --filter @boomtick/mcp build

      - name: Copy compiled JS
        run: |
          set -eo pipefail
          mkdir -p ${{ steps.resolve-path.outputs.path }}/cli/dev_tools/dist
          cp -r ${{ steps.resolve-path.outputs.path }}/mcp/dist/* ${{ steps.resolve-path.outputs.path }}/cli/dev_tools/dist/

      - name: Build Python Package
        run: |
          set -eo pipefail
          cd ${{ steps.resolve-path.outputs.path }}/cli
          python3 -m build

      - name: Publish to PyPI
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) || (github.event_name == 'workflow_call' && inputs.dry_run == false)) }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -eo pipefail
          twine upload ${{ steps.resolve-path.outputs.path }}/cli/dist/*
