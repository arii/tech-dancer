name: Security & Quality Scan

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'etl/**'
      - 'boomtick-pkg/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'etl/**'
      - 'boomtick-pkg/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '45 4 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-changes:
    uses: ./boomtick-pkg/workflows/reusable-gate.yml
    permissions:
      pull-requests: write
      contents: write

  security-scan:
    needs: verify-changes
    if: needs.verify-changes.outputs.has_changes == 'true' || github.event_name == 'schedule'
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions, javascript-typescript

      - parallel: # actionlint-disable syntax-check
          - name: Oxlint Scan
            run: pnpm run lint:ox

          - name: Semgrep Static Analysis
            run: |
              # Install semgrep on the host for efficiency
              pip install semgrep
              pnpm run audit:semgrep

          - name: Gitleaks Secret Detection
            uses: gitleaks/gitleaks-action@v2
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:security-scan"
