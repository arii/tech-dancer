name: Validate Issue Quality Reusable

on:
  workflow_call:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          fetch-depth: 0
      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          setup-node: 'false'

      - name: Validate Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          td-cli gh validate-issue --issue-number "$ISSUE_NUMBER" --post-comments --execute
