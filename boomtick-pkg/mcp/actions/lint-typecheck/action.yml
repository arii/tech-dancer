name: BoomTick Lint & Typecheck
description: Runs linting and typechecking via project gate
inputs:
  target:
    description: 'Target to check (root or boomtick-mcp)'
    required: true
  github_token:
    description: 'GitHub token'
    required: true
  fetch-depth:
    description: 'Fetch depth for checkout'
    required: false
    default: '1'
runs:
  using: composite
  steps:
    - uses: ./boomtick-pkg/mcp/actions/setup
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Run Project Gate
      uses: ./.github/actions/run-project-gate
      with:
        target: ${{ inputs.target }}
        github_token: ${{ inputs.github_token }}
