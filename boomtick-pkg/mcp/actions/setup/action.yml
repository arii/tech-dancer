name: BoomTick Setup
description: Installs td CLI and builds MCP server
runs:
  using: composite
  steps:
    - name: Install td CLI
      run: pip install -e ./boomtick-pkg/cli --break-system-packages
      shell: bash
    - name: Build MCP server
      run: cd boomtick-pkg/mcp && npx tsc
      shell: bash
    - name: Verify td CLI
      run: td doctor
      shell: bash
