<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg_bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0a18"/>
      <stop offset="100%" stop-color="#080510"/>
    </linearGradient>
    <linearGradient id="bag_main" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1e1430"/>
      <stop offset="100%" stop-color="#120c20"/>
    </linearGradient>
    <linearGradient id="bag_accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6040a0"/>
      <stop offset="100%" stop-color="#4028a0"/>
    </linearGradient>
    <filter id="shadow_bag">
      <feDropShadow dx="5" dy="10" stdDeviation="10" flood-color="#000015" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg_bag)"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="355" rx="115" ry="16" fill="#000015" opacity="0.5"/>

  <g filter="url(#shadow_bag)">
    <!-- Main bag body -->
    <rect x="80" y="175" width="240" height="175" rx="20" fill="url(#bag_main)"/>

    <!-- Bottom reinforcement strip -->
    <rect x="80" y="320" width="240" height="30" rx="0 0 20 20" fill="#0a0814" opacity="0.6"/>
    <rect x="82" y="318" width="236" height="4" fill="#6040a0" opacity="0.4"/>

    <!-- Main zipper line -->
    <path d="M 90 195 Q 200 180 310 195" fill="none" stroke="#8060c0" stroke-width="2.5" opacity="0.7"/>
    <!-- Zipper teeth detail -->
    <g stroke="#6040a0" stroke-width="1" opacity="0.4">
      <line x1="110" y1="191" x2="110" y2="197"/>
      <line x1="130" y1="188" x2="130" y2="195"/>
      <line x1="150" y1="186" x2="150" y2="193"/>
      <line x1="170" y1="185" x2="170" y2="192"/>
      <line x1="190" y1="184" x2="190" y2="191"/>
      <line x1="210" y1="184" x2="210" y2="191"/>
      <line x1="230" y1="185" x2="230" y2="192"/>
      <line x1="250" y1="186" x2="250" y2="193"/>
      <line x1="270" y1="188" x2="270" y2="195"/>
      <line x1="290" y1="191" x2="290" y2="197"/>
    </g>
    <!-- Zipper pull -->
    <circle cx="200" cy="188" r="7" fill="#8060c0" opacity="0.8"/>
    <rect x="196" y="188" width="8" height="16" rx="3" fill="#6040a0"/>

    <!-- Front pocket -->
    <rect x="110" y="240" width="180" height="90" rx="10" fill="#160e28" stroke="#4a3080" stroke-width="1.5" opacity="0.8"/>
    <!-- Pocket zipper -->
    <line x1="120" y1="255" x2="280" y2="255" stroke="#6a50a0" stroke-width="1.5" opacity="0.5"/>
    <circle cx="200" cy="255" r="5" fill="#8060c0" opacity="0.6"/>

    <!-- Front pocket logo / emblem -->
    <circle cx="200" cy="285" r="22" fill="#0e0a18" stroke="#6040a0" stroke-width="1.5" opacity="0.7"/>
    <!-- Stylised B• mark -->
    <text x="200" y="291" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#8060c0" text-anchor="middle" opacity="0.8">B•</text>

    <!-- Side grab handle -->
    <path d="M 155 175 Q 155 148 200 148 Q 245 148 245 175" fill="none" stroke="#6040a0" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
    <path d="M 155 175 Q 155 150 200 150 Q 245 150 245 175" fill="none" stroke="#9070d0" stroke-width="5" stroke-linecap="round" opacity="0.5"/>

    <!-- Shoulder strap attachment rings -->
    <rect x="88" y="198" width="18" height="12" rx="6" fill="#6040a0" opacity="0.7"/>
    <rect x="294" y="198" width="18" height="12" rx="6" fill="#6040a0" opacity="0.7"/>

    <!-- Accent stripe on bag side -->
    <rect x="80" y="240" width="6" height="80" rx="3" fill="url(#bag_accent)" opacity="0.6"/>
    <rect x="314" y="240" width="6" height="80" rx="3" fill="url(#bag_accent)" opacity="0.6"/>
  </g>

  <!-- Label -->
  <rect x="0" y="352" width="400" height="48" fill="#080510" opacity="0.9"/>
  <text x="200" y="374" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#9070d0" text-anchor="middle" letter-spacing="2">DANCE BAG</text>
  <text x="200" y="393" font-family="Georgia, serif" font-size="11" fill="#64748b" text-anchor="middle">Weekend Essential · All Levels</text>
</svg>