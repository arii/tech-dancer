<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg_org" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1218"/>
      <stop offset="100%" stop-color="#080c10"/>
    </linearGradient>
    <linearGradient id="cube_main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e4a6e"/>
      <stop offset="100%" stop-color="#1a2e48"/>
    </linearGradient>
    <linearGradient id="cube_side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a2e48"/>
      <stop offset="100%" stop-color="#0e1e30"/>
    </linearGradient>
    <linearGradient id="cube_top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5a80"/>
      <stop offset="100%" stop-color="#2a4060"/>
    </linearGradient>
    <filter id="shadow_org">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#000020" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg_org)"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="345" rx="130" ry="18" fill="#000020" opacity="0.5"/>

  <g filter="url(#shadow_org)">
    <!-- Large cube (main bag) - isometric style -->
    <!-- Front face -->
    <polygon points="100,220 100,330 220,330 220,220" fill="url(#cube_main)"/>
    <!-- Right face -->
    <polygon points="220,220 220,330 300,285 300,175" fill="url(#cube_side)"/>
    <!-- Top face -->
    <polygon points="100,220 180,175 300,175 220,220" fill="url(#cube_top)"/>

    <!-- Front face details: zipper line -->
    <line x1="100" y1="270" x2="220" y2="270" stroke="#4a7aaa" stroke-width="2" opacity="0.6"/>
    <!-- Zipper pull -->
    <circle cx="162" cy="270" r="5" fill="#6aaad0" opacity="0.7"/>
    <rect x="159" y="267" width="6" height="12" rx="2" fill="#4a7aaa" opacity="0.7"/>
    <!-- Compression straps -->
    <line x1="100" y1="245" x2="220" y2="245" stroke="#6aaad0" stroke-width="1.5" opacity="0.4"/>
    <line x1="100" y1="300" x2="220" y2="300" stroke="#6aaad0" stroke-width="1.5" opacity="0.4"/>
    <!-- Strap buckle -->
    <rect x="150" y="241" width="20" height="8" rx="2" fill="#8ab8d8" opacity="0.5"/>

    <!-- Mesh window on front -->
    <rect x="115" y="228" width="90" height="35" rx="4" fill="#0a1830" opacity="0.5" stroke="#4a7aaa" stroke-width="1"/>
    <g stroke="#2a4a6a" stroke-width="0.8" opacity="0.4">
      <line x1="130" y1="228" x2="130" y2="263"/>
      <line x1="150" y1="228" x2="150" y2="263"/>
      <line x1="170" y1="228" x2="170" y2="263"/>
      <line x1="190" y1="228" x2="190" y2="263"/>
      <line x1="115" y1="241" x2="205" y2="241"/>
      <line x1="115" y1="253" x2="205" y2="253"/>
    </g>

    <!-- Small cube (second organizer) -->
    <polygon points="230,260 230,330 300,330 300,260" fill="#3a3060" opacity="0.9"/>
    <polygon points="300,260 300,330 340,308 340,238" fill="#2a2050" opacity="0.9"/>
    <polygon points="230,260 270,238 340,238 300,260" fill="#4a3870" opacity="0.9"/>
    <!-- Small cube zipper -->
    <line x1="230" y1="295" x2="300" y2="295" stroke="#8a70c0" stroke-width="1.5" opacity="0.5"/>
    <circle cx="268" cy="295" r="4" fill="#a888e0" opacity="0.6"/>
  </g>

  <!-- Brand tag detail -->
  <rect x="108" y="330" width="24" height="12" rx="2" fill="#00cfff" opacity="0.6"/>
  <text x="120" y="340" font-family="monospace" font-size="6" fill="#0a1830" text-anchor="middle">PACK</text>

  <!-- Label -->
  <rect x="0" y="352" width="400" height="48" fill="#080c10" opacity="0.9"/>
  <text x="200" y="374" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#8ab8d8" text-anchor="middle" letter-spacing="2">COMPRESSION CUBES</text>
  <text x="200" y="392" font-family="Georgia, serif" font-size="11" fill="#64748b" text-anchor="middle">Travel Packing · Organization</text>
</svg>