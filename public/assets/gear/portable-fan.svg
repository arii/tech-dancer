<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg_fan" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#060c16"/>
    </radialGradient>
    <linearGradient id="fan_body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3a4a"/>
      <stop offset="100%" stop-color="#141e28"/>
    </linearGradient>
    <linearGradient id="fan_blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#364a5e"/>
      <stop offset="100%" stop-color="#1e2e3e"/>
    </linearGradient>
    <filter id="shadow_fan">
      <feDropShadow dx="5" dy="8" stdDeviation="8" flood-color="#000020" flood-opacity="0.7"/>
    </filter>
    <filter id="glow_fan">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg_fan)"/>

  <!-- Glow behind fan -->
  <circle cx="200" cy="185" r="100" fill="#00aadd" opacity="0.06" filter="url(#glow_fan)"/>

  <g filter="url(#shadow_fan)">
    <!-- Fan grille ring -->
    <circle cx="200" cy="185" r="95" fill="url(#fan_body)" stroke="#2a3a4a" stroke-width="2"/>
    <circle cx="200" cy="185" r="88" fill="none" stroke="#1e2e3e" stroke-width="1" opacity="0.5"/>

    <!-- Grille bars (radial) -->
    <g stroke="#1a2a3a" stroke-width="1.5" opacity="0.7">
      <line x1="200" y1="97" x2="200" y2="273"/>
      <line x1="113" y1="135" x2="287" y2="235"/>
      <line x1="113" y1="235" x2="287" y2="135"/>
      <line x1="108" y1="185" x2="292" y2="185"/>
      <line x1="138" y1="108" x2="262" y2="262"/>
      <line x1="138" y1="262" x2="262" y2="108"/>
    </g>
    <!-- Grille concentric rings -->
    <circle cx="200" cy="185" r="65" fill="none" stroke="#1a2a3a" stroke-width="1" opacity="0.6"/>
    <circle cx="200" cy="185" r="40" fill="none" stroke="#1a2a3a" stroke-width="1" opacity="0.6"/>
    <circle cx="200" cy="185" r="18" fill="none" stroke="#1a2a3a" stroke-width="1" opacity="0.6"/>

    <!-- Blades (visible through grille, slightly motion-blurred look) -->
    <g opacity="0.5" fill="url(#fan_blade)">
      <ellipse cx="200" cy="155" rx="12" ry="32" transform="rotate(0, 200, 185)"/>
      <ellipse cx="200" cy="155" rx="12" ry="32" transform="rotate(90, 200, 185)"/>
      <ellipse cx="200" cy="155" rx="12" ry="32" transform="rotate(180, 200, 185)"/>
      <ellipse cx="200" cy="155" rx="12" ry="32" transform="rotate(270, 200, 185)"/>
    </g>

    <!-- Center hub -->
    <circle cx="200" cy="185" r="16" fill="#0a1420"/>
    <circle cx="200" cy="185" r="10" fill="#00aadd" opacity="0.6"/>
    <circle cx="200" cy="185" r="5" fill="#00ddff" opacity="0.8"/>

    <!-- Handle -->
    <rect x="186" y="278" width="28" height="65" rx="14" fill="url(#fan_body)"/>
    <!-- Button on handle -->
    <circle cx="200" cy="330" r="8" fill="#00aadd" opacity="0.5"/>
    <circle cx="200" cy="330" r="5" fill="#00ddff" opacity="0.6"/>
  </g>

  <!-- Air flow effect lines -->
  <g stroke="#00aadd" stroke-width="1" fill="none" opacity="0.15">
    <path d="M 100 185 Q 60 165 40 185 Q 60 205 100 185"/>
    <path d="M 300 185 Q 340 165 360 185 Q 340 205 300 185"/>
    <path d="M 200 85 Q 180 50 200 30 Q 220 50 200 85"/>
  </g>

  <!-- Label -->
  <rect x="0" y="350" width="400" height="50" fill="#060c16" opacity="0.9"/>
  <text x="200" y="373" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#00ddff" text-anchor="middle" letter-spacing="2">PORTABLE FAN</text>
  <text x="200" y="393" font-family="Georgia, serif" font-size="11" fill="#64748b" text-anchor="middle">Ballroom Essential · Stay Cool</text>
</svg>