<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg_st" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12100a"/>
      <stop offset="100%" stop-color="#1e1a10"/>
    </linearGradient>
    <linearGradient id="body_st" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e0d0"/>
      <stop offset="40%" stop-color="#c8bca8"/>
      <stop offset="100%" stop-color="#8a7e6e"/>
    </linearGradient>
    <linearGradient id="base_st" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2520"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
    <filter id="shadow_st">
      <feDropShadow dx="6" dy="10" stdDeviation="10" flood-color="#000010" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg_st)"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="355" rx="95" ry="15" fill="#000010" opacity="0.5"/>

  <g filter="url(#shadow_st)">
    <!-- Base / water tank -->
    <rect x="130" y="270" width="140" height="70" rx="12" fill="url(#base_st)"/>
    <rect x="138" y="278" width="124" height="54" rx="8" fill="#221e18" opacity="0.5"/>
    <!-- Water level indicator -->
    <rect x="148" y="286" width="8" height="38" rx="4" fill="#1e4060" opacity="0.6"/>
    <rect x="148" y="304" width="8" height="20" rx="4" fill="#00aacc" opacity="0.5"/>

    <!-- Handle -->
    <rect x="162" y="180" width="76" height="100" rx="10" fill="url(#body_st)"/>
    <!-- Handle grip lines -->
    <line x1="175" y1="205" x2="225" y2="205" stroke="#8a7e6e" stroke-width="1.5" opacity="0.5"/>
    <line x1="175" y1="215" x2="225" y2="215" stroke="#8a7e6e" stroke-width="1.5" opacity="0.5"/>
    <line x1="175" y1="225" x2="225" y2="225" stroke="#8a7e6e" stroke-width="1.5" opacity="0.5"/>
    <!-- Power button -->
    <circle cx="200" cy="248" r="10" fill="#cc3300" opacity="0.9"/>
    <circle cx="200" cy="248" r="7" fill="#ff4400" opacity="0.8"/>

    <!-- Steamer head (nozzle plate) -->
    <ellipse cx="200" cy="175" rx="52" ry="14" fill="#b0a090"/>
    <rect x="148" y="162" width="104" height="18" rx="6" fill="#c0b0a0"/>
    <!-- Steam holes -->
    <g fill="#6a5e50">
      <circle cx="172" cy="172" r="3"/>
      <circle cx="188" cy="172" r="3"/>
      <circle cx="204" cy="172" r="3"/>
      <circle cx="220" cy="172" r="3"/>
      <circle cx="180" cy="164" r="2.5"/>
      <circle cx="196" cy="164" r="2.5"/>
      <circle cx="212" cy="164" r="2.5"/>
    </g>
  </g>

  <!-- Steam wisps -->
  <g stroke="#c0e8f0" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M 178 155 Q 170 140 178 125 Q 186 110 178 95"/>
    <path d="M 200 152 Q 192 137 200 122 Q 208 107 200 92"/>
    <path d="M 222 155 Q 214 140 222 125 Q 230 110 222 95"/>
  </g>

  <!-- Label -->
  <rect x="0" y="350" width="400" height="50" fill="#12100a" opacity="0.9"/>
  <text x="200" y="373" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#f0c060" text-anchor="middle" letter-spacing="2">TRAVEL STEAMER PRO</text>
  <text x="200" y="392" font-family="Georgia, serif" font-size="11" fill="#64748b" text-anchor="middle">Competition Ready · ★★★★½</text>
</svg>