<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="pride" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E40303"/>
      <stop offset="20%" stop-color="#FF8C00"/>
      <stop offset="40%" stop-color="#FFED00"/>
      <stop offset="60%" stop-color="#008026"/>
      <stop offset="80%" stop-color="#004DFF"/>
      <stop offset="100%" stop-color="#750787"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#14082a"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Rainbow arc -->
  <g filter="url(#glow2)" opacity="0.85">
    <path d="M 50 420 Q 400 -60 750 420" fill="none" stroke="#E40303" stroke-width="18" opacity="0.7"/>
    <path d="M 80 420 Q 400 -20 720 420" fill="none" stroke="#FF8C00" stroke-width="18" opacity="0.7"/>
    <path d="M 110 420 Q 400 20 690 420" fill="none" stroke="#FFED00" stroke-width="18" opacity="0.7"/>
    <path d="M 140 420 Q 400 55 660 420" fill="none" stroke="#008026" stroke-width="18" opacity="0.7"/>
    <path d="M 170 420 Q 400 85 630 420" fill="none" stroke="#004DFF" stroke-width="18" opacity="0.7"/>
    <path d="M 200 420 Q 400 110 600 420" fill="none" stroke="#750787" stroke-width="18" opacity="0.7"/>
  </g>

  <!-- Scattered sparkles -->
  <g fill="white" filter="url(#glow2)">
    <polygon points="200,120 205,135 220,135 208,144 213,158 200,149 187,158 192,144 180,135 195,135" opacity="0.7"/>
    <polygon points="580,90 584,102 596,102 586,110 590,122 580,115 570,122 574,110 564,102 576,102" opacity="0.65"/>
    <polygon points="380,50 383,60 393,60 385,66 388,76 380,70 372,76 375,66 367,60 377,60" opacity="0.6"/>
  </g>

  <!-- Disco dots scattered -->
  <g opacity="0.6">
    <circle cx="120" cy="200" r="5" fill="#E40303" filter="url(#glow2)"/>
    <circle cx="180" cy="160" r="4" fill="#FF8C00" filter="url(#glow2)"/>
    <circle cx="250" cy="220" r="5" fill="#FFED00" filter="url(#glow2)"/>
    <circle cx="560" cy="190" r="5" fill="#008026" filter="url(#glow2)"/>
    <circle cx="630" cy="150" r="4" fill="#004DFF" filter="url(#glow2)"/>
    <circle cx="680" cy="210" r="5" fill="#750787" filter="url(#glow2)"/>
  </g>

  <!-- Dance floor tiles suggestion -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.5" fill="none">
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
    <line x1="0" y1="430" x2="800" y2="430"/>
    <line x1="100" y1="340" x2="100" y2="450"/>
    <line x1="200" y1="340" x2="200" y2="450"/>
    <line x1="300" y1="340" x2="300" y2="450"/>
    <line x1="400" y1="340" x2="400" y2="450"/>
    <line x1="500" y1="340" x2="500" y2="450"/>
    <line x1="600" y1="340" x2="600" y2="450"/>
    <line x1="700" y1="340" x2="700" y2="450"/>
  </g>

  <!-- Label -->
  <rect x="0" y="375" width="800" height="75" fill="url(#bg)" opacity="0.7"/>
  <text x="32" y="408" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#FFED00" letter-spacing="2">PHOENIX 4TH OF JULY</text>
  <text x="32" y="432" font-family="Georgia, serif" font-size="13" fill="#94a3b8" letter-spacing="1">Scottsdale, AZ  ·  July 2–5, 2026</text>
</svg>