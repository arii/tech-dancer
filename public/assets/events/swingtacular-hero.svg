<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="space" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a0535"/>
      <stop offset="50%" stop-color="#0d011f"/>
      <stop offset="100%" stop-color="#000005"/>
    </radialGradient>
    <radialGradient id="nebula1" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="70%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula3" cx="55%" cy="70%" r="30%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="planetGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#space)"/>
  <rect width="800" height="450" fill="url(#nebula1)"/>
  <rect width="800" height="450" fill="url(#nebula2)"/>
  <rect width="800" height="450" fill="url(#nebula3)"/>

  <!-- Stars -->
  <g filter="url(#starGlow)">
    <circle cx="45" cy="30" r="1.5" fill="white" opacity="0.9"/>
    <circle cx="120" cy="18" r="1" fill="#e0d0ff" opacity="0.8"/>
    <circle cx="195" cy="42" r="1.8" fill="white" opacity="1"/>
    <circle cx="260" cy="15" r="1.2" fill="#ffd0f0" opacity="0.85"/>
    <circle cx="340" cy="55" r="1" fill="white" opacity="0.7"/>
    <circle cx="415" cy="22" r="2" fill="white" opacity="0.95"/>
    <circle cx="490" cy="38" r="1.3" fill="#c0d0ff" opacity="0.8"/>
    <circle cx="565" cy="12" r="1.5" fill="white" opacity="0.9"/>
    <circle cx="635" cy="48" r="1" fill="#ffd0f0" opacity="0.75"/>
    <circle cx="710" cy="25" r="1.8" fill="white" opacity="0.95"/>
    <circle cx="770" cy="40" r="1.2" fill="#e0d0ff" opacity="0.8"/>
    <circle cx="70" cy="90" r="1" fill="white" opacity="0.6"/>
    <circle cx="165" cy="105" r="1.4" fill="white" opacity="0.75"/>
    <circle cx="290" cy="88" r="1.1" fill="#ffd0f0" opacity="0.7"/>
    <circle cx="445" cy="100" r="1" fill="white" opacity="0.65"/>
    <circle cx="570" cy="82" r="1.6" fill="#c0d0ff" opacity="0.8"/>
    <circle cx="680" cy="95" r="1.2" fill="white" opacity="0.7"/>
    <circle cx="750" cy="110" r="0.8" fill="white" opacity="0.55"/>
    <circle cx="30" cy="160" r="1" fill="white" opacity="0.5"/>
    <circle cx="140" cy="175" r="1.3" fill="#e0d0ff" opacity="0.65"/>
    <circle cx="320" cy="155" r="0.9" fill="white" opacity="0.6"/>
    <circle cx="520" cy="168" r="1.1" fill="white" opacity="0.55"/>
    <circle cx="730" cy="150" r="1.5" fill="#ffd0f0" opacity="0.7"/>
  </g>

  <!-- Large planet (Saturn-like) -->
  <g filter="url(#planetGlow)">
    <!-- Ring -->
    <ellipse cx="620" cy="130" rx="80" ry="18" fill="none" stroke="#a855f7" stroke-width="8" opacity="0.5"/>
    <ellipse cx="620" cy="130" rx="75" ry="16" fill="none" stroke="#6366f1" stroke-width="4" opacity="0.35"/>
    <!-- Planet body -->
    <circle cx="620" cy="130" r="42" fill="#2d1060"/>
    <circle cx="620" cy="130" r="42" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.4"/>
    <!-- Surface bands -->
    <ellipse cx="620" cy="118" rx="38" ry="6" fill="#3d1880" opacity="0.7"/>
    <ellipse cx="620" cy="140" rx="38" ry="5" fill="#4a22a0" opacity="0.5"/>
    <!-- Highlight -->
    <circle cx="605" cy="115" r="14" fill="white" opacity="0.06"/>
  </g>

  <!-- Smaller accent planet -->
  <circle cx="120" cy="200" r="22" fill="#1a0a3a"/>
  <circle cx="120" cy="200" r="22" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.5"/>
  <circle cx="113" cy="194" r="8" fill="white" opacity="0.04"/>

  <!-- Shooting star -->
  <line x1="200" y1="60" x2="320" y2="100" stroke="white" stroke-width="1.5" opacity="0.6"/>
  <circle cx="200" cy="60" r="2.5" fill="white" opacity="0.9" filter="url(#starGlow)"/>

  <!-- Disco ball / glitter effect in centre -->
  <g transform="translate(390, 220)">
    <circle r="55" fill="#1a0535" opacity="0.8"/>
    <circle r="50" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.3"/>
    <!-- Grid lines for disco ball -->
    <g stroke="#a855f7" stroke-width="0.5" opacity="0.4">
      <line x1="-50" y1="0" x2="50" y2="0"/>
      <line x1="-50" y1="-20" x2="50" y2="-20"/>
      <line x1="-50" y1="20" x2="50" y2="20"/>
      <line x1="0" y1="-50" x2="0" y2="50"/>
      <line x1="-20" y1="-46" x2="-20" y2="46"/>
      <line x1="20" y1="-46" x2="20" y2="46"/>
    </g>
    <!-- Sparkle reflections -->
    <g fill="white" filter="url(#starGlow)">
      <circle cx="-25" cy="-22" r="2.5" opacity="0.9"/>
      <circle cx="30" cy="-10" r="2" opacity="0.8"/>
      <circle cx="-10" cy="28" r="2.5" opacity="0.85"/>
      <circle cx="22" cy="20" r="2" opacity="0.75"/>
      <circle cx="-38" cy="5" r="1.5" opacity="0.7"/>
      <circle cx="40" cy="-30" r="1.5" opacity="0.65"/>
    </g>
  </g>

  <!-- Ground floor glow -->
  <ellipse cx="400" cy="420" rx="320" ry="40" fill="#6366f1" opacity="0.08"/>
  <rect x="0" y="360" width="800" height="90" fill="#000005" opacity="0.5"/>

  <!-- Label -->
  <text x="32" y="400" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#a855f7" letter-spacing="2">SWINGTACULAR: THE GALACTIC OPEN</text>
  <text x="32" y="425" font-family="Georgia, serif" font-size="13" fill="#94a3b8" letter-spacing="1">Burlingame, CA  ·  August 14–17, 2026</text>
</svg>