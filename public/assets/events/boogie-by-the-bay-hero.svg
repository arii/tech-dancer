<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="60%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#2d1b5e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2a4a"/>
      <stop offset="100%" stop-color="#061520"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="100%" stop-color="#f0d060"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- Stars -->
  <g opacity="0.8">
    <circle cx="80" cy="40" r="1.2" fill="white" opacity="0.9"/>
    <circle cx="150" cy="25" r="0.8" fill="white" opacity="0.7"/>
    <circle cx="220" cy="55" r="1" fill="white" opacity="0.8"/>
    <circle cx="310" cy="30" r="1.5" fill="white" opacity="0.9"/>
    <circle cx="380" cy="18" r="0.8" fill="white" opacity="0.6"/>
    <circle cx="460" cy="45" r="1.2" fill="white" opacity="0.85"/>
    <circle cx="530" cy="22" r="1" fill="white" opacity="0.75"/>
    <circle cx="620" cy="38" r="1.4" fill="white" opacity="0.9"/>
    <circle cx="700" cy="15" r="0.8" fill="white" opacity="0.7"/>
    <circle cx="740" cy="50" r="1.1" fill="white" opacity="0.8"/>
    <circle cx="100" cy="80" r="0.7" fill="white" opacity="0.5"/>
    <circle cx="270" cy="70" r="1" fill="white" opacity="0.65"/>
    <circle cx="490" cy="75" r="0.9" fill="white" opacity="0.6"/>
    <circle cx="660" cy="68" r="1.2" fill="white" opacity="0.75"/>
  </g>

  <!-- Moon glow -->
  <circle cx="680" cy="80" r="45" fill="#1a1040" opacity="0.5" filter="url(#softglow)"/>
  <!-- Moon -->
  <circle cx="680" cy="80" r="32" fill="url(#moon)" filter="url(#glow)"/>
  <circle cx="668" cy="74" r="26" fill="#0a0a1a" opacity="0.08"/>

  <!-- Bay Bridge silhouette (simplified) -->
  <g fill="#0d1a2e" opacity="0.9">
    <!-- Water base -->
    <rect x="0" y="300" width="800" height="150" fill="url(#water)"/>
    <!-- Water shimmer -->
    <ellipse cx="400" cy="310" rx="300" ry="15" fill="#1e4a6e" opacity="0.3"/>
    <ellipse cx="680" cy="320" rx="80" ry="8" fill="#f0d060" opacity="0.08"/>

    <!-- Bridge towers -->
    <rect x="280" y="180" width="18" height="130" fill="#0d1a2e"/>
    <rect x="500" y="190" width="18" height="120" fill="#0d1a2e"/>
    <!-- Bridge deck -->
    <rect x="100" y="268" width="600" height="10" fill="#0d1a2e"/>
    <rect x="80" y="275" width="640" height="6" fill="#111e33"/>
    <!-- Suspension cables (left tower) -->
    <line x1="289" y1="185" x2="100" y2="270" stroke="#0d1a2e" stroke-width="2"/>
    <line x1="289" y1="185" x2="200" y2="270" stroke="#0d1a2e" stroke-width="1.5"/>
    <line x1="289" y1="185" x2="289" y2="270" stroke="#0d1a2e" stroke-width="1.5"/>
    <line x1="289" y1="185" x2="400" y2="270" stroke="#0d1a2e" stroke-width="1.5"/>
    <!-- Suspension cables (right tower) -->
    <line x1="509" y1="195" x2="400" y2="270" stroke="#0d1a2e" stroke-width="1.5"/>
    <line x1="509" y1="195" x2="509" y2="270" stroke="#0d1a2e" stroke-width="1.5"/>
    <line x1="509" y1="195" x2="620" y2="270" stroke="#0d1a2e" stroke-width="1.5"/>
    <line x1="509" y1="195" x2="720" y2="270" stroke="#0d1a2e" stroke-width="2"/>
  </g>

  <!-- Bridge lights -->
  <g filter="url(#glow)" opacity="0.7">
    <circle cx="289" cy="183" r="3" fill="#f0d060"/>
    <circle cx="509" cy="193" r="3" fill="#f0d060"/>
    <circle cx="140" cy="269" r="2" fill="#00cfff"/>
    <circle cx="200" cy="269" r="2" fill="#00cfff"/>
    <circle cx="260" cy="269" r="2" fill="#00cfff"/>
    <circle cx="340" cy="269" r="2" fill="#00cfff"/>
    <circle cx="420" cy="269" r="2" fill="#00cfff"/>
    <circle cx="500" cy="269" r="2" fill="#00cfff"/>
    <circle cx="580" cy="269" r="2" fill="#00cfff"/>
    <circle cx="640" cy="269" r="2" fill="#00cfff"/>
  </g>

  <!-- City skyline silhouette -->
  <g fill="#111e33" opacity="0.95">
    <rect x="0" y="230" width="40" height="70"/>
    <rect x="35" y="220" width="25" height="80"/>
    <rect x="55" y="240" width="20" height="60"/>
    <rect x="70" y="210" width="30" height="90"/>
    <rect x="95" y="225" width="22" height="75"/>
    <!-- Right side -->
    <rect x="640" y="235" width="30" height="65"/>
    <rect x="665" y="220" width="22" height="80"/>
    <rect x="682" y="228" width="35" height="72"/>
    <rect x="712" y="215" width="28" height="85"/>
    <rect x="735" y="232" width="25" height="68"/>
    <rect x="755" y="225" width="45" height="75"/>
  </g>

  <!-- City window lights -->
  <g opacity="0.6" fill="#f0d060">
    <rect x="8" y="240" width="4" height="3"/>
    <rect x="16" y="235" width="4" height="3"/>
    <rect x="42" y="228" width="4" height="3"/>
    <rect x="75" y="218" width="4" height="3"/>
    <rect x="82" y="225" width="3" height="3"/>
    <rect x="648" y="240" width="4" height="3"/>
    <rect x="670" y="228" width="4" height="3"/>
    <rect x="690" y="235" width="4" height="3"/>
    <rect x="720" y="222" width="4" height="3"/>
    <rect x="745" y="232" width="4" height="3"/>
    <rect x="762" y="230" width="4" height="3"/>
  </g>

  <!-- Moon reflection on water -->
  <ellipse cx="680" cy="340" rx="30" ry="60" fill="#f0d060" opacity="0.06"/>

  <!-- Cyan accent glow bottom -->
  <ellipse cx="400" cy="440" rx="200" ry="30" fill="#00cfff" opacity="0.04"/>

  <!-- Label overlay -->
  <rect x="0" y="380" width="800" height="70" fill="url(#sky)" opacity="0.6"/>
  <text x="32" y="415" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#00cfff" letter-spacing="2">BOOGIE BY THE BAY</text>
  <text x="32" y="438" font-family="Georgia, serif" font-size="13" fill="#94a3b8" letter-spacing="1">Burlingame, CA  ·  October 8–11, 2026</text>
</svg>