<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tech-Dancer // Redirecting...</title>
    <script type="text/javascript">
      // This script checks if the current URL is a deep-link and
      // redirects the browser to index.html with the path encoded
      // as a query string, so the router can pick it up.

      var l = window.location;
      var repoName = 'tech-dancer';

      var path = l.pathname;
      var segments = path.split('/');
      var pathSegmentsToKeep = 0;

      if (segments[1] === repoName) {
        pathSegmentsToKeep = 1;
        // Check if we are in a branch subdirectory (e.g., /tech-dancer/fix/branch-name/...)
        // Supporting fix, feat, feature, ux, and any other subfolders
        if (['fix', 'feat', 'feature', 'ux'].indexOf(segments[2]) !== -1) {
          pathSegmentsToKeep = 3;
        }
      }

      var redirectPath = segments.slice(0, 1 + pathSegmentsToKeep).join('/') + '/index.html';
      var queryPath = segments.slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~');

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        redirectPath + '?p=/' + queryPath +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
