<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .brand-stop-accent { stop-color: #22d3ee; }
    .brand-stop-purple { stop-color: #8b5cf6; }
    .brand-text-accent { fill: #22d3ee; }
    .brand-text-muted { fill: rgba(241, 245, 249, 0.6); }
    .brand-wordmark {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-weight: 800;
    }
  </style>
  <rect width="64" height="64" rx="14" fill="#020617"/>
  
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="24" class="brand-wordmark">
    <tspan fill="white">B</tspan>
    <tspan class="brand-text-accent" fill="#22d3ee">T</tspan>
  </text>
</svg>
