<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="14" class="brand-bg-rect" />
  <defs>
    <linearGradient id="bt-favicon-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" class="brand-stop-accent" />
      <stop offset="100%" class="brand-stop-purple" />
    </linearGradient>
    <filter id="bt-favicon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <g transform="translate(8, 50)">
    <!-- The "B" Mark -->
    <text
      x="0"
      y="0"
      transform="skewX(-8)"
      class="brand-b-mark-sm"
    >B</text>
    
    <!-- The Glowing Gradient Dot -->
    <circle
      cx="42"
      cy="-14"
      r="8"
      fill="url(#bt-favicon-grad)"
      filter="url(#bt-favicon-glow)"
    />
  </g>
</svg>
