<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg_rh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080518"/>
      <stop offset="100%" stop-color="#120824"/>
    </linearGradient>
    <filter id="glow_rh">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#bg_rh)"/>

  <!-- UUS notation grid lines -->
  <g stroke="#1e1440" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="75" y1="0" x2="75" y2="340"/>
    <line x1="150" y1="0" x2="150" y2="340"/>
    <line x1="225" y1="0" x2="225" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="375" y1="0" x2="375" y2="340"/>
    <line x1="450" y1="0" x2="450" y2="340"/>
    <line x1="525" y1="0" x2="525" y2="340"/>
  </g>

  <!-- Beat numbers -->
  <g font-family="monospace" font-size="11" fill="#4a3880" opacity="0.7">
    <text x="37" y="25">1</text>
    <text x="112" y="25">2</text>
    <text x="187" y="25">3</text>
    <text x="262" y="25">&amp;</text>
    <text x="337" y="25">4</text>
    <text x="412" y="25">5</text>
    <text x="487" y="25">&amp;</text>
    <text x="562" y="25">6</text>
  </g>

  <!-- Weight dots (•) for 6-beat pattern — large teal -->
  <g filter="url(#glow_rh)">
    <circle cx="37" cy="170" r="16" fill="#00cfff" opacity="0.9"/>
    <circle cx="112" cy="170" r="16" fill="#00cfff" opacity="0.9"/>
    <circle cx="187" cy="170" r="10" fill="#00cfff" opacity="0.6"/>
    <circle cx="225" cy="170" r="10" fill="#00cfff" opacity="0.6"/>
    <circle cx="337" cy="170" r="16" fill="#00cfff" opacity="0.9"/>
    <circle cx="412" cy="170" r="10" fill="#00cfff" opacity="0.6"/>
    <circle cx="450" cy="170" r="10" fill="#00cfff" opacity="0.6"/>
  </g>

  <!-- Connect line -->
  <polyline points="37,170 112,170 187,170 225,170 337,170 412,170 450,170" fill="none" stroke="#00cfff" stroke-width="1.5" opacity="0.2"/>

  <!-- BoomTick wordmark large -->
  <text x="300" y="290" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#1e1440" text-anchor="middle" opacity="0.8">B•</text>
  <text x="300" y="290" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="none" stroke="#00cfff" stroke-width="0.8" text-anchor="middle" opacity="0.4">B•</text>

  <!-- Accent overlay bottom -->
  <rect x="0" y="300" width="600" height="40" fill="#080518" opacity="0.7"/>
  <text x="20" y="324" font-family="monospace" font-size="12" fill="#6040c0" letter-spacing="3">WCS · RHYTHMIC ARCHITECTURE</text>
</svg>