<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8fafc" rx="8" />
  <style>
    .shoe { fill: #f1f5f9; stroke: #334155; stroke-width: 2.5; stroke-opacity: 0.6; }
    .suede-sheet { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 2; }
    .pen { fill: #1e293b; }
    .text { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; fill: #1e293b; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; font-weight: 600; fill: #0891b2; }
  </style>
  <g transform="translate(100, 40)">
    <rect class="suede-sheet" x="-10" y="0" width="180" height="230" rx="4" />
    <path class="shoe" d="M30,20 Q80,0 120,20 Q150,50 140,150 Q130,250 110,300 Q90,340 75,340 Q60,340 40,300 Q20,250 10,150 Q0,50 30,20 Z" />
    <rect class="pen" x="135" y="60" width="4" height="35" rx="1" transform="rotate(25, 137, 77)" />
    <text x="145" y="55" class="label">Trace on backing paper</text>
  </g>
  <text x="200" y="275" class="text">2. Trace the shoe outline</text>
</svg>
