<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .shoe { fill: #f0f0f0; stroke: #333; stroke-width: 2; }
    .suede-sheet { fill: #ddd; stroke: #999; stroke-width: 1; }
    .pen { fill: #333; }
  </style>
  <rect width="400" height="300" fill="#fafafa" />
  <g transform="translate(100, 50)">
    <!-- Suede Sheet -->
    <rect class="suede-sheet" x="-20" y="0" width="200" height="250" />
    <!-- Shoe on Sheet -->
    <path class="shoe" d="M30,20 Q80,0 120,20 Q150,50 140,150 Q130,250 110,300 Q90,340 75,340 Q60,340 40,300 Q20,250 10,150 Q0,50 30,20 Z" opacity="0.7" />
    <!-- Pen -->
    <rect class="pen" x="130" y="50" width="5" height="40" transform="rotate(30, 132, 70)" />
    <path d="M130,50 L125,45" stroke="#333" stroke-width="2" />
  </g>
  <text x="200" y="280" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333">2. Trace the shoe outline</text>
</svg>
