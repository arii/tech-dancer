<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="400" height="300" rx="8" />
  <style>
    .bg { fill: #0f172a; }
    .shoe { fill: #1e293b; stroke: #334155; stroke-width: 3; }
    .suede { fill: #475569; stroke: #64748b; stroke-width: 2; }
    .accent-line { stroke: #22d3ee; stroke-width: 2.5; fill: none; stroke-dasharray: 4,4; }
    .text { font-family: 'Albert Sans', system-ui, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; fill: #f1f5f9; }
    .label { font-family: 'Albert Sans', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #22d3ee; text-anchor: middle; }
    .tool { fill: #94a3b8; stroke: #f1f5f9; stroke-width: 1.5; }
    .checkmark { stroke: #22d3ee; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>

  <g transform="translate(125, 40) scale(0.8)">
    <path class="shoe" d="M30,20 Q80,0 120,20 Q150,50 140,150 Q130,250 110,300 Q90,340 75,340 Q60,340 40,300 Q20,250 10,150 Q0,50 30,20 Z" />
    <path class="accent-line" d="M30,20 Q80,0 120,20 Q150,50 140,150 Q130,250 110,300 Q90,340 75,340 Q60,340 40,300 Q20,250 10,150 Q0,50 30,20 Z" transform="translate(2, 2)" />
    <g transform="translate(140, 100)">
      <path class="tool" d="M0,0 L5,25 L-5,25 Z" transform="rotate(-30)" />
      <text y="45" class="label">Trace 1:1 scale</text>
    </g>
  </g>

  <text x="200" y="270" class="text">2. Trace the outline onto the suede backing</text>
</svg>