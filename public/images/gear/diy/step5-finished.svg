<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .shoe { fill: #f0f0f0; stroke: #333; stroke-width: 2; }
    .suede { fill: #888; stroke: #555; stroke-width: 1; }
    .check { fill: none; stroke: #4caf50; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="400" height="300" fill="#fafafa" />
  <g transform="translate(100, 50)">
    <!-- Finished Shoe -->
    <path class="shoe" d="M30,20 Q80,0 120,20 Q150,50 140,150 Q130,250 110,300 Q90,340 75,340 Q60,340 40,300 Q20,250 10,150 Q0,50 30,20 Z" />
    <path class="suede" d="M33,25 Q80,5 117,25 Q145,55 135,150 Q125,245 107,295 Q88,335 75,335 Q62,335 43,295 Q25,245 15,150 Q5,55 33,25 Z" />
    <!-- Checkmark -->
    <path class="check" d="M140,100 L170,130 L230,70" transform="translate(-40, 20)" />
  </g>
  <text x="200" y="280" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333">5. Let cure for 24 hours</text>
</svg>
