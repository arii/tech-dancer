<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .suede-sheet { fill: #ddd; stroke: #999; stroke-width: 1; }
    .trace { fill: none; stroke: #333; stroke-width: 1; stroke-dasharray: 4,2; }
    .scissors { fill: #555; }
  </style>
  <rect width="400" height="300" fill="#fafafa" />
  <g transform="translate(100, 50)">
    <!-- Suede Sheet -->
    <rect class="suede-sheet" x="-20" y="0" width="200" height="250" />
    <!-- Traced Line -->
    <path class="trace" d="M30,20 Q80,0 120,20 Q150,50 140,150 Q130,250 110,300 Q90,340 75,340 Q60,340 40,300 Q20,250 10,150 Q0,50 30,20 Z" />
    <!-- Scissors -->
    <g transform="translate(140, 40) rotate(-45)">
      <rect class="scissors" x="0" y="0" width="40" height="5" rx="2" />
      <rect class="scissors" x="0" y="10" width="40" height="5" rx="2" transform="rotate(20, 0, 10)" />
      <circle cx="0" cy="2.5" r="5" fill="none" stroke="#555" stroke-width="2" />
      <circle cx="0" cy="12.5" r="5" fill="none" stroke="#555" stroke-width="2" />
    </g>
  </g>
  <text x="200" y="280" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333">3. Cut inside the traced line</text>
</svg>
