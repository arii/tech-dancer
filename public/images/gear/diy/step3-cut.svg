<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#f8fafc" rx="8" />
  <style>
    .suede-sheet { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 2; }
    .trace { fill: none; stroke: #334155; stroke-width: 1.5; stroke-dasharray: 4,2; }
    .cut-line { fill: none; stroke: #22d3ee; stroke-width: 2.5; }
    .scissors { fill: #475569; }
    .text { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; fill: #1e293b; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; font-weight: 600; fill: #0891b2; }
  </style>
  <g transform="translate(100, 40)">
    <rect class="suede-sheet" x="-10" y="0" width="180" height="230" rx="4" />
    <path class="trace" d="M30,20 Q80,0 120,20 Q150,50 140,150 Q130,250 110,300 Q90,340 75,340 Q60,340 40,300 Q20,250 10,150 Q0,50 30,20 Z" />
    <path class="cut-line" d="M33,25 Q80,5 117,25 Q145,55 135,150" />
    <text x="95" y="20" class="label">Trace 2mm inside for fit</text>
    <g transform="translate(145, 35) rotate(-45)">
      <rect class="scissors" x="0" y="0" width="35" height="4" rx="1" />
      <rect class="scissors" x="0" y="8" width="35" height="4" rx="1" transform="rotate(15, 0, 8)" />
      <circle cx="-5" cy="2" r="6" fill="none" stroke="#475569" stroke-width="2" />
      <circle cx="-5" cy="14" r="6" fill="none" stroke="#475569" stroke-width="2" />
    </g>
  </g>
  <text x="200" y="275" class="text">3. Cut inside the traced outline</text>
</svg>
