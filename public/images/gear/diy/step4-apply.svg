<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .shoe { fill: #f0f0f0; stroke: #333; stroke-width: 2; }
    .suede { fill: #888; stroke: #555; stroke-width: 1; }
    .hand { fill: #ffe0bd; stroke: #8d5524; stroke-width: 1; }
  </style>
  <rect width="400" height="300" fill="#fafafa" />
  <g transform="translate(100, 50)">
    <!-- Shoe Sole Up -->
    <path class="shoe" d="M30,20 Q80,0 120,20 Q150,50 140,150 Q130,250 110,300 Q90,340 75,340 Q60,340 40,300 Q20,250 10,150 Q0,50 30,20 Z" />
    <!-- Applying Suede (partially applied) -->
    <path class="suede" d="M30,20 Q80,0 120,20 Q150,50 140,150 L10,150 Q0,50 30,20 Z" />
    <!-- Hand pressing -->
    <circle class="hand" cx="75" cy="100" r="25" />
  </g>
  <text x="200" y="280" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333">4. Apply suede from toe to heel</text>
</svg>
