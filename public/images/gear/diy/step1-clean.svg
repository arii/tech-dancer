<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .shoe { fill: #f0f0f0; stroke: #333; stroke-width: 2; }
    .hand { fill: #ffe0bd; stroke: #8d5524; stroke-width: 1; }
    .cloth { fill: #fff; stroke: #ccc; stroke-width: 1; }
    .sparkle { fill: #fff; stroke: #00f; stroke-width: 1; }
  </style>
  <rect width="400" height="300" fill="#fafafa" />
  <g transform="translate(100, 50)">
    <!-- Shoe Sole Up -->
    <path class="shoe" d="M30,20 Q80,0 120,20 Q150,50 140,150 Q130,250 110,300 Q90,340 75,340 Q60,340 40,300 Q20,250 10,150 Q0,50 30,20 Z" transform="rotate(10, 75, 170)" />
    <!-- Hand with Cloth -->
    <circle class="hand" cx="160" cy="120" r="30" />
    <rect class="cloth" x="130" y="100" width="40" height="40" rx="5" transform="rotate(-20, 150, 120)" />
    <!-- Cleaning Motion -->
    <path d="M120,100 Q140,90 160,110" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="5,5" />
  </g>
  <text x="200" y="280" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333">1. Clean the sole with alcohol</text>
</svg>
