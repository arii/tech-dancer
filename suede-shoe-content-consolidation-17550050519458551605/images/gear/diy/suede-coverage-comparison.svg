<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f8fafc" rx="12" />
  <style>
    .sole { fill: #f1f5f9; stroke: #334155; stroke-width: 2.5; }
    .suede { fill: #94a3b8; stroke: #475569; stroke-width: 2; }
    .text { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; fill: #1e293b; }
    .subtext { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; font-weight: 500; text-anchor: middle; fill: #64748b; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; font-weight: 600; fill: #0891b2; text-anchor: middle; }
  </style>

  <!-- Ball Only -->
  <g transform="translate(150, 40)">
    <path class="sole" d="M30,20 Q80,0 120,20 Q150,50 140,150 Q130,250 110,300 Q90,340 75,340 Q60,340 40,300 Q20,250 10,150 Q0,50 30,20 Z" />
    <ellipse class="suede" cx="75" cy="80" rx="55" ry="45" />
    <text x="75" y="360" class="text">Ball Only</text>
    <text x="75" y="380" class="subtext">Maximum Spin Speed</text>
  </g>

  <!-- Split -->
  <g transform="translate(400, 40)">
    <path class="sole" d="M30,20 Q80,0 120,20 Q150,50 140,150 Q130,250 110,300 Q90,340 75,340 Q60,340 40,300 Q20,250 10,150 Q0,50 30,20 Z" />
    <ellipse class="suede" cx="75" cy="80" rx="55" ry="45" />
    <path class="suede" d="M35,270 Q75,250 115,270 Q110,320 75,325 Q40,320 35,270 Z" />
    <text x="75" y="360" class="text">Split</text>
    <text x="75" y="380" class="subtext">Braking + Rotation</text>
  </g>

  <!-- Full -->
  <g transform="translate(650, 40)">
    <path class="sole" d="M30,20 Q80,0 120,20 Q150,50 140,150 Q130,250 110,300 Q90,340 75,340 Q60,340 40,300 Q20,250 10,150 Q0,50 30,20 Z" />
    <path class="suede" d="M33,25 Q80,5 117,25 Q145,55 135,150 Q125,245 107,295 Q88,335 75,335 Q62,335 43,295 Q25,245 15,150 Q5,55 33,25 Z" />
    <text x="75" y="360" class="text">Full Coverage</text>
    <text x="75" y="380" class="subtext">Consistent & Durable</text>
    <text x="75" y="20" class="label">RECOMMENDED</text>
  </g>
</svg>
