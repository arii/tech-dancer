name: 'Auto Conflict Resolver'

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: false
        type: string
      comment_body:
        description: 'Comment body'
        required: false
        type: string
      target_branch:
        description: 'The branch to merge into'
        required: true
        default: 'main'
      source_branch:
        description: 'The branch to merge from'
        required: true
      pr_number:
        description: 'The PR number to comment on (optional)'
        required: false
        default: '0'
  workflow_call:
    inputs:
      target_branch:
        description: 'The branch to merge into'
        required: false
        type: string
        default: 'main'
      source_branch:
        description: 'The branch to merge from'
        required: true
        type: string
      pr_number:
        description: 'The PR number to comment on (required for feedback)'
        required: true
        type: string

jobs:
  resolve:
    uses: ./boomtick-pkg/workflows/conflict-resolver-reusable.yml
    with:
      issue_number: ${{ inputs.issue_number }}
      comment_body: ${{ inputs.comment_body }}
      target_branch: ${{ inputs.target_branch }}
      source_branch: ${{ inputs.source_branch }}
      pr_number: ${{ inputs.pr_number }}
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
