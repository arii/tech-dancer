name: Issue Operations

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - ai-review
          - resolve-conflicts
          - update-snapshots
      issue_number:
        description: 'Issue or PR number'
        required: true
        type: string
      comment_body:
        description: 'Comment body (optional)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  validate-quality:
    name: Validate Issue Quality
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Run Issue Operations - Validate Quality
        uses: arii/boomtick@main
        with:
          github-app-id: ${{ secrets.APP_ID }}
          github-app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          jules-api-key: ${{ secrets.JULES_API_KEY }}
          send-to-jules: "true"

  create-pr:
    name: Issue to Content PR
    if: |
      github.event_name == 'issues' &&
      startsWith(github.event.issue.title, 'Draft') &&
      contains(github.event.issue.title, ':') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Run Issue Operations - Create PR
        uses: arii/boomtick@main
        with:
          github-app-id: ${{ secrets.APP_ID }}
          github-app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          jules-api-key: ${{ secrets.JULES_API_KEY }}
          send-to-jules: "true"

  ai-review:
    name: AI Review
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'ai-review'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Run Issue Operations - AI Review
        uses: arii/boomtick@main
        with:
          github-app-id: ${{ secrets.APP_ID }}
          github-app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          jules-api-key: ${{ secrets.JULES_API_KEY }}
          send-to-jules: "true"

  resolve-conflicts:
    name: Resolve PR Conflicts
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'resolve-conflicts'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Run Issue Operations - Resolve Conflicts
        uses: arii/boomtick@main
        with:
          github-app-id: ${{ secrets.APP_ID }}
          github-app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          jules-api-key: ${{ secrets.JULES_API_KEY }}
          send-to-jules: "true"

  update-snapshots:
    name: Update Playwright Snapshots
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'update-snapshots'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Run Issue Operations - Update Snapshots
        uses: arii/boomtick@main
        with:
          github-app-id: ${{ secrets.APP_ID }}
          github-app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          jules-api-key: ${{ secrets.JULES_API_KEY }}
          send-to-jules: "true"
