name: Ollama ChatOps

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  handle-command:
    if: github.event.issue.pull_request && (startsWith(github.event.comment.body, '/ollama-fix') || startsWith(github.event.comment.body, '/ollama-review'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', 'dev-tools/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Dependencies
        run: |
          if ! python3 -c "import click, github, requests" 2>/dev/null; then
            pip install click PyGithub requests
          fi
          if [ ! -d "node_modules" ]; then
            pnpm install --frozen-lockfile
          fi

      - name: Start Ollama Server
        run: |
          ollama serve > ollama_output.log 2>&1 &
          sleep 5
          curl -f --retry 10 --retry-delay 2 http://localhost:11434/api/tags || (cat ollama_output.log && exit 1)

      - name: Pull & Build Models
        run: |
          ollama pull qwen2.5-coder:7b
          ollama create code-reviewer -f dev-tools/CodeReviewer.mf

      - name: Resolve PR Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh pr view "${{ github.event.issue.number }}" --json headRefName)
          HEAD_REF=$(echo "$PR_JSON" | jq -r .headRefName)
          echo "HEAD_REF=$HEAD_REF" >> $GITHUB_ENV
          gh pr checkout "${{ github.event.issue.number }}"

      - name: Execute Command
        env:
          PYTHONPATH: "$(pwd)/dev-tools"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMAND_BODY: ${{ github.event.comment.body }}
        run: |
          python3 dev-tools/td_cli.py ai comment \
            --pr ${{ github.event.issue.number }} \
            --command "$COMMAND_BODY" \
            --comment-id ${{ github.event.comment.id }}

      - name: Commit Fixes
        if: startsWith(github.event.comment.body, '/ollama-fix')
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-resolved merge conflicts using /ollama-fix"
          branch: ${{ env.HEAD_REF }}
          file_pattern: '.'
