name: Ollama ChatOps

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  handle-command:
    if: github.event.issue.pull_request && (startsWith(github.event.comment.body, '/ollama-fix') || startsWith(github.event.comment.body, '/ollama-review'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Ollama
        uses: ai-action/setup-ollama@v2

      - name: Install Dependencies
        run: |
          pip install click PyGithub requests
          pnpm install --frozen-lockfile

      - name: Start Ollama Server
        run: |
          ollama serve > ollama_output.log 2>&1 &
          for i in {1..15}; do
            if curl -s http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama server is ready!"
              sleep 1
              exit 0
            fi
            echo "Waiting for Ollama server (attempt $i)..."
            sleep 2
          done
          echo "❌ Ollama server failed to start within timeout"
          cat ollama_output.log
          exit 1

      - name: Pull & Build Models
        run: |
          ollama pull qwen2.5-coder:7b
          ollama create code-reviewer -f dev-tools/CodeReviewer.mf

      - name: Resolve PR Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh pr view "${{ github.event.issue.number }}" --json headRefName)
          HEAD_REF=$(echo "$PR_JSON" | jq -r .headRefName)
          echo "HEAD_REF=$HEAD_REF" >> $GITHUB_ENV
          gh pr checkout "${{ github.event.issue.number }}"

      - name: Execute Command
        env:
          PYTHONPATH: "$(pwd)/dev-tools"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMAND_BODY: ${{ github.event.comment.body }}
        run: |
          python3 dev-tools/td_cli.py ai comment \
            --pr ${{ github.event.issue.number }} \
            --command "$COMMAND_BODY" \
            --comment-id ${{ github.event.comment.id }}

      - name: Commit Fixes
        if: startsWith(github.event.comment.body, '/ollama-fix')
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-resolved merge conflicts using /ollama-fix"
          branch: ${{ env.HEAD_REF }}
          file_pattern: '.'
