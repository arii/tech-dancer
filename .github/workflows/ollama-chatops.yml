name: Ollama ChatOps

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
        type: string
      comment_body:
        description: 'Comment body'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  handle-command:
    if: github.repository == 'disabled'

    runs-on: ubuntu-latest
    env:
      PYTHONPATH: dev-tools
      OLLAMA_MODEL: qwen2.5-coder:1.5b
      OLLAMA_SYNTHESIS_MODEL: qwen2.5-coder:1.5b
      OLLAMA_BASE_URL: http://localhost:11434
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Check active runtime
        run: |
          pnpm run check:runtime-files
          pnpm run doctor

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', 'dev-tools/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Dependencies
        run: |
          if ! python3 -c "import click, github, requests" 2>/dev/null; then
            pip install click PyGithub requests
          fi
          if [ ! -d "node_modules" ]; then
            pnpm install --frozen-lockfile
          fi

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          echo "Waiting for Ollama to be ready..."
          for i in {1..15}; do
            if curl -sf http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama is ready!"
              ollama list
              exit 0
            fi
            echo "Waiting... ($i/15)"
            sleep 2
          done
          echo "Ollama failed to start"
          cat /tmp/ollama.log
          exit 1

      - name: Validate CLI
        run: |
          python3 dev-tools/td_cli.py gh --help
          python3 dev-tools/td_cli.py ai --help

      - name: Resolve PR Branch
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          PR_JSON=$(gh pr view "$ISSUE_NUMBER" --json headRefName)
          HEAD_REF=$(echo "$PR_JSON" | jq -r .headRefName)
          echo "HEAD_REF=$HEAD_REF" >> "$GITHUB_ENV"
          gh pr checkout "$ISSUE_NUMBER"

      - name: Execute Review
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          chmod +x dev-tools/low-compute-review.sh
          ./dev-tools/low-compute-review.sh "$ISSUE_NUMBER" --no-cache

      - name: Commit Fixes
        if: contains(inputs.comment_body, '/ollama-fix')
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-resolved merge conflicts using /ollama-fix"
          branch: ${{ env.HEAD_REF }}
          file_pattern: '.'
