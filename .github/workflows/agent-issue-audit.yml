name: Agent Issue Mass Audit

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  audit-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Mass Audit Open Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --limit 100 --json number,title,author,updatedAt,labels,body > issues.json
          python dev-tools/agent_issue_audit.py
