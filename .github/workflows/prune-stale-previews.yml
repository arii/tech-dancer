name: Prune Stale Previews
on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-branch
          fetch-depth: 0

      - name: Prune orphaned directories
        run: |
          cd gh-pages-branch

          # Get list of all active remote branches
          ACTIVE_BRANCHES=$(git ls-remote --heads origin | awk -F'refs/heads/' '{print $2}')

          NOW=$(date +%s)
          GRACE_PERIOD=86400 # 24 hours in seconds
          CHANGES_MADE=false

          # Find all index.html files to identify deployment directories (including nested ones)
          for index_file in $(find . -maxdepth 3 -name "index.html"); do
            dir=$(dirname "$index_file" | sed 's|^\./||')

            # Skip special folders and the root site
            if [[ "$dir" == "." || "$dir" == "assets" || "$dir" == "tmp" || "$dir" == "previews" ]]; then
              continue
            fi

            # Check if it doesn't match an active branch
            if ! echo "$ACTIVE_BRANCHES" | grep -Fxq "$dir"; then
              # Get the timestamp of the last update
              if [ -f "$dir/.timestamp" ]; then
                LAST_UPDATE=$(cat "$dir/.timestamp")
              else
                LAST_UPDATE=$(git log -1 --format=%ct -- "$dir")
              fi

              if [ -z "$LAST_UPDATE" ]; then
                # Fallback if git log fails for some reason
                LAST_UPDATE=0
              fi

              AGE=$((NOW - LAST_UPDATE))

              if [ "$AGE" -gt "$GRACE_PERIOD" ]; then
                echo "Branch '$dir' no longer exists and deployment is older than 24h (${AGE}s). Removing preview..."
                git rm -r "$dir"
                CHANGES_MADE=true
              else
                echo "Branch '$dir' no longer exists but deployment is within 24h grace period (${AGE}s). Skipping..."
              fi
            fi
          done

          if [ "$CHANGES_MADE" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: prune orphaned branch previews (grace period enforced)"
            git push origin gh-pages
          else
            echo "No stale previews to prune."
          fi
