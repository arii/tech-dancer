name: Prune Stale Previews
on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual triggering

concurrency:
  group: prune-stale-previews
  cancel-in-progress: false


env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout Source (for scripts)
        uses: actions/checkout@v4 # nosemgrep
        with:
          submodules: recursive
          fetch-depth: 0
          path: source

      - name: Checkout gh-pages
        uses: actions/checkout@v4 # nosemgrep
        with:
          submodules: recursive
          ref: gh-pages
          path: gh-pages-branch
          fetch-depth: 0

      - name: Prune orphaned directories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Prepare Open PR branches list for pruning
          echo "Fetching open PRs for pruning..."
          gh pr list --repo ${{ github.repository }} --state open --json headRefName --jq '.[].headRefName' > open_prs.txt

          cd gh-pages-branch

          # Use the centralized management script
          cp ../source/scripts/manage-previews.sh ./manage-previews.sh
          chmod +x ./manage-previews.sh
          ./manage-previews.sh ../open_prs.txt
          rm ./manage-previews.sh

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: prune stale previews and update metadata"
            git push origin gh-pages
          else
            echo "No changes made."
          fi
