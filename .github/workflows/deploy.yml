name: Deploy to GitHub Pages

on:
  push:
    branches:
      - '**'

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  issues: write

concurrency:
  group: "gh-pages-publish"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Build Site
        run: |
          REPO_NAME=${{ github.event.repository.name }}
          if [ "${{ github.ref_name }}" = "main" ]; then
            export VITE_BASE_PATH=/$REPO_NAME/
          else
            export VITE_BASE_PATH=/$REPO_NAME/${{ github.ref_name }}/
          fi
          export VITE_APP_URL=https://${{ github.repository_owner }}.github.io/$REPO_NAME
          pnpm run build
          git log -1 --format=%ct > dist/.timestamp

      - name: Deploy to gh-pages branch
        run: |
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Prepare dist
          mkdir -p ../gh-pages-deploy
          cp -r dist/* ../gh-pages-deploy/

          # Checkout gh-pages
          git fetch origin gh-pages
          git checkout gh-pages

          # Sync build artifacts to their destination
          DEST_DIR="${{ github.ref_name == 'main' && '.' || github.ref_name }}"
          mkdir -p "$DEST_DIR"
          cp -r ../gh-pages-deploy/* "$DEST_DIR/"

          # Ensure .nojekyll exists
          touch .nojekyll

          # Update root 404.html for branch previews
          if [ "${{ github.ref_name }}" != "main" ]; then
            cp "$DEST_DIR/404.html" ./404.html
          fi

          # Update Previews Index and Metadata
          mkdir -p previews
          find . -maxdepth 3 -name "index.html" | while read -r index_file; do
            DIR=$(dirname "$index_file" | sed 's|^\./||')
            [[ "$DIR" =~ ^(\.|\.\.|assets|tmp|previews)$ ]] && continue
            TS=$(cat "$DIR/.timestamp" 2>/dev/null || git log -1 --format=%ct -- "$DIR" || date +%s)
            echo "$DIR $TS"
          done | jq -R -n '[inputs | split(" ") | {(.[0]): (.[1] | tonumber)}] | add // {}' > previews/data.json

          # Use the dashboard from the latest build
          cp "$DEST_DIR/previews/index.html" previews/index.html

          # Commit and Push with retries
          git add .
          git commit -m "deploy: ${{ github.sha }} [skip ci]" || echo "No changes to commit"

          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Pushing to gh-pages (attempt $i)..."
            if git push origin gh-pages; then
              echo "Push successful!"
              exit 0
            fi
            echo "Push failed. Fetching and rebasing..."
            git fetch origin gh-pages
            git rebase origin/gh-pages
            sleep $((i * 2))
          done

          echo "Failed to push to gh-pages after $MAX_RETRIES attempts."
          exit 1

      - name: Update Deployment Feedback
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branchName = context.ref.replace('refs/heads/', '');
            const baseUrl = `https://${owner}.github.io/${repo}/`;
            const previewUrl = branchName === 'main' ? baseUrl : `${baseUrl}${branchName}/`;
            const dashboardUrl = `${baseUrl}previews/index.html`;

            const pstTime = new Date().toLocaleString('en-US', {
              timeZone: 'America/Los_Angeles',
              dateStyle: 'medium',
              timeStyle: 'short'
            });

            // Update Job Summary
            await core.summary
              .addHeading('🚀 Deployment Complete!')
              .addTable([
                ['Site', 'URL'],
                ['Main Site', `<a href="${baseUrl}">${baseUrl}</a>`],
                ['Preview URL', `<a href="${previewUrl}">${previewUrl}</a>`],
                ['Preview Dashboard', `<a href="${dashboardUrl}">${dashboardUrl}</a>`]
              ])
              .addRaw(`**Last updated:** ${pstTime} PST`)
              .write();

            if (branchName === 'main') return;

            const { data: pullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branchName}`,
              state: 'open'
            });

            for (const pr of pullRequests) {
              const commentTag = `<!-- preview-url-comment-${branchName} -->`;
              const body = [
                `🚀 **Deployment Details** (Last updated: ${pstTime} PST)`,
                '',
                `- **Main Site:** ${baseUrl}`,
                `- **Preview URL:** ${previewUrl}`,
                `- **Preview Dashboard:** ${dashboardUrl}`,
                '',
                commentTag
              ].join('\n');

              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: pr.number,
              });

              const existingComment = comments.find(c => c.body.includes(commentTag));

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  issue_number: pr.number,
                  owner,
                  repo,
                  body,
                });
              }
            }
