name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'feat/*'
      - 'fix/*'
      - 'ux/*'

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  issues: write

concurrency:
  group: "gh-pages-publish"
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Build Site
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            export VITE_BASE_PATH=/tech-dancer/
          else
            export VITE_BASE_PATH=/tech-dancer/${{ github.ref_name }}/
          fi
          pnpm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ github.ref_name == 'main' && '.' || github.ref_name }}
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Post Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branchName = context.ref.replace('refs/heads/', '');

            if (branchName === 'main') return;

            const { data: pullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branchName}`,
              state: 'open'
            });

            for (const pr of pullRequests) {
              const baseUrl = `https://${owner}.github.io/${repo}/`;
              const previewUrl = `${baseUrl}${branchName}/`;

              await github.rest.issues.createComment({
                issue_number: pr.number,
                owner: owner,
                repo: repo,
                body: `🚀 **Deployment Complete!**\n\n- **Main Site:** ${baseUrl}\n- **Preview URL:** ${previewUrl}`
              });
            }
