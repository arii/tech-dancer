name: Registry Ledger Deployment

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and Build Vite App
        # Vite projects need to be built to the 'dist' folder
        run: npm run build

      - name: Build Manifest
        run: |
          echo "### Registry Ledger Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- BUILD_ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- REGISTRY_VERSION: 1.0.${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- DEPLOY_ENV: production" >> $GITHUB_STEP_SUMMARY
          echo "- STATUS: DATA_SCAN_COMPLETE" >> $GITHUB_STEP_SUMMARY

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the dist folder generated by Vite
          path: './dist'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
