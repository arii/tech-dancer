name: Deploy to GitHub Pages

on:
  push:
    branches:
      - '**'
  workflow_dispatch:


permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  issues: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  verify-changes:
    uses: ./.github/workflows/reusable-gate.yml
    permissions:
      pull-requests: write
      contents: write

  build:
    needs: verify-changes
    if: ${{ needs.verify-changes.outputs.has_changes == 'true' && !startsWith(github.ref_name, 'automation/update-submodule-') }}
    runs-on: ubuntu-latest
    concurrency:
      # Build jobs for the same branch can be cancelled if a newer push arrives
      # to save CI minutes, as only the latest build for a branch is relevant.
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

        with:

      - name: Setup Node.js
        uses: actions/setup-node@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          node-version-file: '.node-version'

      - name: Setup Workspace
        uses: ./boomtick-pkg/mcp/actions/setup-workspace # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          setup-python: 'true'

      - name: Check active runtime
        run: |
          pnpm run doctor

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Site
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # 1. Determine Base Path
          if [ "$REF_NAME" = "main" ]; then
            VITE_BASE_PATH=/$REPO_NAME/; export VITE_BASE_PATH
            VITE_APP_URL="https://$OWNER.github.io/$REPO_NAME/"; export VITE_APP_URL
          else
            VITE_BASE_PATH=/$REPO_NAME/$REF_NAME/; export VITE_BASE_PATH
            VITE_APP_URL="https://$OWNER.github.io/$REPO_NAME/$REF_NAME/"; export VITE_APP_URL
          fi

          # 2. Build the Application
          pnpm run build

          # 3. SEO Aggregation (Only on Main)
          if [ "$REF_NAME" = "main" ]; then
            # Generate robots.txt pointing at canonical sitemap location
            {
              echo "User-agent: *"
              echo "Allow: /$REPO_NAME/"
              echo "Disallow: /$REPO_NAME/previews/"
              echo "Disallow: /$REPO_NAME/404.html"
              echo "Sitemap: https://$OWNER.github.io/$REPO_NAME/sitemap.xml"
            } > dist/robots.txt

            echo "SEO assets generated successfully."
          fi

          # 4. Generate metadata for deployment tracking
          git log -1 --format=%ct > dist/.commit-timestamp
          date +%s > dist/.deploy-timestamp
          echo "${GITHUB_SHA}" > dist/.commit-sha

          # Create verification marker
          jq -n --arg b "$REF_NAME" --arg s "$GITHUB_SHA" --argjson t "$(date +%s)" '{"branch":$b,"sha":$s,"deployedAt":$t}' > dist/.deploy.json

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          name: dist-assets
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      # Use a branch-specific concurrency group to prevent cancelling deployments from other branches
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          submodules: recursive
          fetch-depth: 0

        with:

      - name: Setup Node.js
        uses: actions/setup-node@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          node-version-file: '.node-version'

      - name: Download dist artifact
        uses: actions/download-artifact@v8 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          name: dist-assets
          path: ../dist-assets

      - name: Deploy to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # 0. Pre-deploy guard: Skip if superseded
          echo "Checking if $GITHUB_SHA is still the latest for $REF_NAME..."
          LATEST_SHA=$(git ls-remote origin "refs/heads/${REF_NAME}" | awk '{print $1}')
          if [ -n "$LATEST_SHA" ] && [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "Skipping stale deploy: $GITHUB_SHA is not latest for $REF_NAME ($LATEST_SHA)"
            exit 0
          fi

          # Deployment parameters
          if [ "$REF_NAME" = "main" ]; then
            DEST_DIR="."
          else
            DEST_DIR="$REF_NAME"
          fi
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          MAX_RETRIES=10

          # Prepare Open PR branches list for pruning
          echo "Fetching open PRs for pruning..."
          gh pr list --state open --json headRefName --jq '.[].headRefName' > ../open_prs.txt

          for i in $(seq 1 "$MAX_RETRIES"); do
            echo "Deployment attempt $i..."
            rm -rf ../gh-pages-repo

            # 1. Clone or initialize gh-pages
            if git clone --depth=1 --branch gh-pages "$REPO_URL" ../gh-pages-repo; then
              cd ../gh-pages-repo || exit
            else
              echo "gh-pages branch not found or clone failed. Initializing new repo..."
              mkdir -p ../gh-pages-repo
              cd ../gh-pages-repo || exit
              git init
              git checkout -b gh-pages
              git remote add origin "$REPO_URL"
            fi

            # 2. Sync build artifacts
            if [ "$DEST_DIR" != "." ]; then
              # Clean sync for branch subdirectories
              rm -rf "$DEST_DIR"
              mkdir -p "$DEST_DIR"
              rsync -a ../dist-assets/ "$DEST_DIR/"
            else
              # Root deployment for main branch
              # We use selective copy to avoid deleting other branch folders
              rsync -a ../dist-assets/ ./
            fi
            touch .nojekyll

            # 3. Handle Main-specific requirements (tech-dancer/ subfolder and SEO)
            if [ "$REF_NAME" = "main" ]; then
              # Also deploy to tech-dancer/ subdirectory for root domain support
              rm -rf tech-dancer
              mkdir -p tech-dancer
              rsync -a ../dist-assets/ tech-dancer/

              # Ensure SEO assets are at the root
              cp ../dist-assets/sitemap.xml ./sitemap.xml 2>/dev/null || true
              cp ../dist-assets/robots.txt ./robots.txt 2>/dev/null || true
            fi

            # 4. Update root 404.html for redirects (only for previews)
            if [ "$REF_NAME" != "main" ]; then
              cp "$DEST_DIR/404.html" ./404.html
            fi

            # 5. Prune stale previews and update metadata
            # We copy the script to the current directory to run it easily
            cp "$GITHUB_WORKSPACE/scripts/manage-previews.sh" ./manage-previews.sh
            chmod +x ./manage-previews.sh
            ./manage-previews.sh ../open_prs.txt
            rm ./manage-previews.sh

            # Use the latest dashboard UI from the current deployment
            cp ../dist-assets/previews/index.html previews/index.html

            # 6. Commit and Push
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            if git commit -m "deploy: $GITHUB_SHA [skip ci]"; then
              if git push origin gh-pages; then
                echo "Push successful! Deployment is in progress."
                echo "PUSH_COMPLETE=true" >> "$GITHUB_ENV"
                echo "VERIFIED=true" >> "$GITHUB_ENV"
                exit 0
              fi
            else
              echo "No changes to commit."
              exit 0
            fi

            # Use exponential backoff with jitter to reduce collisions
            RETRY_DELAY=$(( (i * 5) + (RANDOM % 10) ))
            echo "Attempt $i failed. Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
            cd - || exit
          done

          echo "Failed to deploy after $MAX_RETRIES attempts."
          exit 1

      - name: Update Deployment Feedback
        uses: actions/github-script@v9 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branchName = context.ref.replace('refs/heads/', '');
            const baseUrl = `https://${owner}.github.io/${repo}/`;
            const previewUrl = branchName === 'main' ? baseUrl : `https://${owner}.github.io/${repo}/${branchName}/`;
            const dashboardUrl = `https://${owner}.github.io/${repo}/previews/index.html`;
            const markerUrl = branchName === 'main'
              ? `${baseUrl}.deploy.json`
              : `${baseUrl}${branchName}/.deploy.json`;

            const pstTime = new Date().toLocaleString('en-US', {
              timeZone: 'America/Los_Angeles',
              dateStyle: 'medium',
              timeStyle: 'short'
            });

            // Update Job Summary
            await core.summary
              .addHeading('🚀 Deployment Pushed!')
              .addTable([
                ['Site', 'URL'],
                ['Main Site', `<a href="${baseUrl}">${baseUrl}</a>`],
                ['Preview URL', `<a href="${previewUrl}">${previewUrl}</a>`],
                ['Preview Dashboard', `<a href="${dashboardUrl}">${dashboardUrl}</a>`]
              ])
              .addRaw(`**Last updated:** ${pstTime} PST`)
              .write();

            if (branchName === 'main') return;

            console.log(`Searching for open PRs for branch: ${branchName}`);
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open'
            });

            const matchingPRs = pullRequests.filter(pr => pr.head.ref === branchName);
            console.log(`Found ${matchingPRs.length} matching PRs`);

            for (const pr of matchingPRs) {
              console.log(`Updating feedback for PR #${pr.number}`);
              const commentTag = `<!-- preview-url-comment-${branchName} -->`;
              const statusLine = `🚀 **Pushed to gh-pages; publish in progress**`;

              const body = [
                `🚀 **Deployment Details** (Last updated: ${pstTime} PST)`,
                '',
                statusLine,
                `- **Preview URL:** ${previewUrl}`,
                `- **Preview Dashboard:** ${dashboardUrl}`,
                `- **Commit SHA:** \`${process.env.GITHUB_SHA.slice(0, 7)}\``,
                `- **Marker File:** [verify here](${markerUrl})`,
                '',
                commentTag
              ].join('\n');

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
              });

              const existingComment = comments.find(c => c.body.includes(commentTag));

              try {
                if (existingComment) {
                  console.log(`Updating existing comment ${existingComment.id}`);
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: existingComment.id,
                    body,
                  });
                } else {
                  console.log(`Creating new comment for PR #${pr.number}`);
                  await github.rest.issues.createComment({
                    issue_number: pr.number,
                    owner,
                    repo,
                    body,
                  });
                }
              } catch (error) {
                console.warn(`Failed to update comment on PR #${pr.number}:`, error.message);
              }
            }
