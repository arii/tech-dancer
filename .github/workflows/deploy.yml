name: Deploy to GitHub Pages

on:
  push:
    branches:
      - '**'

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: "gh-pages-publish"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Site
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # 1. Determine Base Path
          if [ "$REF_NAME" = "main" ]; then
            export VITE_BASE_PATH=/$REPO_NAME/
            export VITE_APP_URL="https://$OWNER.github.io/$REPO_NAME/"
          else
            export VITE_BASE_PATH=/$REPO_NAME/$REF_NAME/
            export VITE_APP_URL="https://$OWNER.github.io/$REPO_NAME/$REF_NAME/"
          fi

          # 2. Build the Application
          pnpm run build

          # 3. SEO Aggregation (Only on Main)
          # sitemap.xml is generated by vite-plugin-sitemap at build time
          if [ "$REF_NAME" = "main" ]; then
            # Generate robots.txt pointing at canonical sitemap location
            echo "User-agent: *" > dist/robots.txt
            echo "Allow: /$REPO_NAME/" >> dist/robots.txt
            echo "Disallow: /$REPO_NAME/previews/" >> dist/robots.txt
            echo "Disallow: /$REPO_NAME/404.html" >> dist/robots.txt
            echo "Sitemap: https://$OWNER.github.io/$REPO_NAME/sitemap.xml" >> dist/robots.txt

            echo "SEO assets generated successfully."
          fi

          git log -1 --format=%ct > dist/.timestamp

      - name: Deploy to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Prepare dist assets in a stable location
          mkdir -p ../dist-assets
          cp -r dist/* ../dist-assets/

          # Deployment parameters
          if [ "$REF_NAME" = "main" ]; then
            DEST_DIR="."
          else
            DEST_DIR="$REF_NAME"
          fi
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          MAX_RETRIES=5

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Deployment attempt $i..."
            rm -rf ../gh-pages-repo

            # 1. Clone or initialize gh-pages
            if git clone --depth=1 --branch gh-pages "$REPO_URL" ../gh-pages-repo; then
              cd ../gh-pages-repo
            else
              echo "gh-pages branch not found or clone failed. Initializing new repo..."
              mkdir -p ../gh-pages-repo
              cd ../gh-pages-repo
              git init
              git checkout -b gh-pages
              git remote add origin "$REPO_URL"
            fi

            # 2. Sync build artifacts
            mkdir -p "$DEST_DIR"
            cp -r ../dist-assets/* "$DEST_DIR/"
            touch .nojekyll

            # 3. Update root 404.html for redirects
            if [ "$REF_NAME" != "main" ]; then
              cp "$DEST_DIR/404.html" ./404.html
            fi

            # 4. Update Previews Index and Metadata
            mkdir -p previews
            find . -maxdepth 3 -name "index.html" | while read -r index_file; do
              DIR=$(dirname "$index_file" | sed 's|^\./||')
              [[ "$DIR" =~ ^(\.|\.\.|assets|tmp|previews)$ ]] && continue
              TS=$(cat "$DIR/.timestamp" 2>/dev/null)
              if [ -z "$TS" ]; then
                TS=$(git log -1 --format=%ct -- "$DIR" 2>/dev/null)
              fi
              if [ -z "$TS" ]; then
                TS=$(date +%s)
              fi
              echo "$DIR $TS"
            done | jq -R -n '[inputs | select(length > 0) | split(" ") | select(length == 2 and .[1] != "") | {(.[0]): (.[1] | tonumber)}] | add // {}' > previews/data.json

            # Use the latest dashboard UI
            if [ "$DEST_DIR" != "." ]; then
              cp "$DEST_DIR/previews/index.html" previews/index.html
            fi
             # Copy sitemap.xml to gh-pages root so arii.github.io/sitemap.xml resolves
             if [ "$REF_NAME" = "main" ] && [ -f "tech-dancer/sitemap.xml" ]; then
               cp tech-dancer/sitemap.xml ./sitemap.xml
             fi

            # 5. Commit and Push
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            if git commit -m "deploy: $GITHUB_SHA [skip ci]"; then
              if git push origin gh-pages; then
                echo "Push successful!"
                exit 0
              fi
            else
              echo "No changes to commit."
              exit 0
            fi

            echo "Attempt $i failed. Retrying in $((i * 5))s..."
            sleep $((i * 5))
            cd -
          done

          echo "Failed to deploy after $MAX_RETRIES attempts."
          exit 1

      - name: Prepare Root SEO Assets
        if: github.ref_name == 'main'
        run: |
          mkdir -p root-seo
          cp dist/sitemap.xml root-seo/
          cp dist/robots.txt root-seo/

      - name: Deploy Sitemap to Root Domain (arii.github.io)
        if: github.ref_name == 'main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
          repository-name: arii/arii.github.io
          branch: main
          folder: root-seo
          clean: false # Do not delete other files in arii.github.io

      - name: Update Deployment Feedback
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branchName = context.ref.replace('refs/heads/', '');
            const baseUrl = `https://${owner}.github.io/${repo}/`;
            const previewUrl = branchName === 'main' ? baseUrl : `${baseUrl}${branchName}/`;
            const dashboardUrl = `${baseUrl}previews/index.html`;

            const pstTime = new Date().toLocaleString('en-US', {
              timeZone: 'America/Los_Angeles',
              dateStyle: 'medium',
              timeStyle: 'short'
            });

            // Update Job Summary
            await core.summary
              .addHeading('🚀 Deployment Complete!')
              .addTable([
                ['Site', 'URL'],
                ['Main Site', `<a href="${baseUrl}">${baseUrl}</a>`],
                ['Preview URL', `<a href="${previewUrl}">${previewUrl}</a>`],
                ['Preview Dashboard', `<a href="${dashboardUrl}">${dashboardUrl}</a>`]
              ])
              .addRaw(`**Last updated:** ${pstTime} PST`)
              .write();

            if (branchName === 'main') return;

            console.log(`Searching for open PRs for branch: ${branchName}`);
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open'
            });

            const matchingPRs = pullRequests.filter(pr => pr.head.ref === branchName);
            console.log(`Found ${matchingPRs.length} matching PRs`);

            for (const pr of matchingPRs) {
              console.log(`Updating feedback for PR #${pr.number}`);
              const commentTag = `<!-- preview-url-comment-${branchName} -->`;
              const body = [
                `🚀 **Deployment Details** (Last updated: ${pstTime} PST)`,
                '',
                `- **Main Site:** ${baseUrl}`,
                `- **Preview URL:** ${previewUrl}`,
                `- **Preview Dashboard:** ${dashboardUrl}`,
                '',
                commentTag
              ].join('\n');

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
              });

              const existingComment = comments.find(c => c.body.includes(commentTag));

              if (existingComment) {
                console.log(`Updating existing comment ${existingComment.id}`);
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body,
                });
              } else {
                console.log(`Creating new comment for PR #${pr.number}`);
                await github.rest.issues.createComment({
                  issue_number: pr.number,
                  owner,
                  repo,
                  body,
                });
              }
            }
