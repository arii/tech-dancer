name: Deploy to GitHub Pages

on:
  push:
    branches:
      - '**'

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write
  issues: write

concurrency:
  group: "gh-pages-publish"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Build Site
        run: |
          REPO_NAME=${{ github.event.repository.name }}
          if [ "${{ github.ref_name }}" = "main" ]; then
            export VITE_BASE_PATH=/$REPO_NAME/
          else
            export VITE_BASE_PATH=/$REPO_NAME/${{ github.ref_name }}/
          fi
          export VITE_APP_URL=https://${{ github.repository_owner }}.github.io/$REPO_NAME
          pnpm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ github.ref_name == 'main' && '.' || github.ref_name }}
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      # GitHub Pages only serves the root 404.html for all 404s, regardless of
      # which subdirectory the request is for. Branch previews deploy their
      # dist/ to a subdirectory, so their 404.html is never served by GitHub
      # Pages. This step ensures the root 404.html is always the latest smart
      # redirect version after any branch push.
      - name: Update root 404.html on gh-pages for branch previews
        if: github.ref_name != 'main'
        run: mkdir -p /tmp/root-404 && cp dist/404.html /tmp/root-404/404.html

      - name: Deploy root 404.html to gh-pages
        if: github.ref_name != 'main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/root-404
          destination_dir: .
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Update Deployment Feedback
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branchName = context.ref.replace('refs/heads/', '');
            const baseUrl = `https://${owner}.github.io/${repo}/`;
            const previewUrl = branchName === 'main' ? baseUrl : `${baseUrl}${branchName}/`;
            const dashboardUrl = `${baseUrl}previews/index.html`;

            const pstTime = new Date().toLocaleString('en-US', {
              timeZone: 'America/Los_Angeles',
              dateStyle: 'medium',
              timeStyle: 'short'
            });

            // Update Job Summary
            await core.summary
              .addHeading('🚀 Deployment Complete!')
              .addTable([
                ['Site', 'URL'],
                ['Main Site', `<a href="${baseUrl}">${baseUrl}</a>`],
                ['Preview URL', `<a href="${previewUrl}">${previewUrl}</a>`],
                ['Preview Dashboard', `<a href="${dashboardUrl}">${dashboardUrl}</a>`]
              ])
              .addRaw(`**Last updated:** ${pstTime} PST`)
              .write();

            if (branchName === 'main') return;

            const { data: pullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branchName}`,
              state: 'open'
            });

            for (const pr of pullRequests) {
              const commentTag = `<!-- preview-url-comment-${branchName} -->`;
              const dashboardUrl = `${baseUrl}previews/index.html`;
              const body = [
                `🚀 **Deployment Details** (Last updated: ${pstTime} PST)`,
                '',
                `- **Main Site:** ${baseUrl}`,
                `- **Preview URL:** ${previewUrl}`,
                `- **Preview Dashboard:** ${dashboardUrl}`,
                '',
                commentTag
              ].join('\n');

              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: pr.number,
              });

              const existingComment = comments.find(c => c.body.includes(commentTag));

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  issue_number: pr.number,
                  owner,
                  repo,
                  body,
                });
              }
            }

      - name: Checkout gh-pages for index update
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Generate and Deploy Previews Index
        run: |
          cd gh-pages-branch
          mkdir -p previews

          # Validation: Ensure the dashboard exists in build artifacts
          if [ ! -f "../dist/previews/index.html" ]; then
            echo "Error: dist/previews/index.html not found! Deployment of preview index failed."
            exit 1
          fi

          # Copy the fancy dashboard from the build
          cp ../dist/previews/index.html previews/index.html

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add previews/index.html
          git commit -m "chore: update previews index after deployment" || echo "No changes to commit"
          git pull --rebase origin gh-pages
          git push origin gh-pages
