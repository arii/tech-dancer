name: Jules Fix CI

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
        type: string
      comment_body:
        description: 'Comment body'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  jules-fix:
    uses: ./boomtick-pkg/workflows/jules-fix-ci-reusable.yml
    with:
      issue_number: ${{ inputs.issue_number }}
      comment_body: ${{ inputs.comment_body }}
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
