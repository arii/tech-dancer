name: Jules Fix CI

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
        type: string
      comment_body:
        description: 'Comment body'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read


jobs:
  trigger-jules:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install PyGithub requests click

      - name: Pre-check Jules Credentials
        run: |
          MISSING=()
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then MISSING+=("GITHUB_TOKEN"); fi
          if [ -z "${{ secrets.JULES_API_KEY }}" ]; then MISSING+=("JULES_API_KEY"); fi

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "❌ Missing required secrets: ${MISSING[*]}"
            echo "Please ensure GITHUB_TOKEN and JULES_API_KEY are configured in repository secrets."
            exit 1
          fi

          if [ -z "${{ vars.JULES_SOURCE_ID }}" ]; then
            echo "⚠️ JULES_SOURCE_ID variable not found. Script will attempt auto-discovery."
          fi
          echo "✅ Credentials pre-check passed."

      - name: Build retry context from check transitions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.issue_number }}
        run: |
          # Get check states from the last two CI runs on this PR
          # Note: We filter for the PR number if possible, or just the branch.
          # We'll use head branch of the PR.
          PR_JSON=$(gh pr view "$PR_NUMBER" --json headRefName)
          HEAD_REF=$(echo "$PR_JSON" | jq -r .headRefName)

          RUNS=$(gh run list --json databaseId,conclusion,createdAt \
            --workflow ci.yml --branch "$HEAD_REF" \
            | jq -r 'sort_by(.createdAt) | .[-2:]')

          # If we don't have at least 2 runs, skip this step without failing
          NUM_RUNS=$(echo "$RUNS" | jq -r 'length')
          if [ "$NUM_RUNS" -lt 2 ]; then
            echo "Not enough runs to build retry context."
            exit 0
          fi

          PREV_RUN=$(echo "$RUNS" | jq -r '.[0].databaseId')
          CURR_RUN=$(echo "$RUNS" | jq -r '.[1].databaseId')

          PREV_JOBS=$(gh run view "$PREV_RUN" --json jobs \
            | jq -r '.jobs[] | "\(.name)=\(.conclusion)"')
          CURR_JOBS=$(gh run view "$CURR_RUN" --json jobs \
            | jq -r '.jobs[] | "\(.name)=\(.conclusion)"')

          # Find what flipped
          FIXED=""
          STILL_FAILING=""
          NEW_FAILURES=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            NAME=$(echo "$line" | cut -d= -f1)
            CURR_STATE=$(echo "$line" | cut -d= -f2)
            PREV_STATE=$(echo "$PREV_JOBS" | grep "^$NAME=" | cut -d= -f2)

            if [ "$PREV_STATE" = "failure" ] && [ "$CURR_STATE" = "success" ]; then
              FIXED="$FIXED"$'\n'"- ✅ $NAME"
            elif [ "$PREV_STATE" = "failure" ] && [ "$CURR_STATE" = "failure" ]; then
              STILL_FAILING="$STILL_FAILING"$'\n'"- ❌ $NAME (still failing)"
            elif [ "$CURR_STATE" = "failure" ] && [ "$PREV_STATE" != "failure" ]; then
              NEW_FAILURES="$NEW_FAILURES"$'\n'"- 🆕 $NAME (new failure)"
            fi
          done <<< "$CURR_JOBS"

          # Use HEREDOC with a custom delimiter to construct the message.
          # The sed command removes leading spaces from the YAML formatting.
          BODY=$(cat <<'EOF' | sed 's/^[[:space:]]*//'
          ### 🔁 Jules Retry Context

          **Fixed this attempt:**
          __FIXED__

          **Still failing:**
          __STILL_FAILING__

          **New failures introduced:**
          __NEW_FAILURES__
          EOF
          )

          # Substitute the variables into the body
          BODY="${BODY/__FIXED__/${FIXED:-"_none_"}}"
          BODY="${BODY/__STILL_FAILING__/${STILL_FAILING:-"_none_"}}"
          BODY="${BODY/__NEW_FAILURES__/${NEW_FAILURES:-"_none_"}}"

          gh pr comment "$PR_NUMBER" --body "$BODY"

      - name: Initialize Jules Repair Session
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_SOURCE_ID: ${{ vars.JULES_SOURCE_ID }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          # Export PYTHONPATH to ensure modules can find each other
          PYTHONPATH="$PYTHONPATH:$(pwd)/dev-tools"; export PYTHONPATH
          # Capture both stdout and stderr for better diagnostic visibility
          python3 dev-tools/td_cli.py jules fix-ci --pr-number "$ISSUE_NUMBER" --execute 2>&1
