name: Jules Fix CI

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
        type: string
      comment_body:
        description: 'Comment body'
        required: true
        type: string

jobs:
  call-workflow:
    uses: ./boomtick-pkg/workflows/jules-fix-trigger.yml
    with:
      issue_number: ${{ inputs.issue_number }}
      comment_body: ${{ inputs.comment_body }}
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
