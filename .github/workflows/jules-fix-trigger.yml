name: Jules Fix CI

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read


jobs:
  trigger-jules:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@jules-fix-ci') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install PyGithub requests click

      - name: Pre-check Jules Credentials
        run: |
          MISSING=()
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then MISSING+=("GITHUB_TOKEN"); fi
          if [ -z "${{ secrets.JULES_API_KEY }}" ]; then MISSING+=("JULES_API_KEY"); fi

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "❌ Missing required secrets: ${MISSING[*]}"
            echo "Please ensure GITHUB_TOKEN and JULES_API_KEY are configured in repository secrets."
            exit 1
          fi

          if [ -z "${{ vars.JULES_SOURCE_ID }}" ]; then
            echo "⚠️ JULES_SOURCE_ID variable not found. Script will attempt auto-discovery."
          fi
          echo "✅ Credentials pre-check passed."

      - name: Initialize Jules Repair Session
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_SOURCE_ID: ${{ vars.JULES_SOURCE_ID }}
        run: |
          # Export PYTHONPATH to ensure modules can find each other
          PYTHONPATH="$PYTHONPATH:$(pwd)/dev-tools"; export PYTHONPATH
          # Capture both stdout and stderr for better diagnostic visibility
          python3 dev-tools/td_cli.py jules fix-ci --pr-number ${{ github.event.issue.number }} --execute 2>&1
