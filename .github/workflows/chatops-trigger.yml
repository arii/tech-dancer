name: ChatOps Trigger

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

jobs:
  dispatch:
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: BoomTick ChatOps Dispatcher
        uses: arii/boomtick@main # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          github-app-id: ${{ secrets.APP_ID }}
          github-app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          jules-api-key: ${{ secrets.JULES_API_KEY }}
          send-to-jules: "true"
