name: Merge Conflict Check

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conflict-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: 'pnpm'
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@10.28.2 --activate

      - name: Check active runtime
        run: |
          pnpm run check:runtime-files
          pnpm run doctor

      - name: Verify clean merge simulation
        run: |
          git fetch origin main
          git config user.email "ci@test.com"
          git config user.name "CI"
          git checkout -b temp-merge-test
          if git merge --no-commit --no-ff origin/main; then
            echo "✅ Branch merges cleanly into main"
            git merge --abort 2>/dev/null || true
          else
            echo "❌ Branch cannot merge cleanly into main"
            git merge --abort 2>/dev/null || true
            exit 1
          fi
