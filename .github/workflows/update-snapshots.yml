name: Update Playwright Snapshots

on:
  issue_comment:
    types: [created]

env:
  NODE_ENV: production
  REPO_NAME: ${{ github.event.repository.name }}
  VITE_BASE_PATH: /${{ github.event.repository.name }}/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-snapshots:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@update-snapshots')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble
      env:
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        PLAYWRIGHT_DOWNLOAD_HOST: https://playwright.azureedge.net
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Create initial comment
        id: initial-comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ⏳ Updating Playwright snapshots...
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve PR details
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.exportVariable('HEAD_REF', pr.data.head.ref);
            core.exportVariable('HEAD_REPO', pr.data.head.repo.full_name);

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_REF }}
          repository: ${{ env.HEAD_REPO }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@10.28.2 --activate

      - name: Check active runtime
        run: |
          pnpm run check:runtime-files
          pnpm run doctor

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Update Playwright snapshots
        id: update
        env:
          CI: true
        run: pnpm run test:e2e --update-snapshots

      - name: Commit and push changes
        id: commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "chore: update playwright snapshots"
            git push origin HEAD:${{ env.HEAD_REF }}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update comment on success
        if: success()
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.initial-comment.outputs.comment-id }}
          body: |
            ✅ Playwright snapshots updated successfully.
          edit-mode: replace
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update comment on failure
        if: failure()
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.initial-comment.outputs.comment-id }}
          body: |
            ❌ Failed to update Playwright snapshots.
            Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.
          edit-mode: replace
          token: ${{ secrets.GITHUB_TOKEN }}
