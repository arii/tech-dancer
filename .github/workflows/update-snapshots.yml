name: Update Playwright Snapshots

on:
  issue_comment:
    types: [created]

env:
  NODE_ENV: production
  REPO_NAME: ${{ github.event.repository.name }}
  VITE_BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  update-snapshots:
    if: github.event.issue.pull_request && (contains(github.event.comment.body, '/update-snapshots') || contains(github.event.comment.body, '@update-snapshots'))
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Install system utilities
        run: |
          apt-get update
          apt-get install -y lsof git-lfs
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create initial comment
        id: initial-comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ⏳ Updating Playwright snapshots...
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve PR details
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.exportVariable('HEAD_REF', pr.data.head.ref);
            core.exportVariable('HEAD_REPO', pr.data.head.repo.full_name);

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_REF }}
          repository: ${{ env.HEAD_REPO }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Update Playwright snapshots
        id: update
        env:
          CI: true
        run: pnpm run test:e2e --update-snapshots

      - name: Commit and push changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update playwright snapshots"
          branch: ${{ env.HEAD_REF }}
          file_pattern: 'tests/**/*.png'

      - name: Update comment on success
        if: success()
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.initial-comment.outputs.comment-id }}
          body: |
            ${{ steps.commit.outputs.changes_detected == 'true' && '✅ Playwright snapshots updated successfully.' || 'info: No snapshot changes detected.' }}
          edit-mode: replace
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update comment on failure
        if: failure()
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.initial-comment.outputs.comment-id }}
          body: |
            ❌ Failed to update Playwright snapshots.
            Please check the workflow logs for more details.
          edit-mode: replace
          token: ${{ secrets.GITHUB_TOKEN }}
