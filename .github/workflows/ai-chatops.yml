name: AI ChatOps

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
        type: string
      comment_body:
        description: 'Comment body'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  handle-command:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    env:
      PYTHONPATH: dev-tools
      AI_MODEL: gpt-4o-mini
      AI_SYNTHESIS_MODEL: gpt-4o-mini
      GITHUB_MODELS_BASE_URL: https://models.inference.ai.azure.com
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Check active runtime
        run: |
          pnpm run check:runtime-files
          pnpm run doctor

      - name: Validate CLI
        run: |
          python3 dev-tools/td_cli.py doctor
          python3 dev-tools/td_cli.py gh status-board

      - name: Resolve PR Branch
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          PR_JSON=$(gh pr view "$ISSUE_NUMBER" --json headRefName)
          HEAD_REF=$(echo "$PR_JSON" | jq -r .headRefName)
          echo "HEAD_REF=$HEAD_REF" >> "$GITHUB_ENV"
          gh pr checkout "$ISSUE_NUMBER"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Execute Review
        env:
          PR_NUMBER: ${{ inputs.issue_number }}
          MAX_AI_REVIEWS: '10' # Override limit for manual chatops
          GITHUB_MODELS_MODEL: gpt-4o-mini
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          pnpm run impact:github-models-code-review

      - name: Commit Fixes
        if: contains(inputs.comment_body, '/ai-fix')
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: apply AI-suggested fixes via /ai-fix"
          branch: ${{ env.HEAD_REF }}
          file_pattern: '.'
