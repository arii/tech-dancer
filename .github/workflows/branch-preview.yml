name: Deploy Branch Preview

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write
  pull-requests: write # Required to post comments on the PR

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build
        env:
          NODE_ENV: production
          VITE_BASE_PATH: /${{ github.event.repository.name }}/deploy/${{ github.head_ref }}/

      - name: Deploy to Subfolder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: deploy/${{ github.head_ref }}
          clean: false # Critical: false prevents deleting 'main' deployment or other previews

      - name: Find Comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Branch Preview'

      - name: Post/Update PR Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### 🚀 Branch Preview Deployed
            A preview of this branch is available at:
            [https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/deploy/${{ github.head_ref }}/](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/deploy/${{ github.head_ref }}/)

            _Built at ${{ github.event.pull_request.updated_at }}_
          edit-mode: replace
