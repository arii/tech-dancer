name: Release Drafter

on:
  push:
    branches:
      - main
  # NOTE: pull_request trigger is temporarily disabled to avoid CI errors during initial setup.
  # Re-enable after merging to the default branch so Release Drafter can find its configuration.
  # pull_request:
  #   types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Draft Release
        uses: release-drafter/release-drafter@v6 # nosemgrep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
