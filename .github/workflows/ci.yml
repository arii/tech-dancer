name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: ./boomtick-pkg/mcp/actions/ci-validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
