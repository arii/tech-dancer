name: CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'etl/**'
      - 'dev-tools/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
      - 'AGENTS.md'
      - 'USAGE_NOTES.md'
      - 'WORKFLOW.md'
  pull_request:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'etl/**'
      - 'dev-tools/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
      - 'AGENTS.md'
      - 'USAGE_NOTES.md'
      - 'WORKFLOW.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANY_COUNT_BASELINE: ${{ vars.ANY_COUNT_BASELINE }}
  BUNDLE_BASELINE_KB: ${{ vars.BUNDLE_BASELINE_KB }}
  AUDIT_BASELINE: ${{ vars.AUDIT_BASELINE }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@10.28.2 --activate

      - name: Validate Runtime
        run: |
          pnpm run check:runtime-files
          pnpm run doctor

      - name: Verify lockfile integrity
        run: |
          pnpm install --frozen-lockfile
          if ! git diff --quiet pnpm-lock.yaml; then
            echo "❌ pnpm-lock.yaml is out of date. Run pnpm install and commit."
            exit 1
          fi

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run type-check

      - name: Run Unit Tests - Vitest
        run: pnpm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run CLI Unit Tests
        run: |
          python3 -m pip install PyGithub pytest click
          PYTHONPATH=dev-tools python3 -m pytest tests/dev-tools/test_modern_cli.py

      - name: Check for dead code
        run: pnpm run knip

      - name: TypeScript `any` Ratchet
        run: |
          PYTHONPATH="$PYTHONPATH:$(pwd)/dev-tools"
          export PYTHONPATH
          python3 dev-tools/td_cli.py gh ratchet-any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Anti-Pattern Audit
    runs-on: ubuntu-latest
    steps:
      # Setup dependencies once and use caching for speedup.
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: UI Anti-Pattern Audit - Gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m pip install PyGithub click
          PYTHONPATH="$PYTHONPATH:$(pwd)/dev-tools"
          export PYTHONPATH
          if ! pnpm run audit; then echo "Audit failed"; exit 1; fi
          python3 dev-tools/td_cli.py gh audit-gate

      - name: Design Token Compliance
        run: |
          # Check for raw hex colors not in tokens.css
          VIOLATIONS=$(grep -rn '#[0-9a-fA-F]\{3,6\}' src/features src/pages \
            --include="*.tsx" \
            | grep -vc "design-tokens\|tokens.css\|// impeccable-ignore" || echo 0)
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "⚠️ Found $VIOLATIONS raw hex color(s) in tsx files. Use CSS variables instead."
            grep -rn '#[0-9a-fA-F]\{3,6\}' src/features src/pages --include="*.tsx" | grep -v "design-tokens\|tokens.css"
            exit 1
          fi
          echo "✅ Design token compliance passed."

  test-build:
    name: Build & E2E
    needs: lint-typecheck
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble
      env:
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        PLAYWRIGHT_DOWNLOAD_HOST: https://playwright.azureedge.net
    steps:
      - name: Install system utilities
        run: |
          apt-get update
          apt-get install -y lsof gh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Setup dependencies once and use caching for speedup.
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: corepack enable && corepack prepare pnpm@10.28.2 --activate
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build App
        env:
          NODE_ENV: production
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Use consistent base path for CI tests to match visual snapshots
          VITE_BASE_PATH=/$REPO_NAME/; export VITE_BASE_PATH
          pnpm run build

      - name: Bundle Size Check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m pip install PyGithub click
          PYTHONPATH="$PYTHONPATH:$(pwd)/dev-tools"
          export PYTHONPATH
          python3 dev-tools/td_cli.py gh bundle-size

      - name: Run Playwright Smoke Test
        run: |
          VITE_BASE_PATH=/$REPO_NAME/; export VITE_BASE_PATH
          pnpm run test:e2e
        env:
          CI: true
          NODE_ENV: production
          REPO_NAME: ${{ github.event.repository.name }}

      - name: Run Lighthouse CI
        run: |
          set -eu
          VITE_BASE_PATH="/${REPO_NAME}/"
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          export VITE_BASE_PATH
          export CHROME_PATH
          echo "VITE_BASE_PATH=$VITE_BASE_PATH"
          echo "CHROME_PATH=$CHROME_PATH"
          pnpm run lighthouse --collect.url="http://localhost:4173${VITE_BASE_PATH}"
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}

      - name: Upload Test Results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
