name: CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'etl/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'etl/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  variables: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ANY_COUNT_BASELINE: ${{ vars.ANY_COUNT_BASELINE }}
  BUNDLE_BASELINE_KB: ${{ vars.BUNDLE_BASELINE_KB }}

jobs:
  validate-lockfile:
    name: Validate Lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify lockfile integrity
        run: |
          if ! git diff --quiet pnpm-lock.yaml; then
            echo "❌ pnpm-lock.yaml is out of date. Run pnpm install and commit."
            exit 1
          fi

  lint-typecheck:
    name: Lint & Type Check
    needs: validate-lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run type-check

      - name: Run CLI Unit Tests
        run: |
          pip install PyGithub pytest
          PYTHONPATH=dev-tools python3 -m pytest tests/dev-tools/test_td_cli.py

      - name: Check for dead code
        run: pnpm run knip

      - name: TypeScript `any` Ratchet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_FLAGS: ${{ github.ref == 'refs/heads/main' && '--update --execute' || '' }}
        run: python3 dev-tools/td_cli.py ratchet-any $UPDATE_FLAGS

  audit:
    name: Anti-Pattern Audit
    needs: validate-lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: UI Anti-Pattern Audit (Gate)
        run: python3 dev-tools/td_cli.py audit-gate

      - name: Design Token Compliance
        run: |
          # Check for raw hex colors not in tokens.css
          VIOLATIONS=$(grep -rn '#[0-9a-fA-F]\{3,6\}' src/features src/pages \
            --include="*.tsx" \
            | grep -v "design-tokens\|tokens.css\|// impeccable-ignore" \
            | wc -l)
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "⚠️ Found $VIOLATIONS raw hex color(s) in tsx files. Use CSS variables instead."
            grep -rn '#[0-9a-fA-F]\{3,6\}' src/features src/pages --include="*.tsx" | grep -v "design-tokens\|tokens.css"
            exit 1
          fi
          echo "✅ Design token compliance passed."

  test-build:
    name: Build & E2E
    needs: [validate-lockfile, lint-typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build App
        run: |
          if [ "$REF_NAME" = "main" ]; then
            export VITE_BASE_PATH=/$REPO_NAME/
          else
            export VITE_BASE_PATH=/$REPO_NAME/$REF_NAME/
          fi
          pnpm run build
        env:
          NODE_ENV: production
          REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}

      - name: Bundle Size Check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_FLAGS: ${{ github.ref == 'refs/heads/main' && '--update --execute' || '' }}
        run: python3 dev-tools/td_cli.py bundle-size $UPDATE_FLAGS

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright Smoke Test
        run: |
          if [ "$REF_NAME" = "main" ]; then
            export VITE_BASE_PATH=/$REPO_NAME/
          else
            export VITE_BASE_PATH=/$REPO_NAME/$REF_NAME/
          fi
          pnpm run test:e2e
        env:
          CI: true
          NODE_ENV: production
          REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
