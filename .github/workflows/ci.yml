name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'etl/**'
      - 'boomtick-pkg/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
      - 'AGENTS.md'
      - 'docs/github-workflows.md'
      - '*.config.ts'
      - 'tsconfig*.json'
  pull_request:
    branches: ['**']
    paths:
      - 'src/**'
      - 'etl/**'
      - 'boomtick-pkg/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
      - 'AGENTS.md'
      - 'docs/github-workflows.md'
      - '*.config.ts'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write
  pull-requests: write
  packages: read
  models: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  MAX_AI_REVIEWS: ${{ vars.MAX_AI_REVIEWS }}
  GITHUB_MODELS_MODEL: gpt-4o-mini
  ANY_COUNT_BASELINE: ${{ vars.ANY_COUNT_BASELINE }}
  BUNDLE_BASELINE_KB: ${{ vars.BUNDLE_BASELINE_KB }}
  AUDIT_BASELINE: ${{ vars.AUDIT_BASELINE }}

jobs:
  verify-changes:
    uses: ./.github/workflows/reusable-gate.yml
    permissions:
      pull-requests: write
      contents: write

  lint-typecheck:
    name: Lint & Type Check (${{ matrix.target }})
    needs: verify-changes
    if: needs.verify-changes.outputs.has_changes == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    strategy:
      fail-fast: false
      matrix:
        target: [root, boomtick-mcp]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: ./boomtick-pkg/mcp/actions/lint-typecheck
        with:
          target: ${{ matrix.target }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Anti-Pattern Audit
    needs: verify-changes
    if: needs.verify-changes.outputs.has_changes == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - uses: ./boomtick-pkg/mcp/actions/setup

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        shell: bash

      - parallel:
          - name: UI Anti-Pattern Audit
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              echo "::group::Audit"
              trap 'echo "::endgroup::"' EXIT
              export PATH="$HOME/.local/bin:/github/home/.local/bin:$PATH"
              if ! node scripts/detect-antipatterns.mjs; then echo "Audit failed"; exit 1; fi
              td-cli gh audit-gate
            shell: bash

          - name: Design Token Compliance
            run: |
              VIOLATIONS=$(find . -name "*.tsx" -not -path "*/node_modules/*" -type f | xargs grep -h '#[0-9a-fA-F]\{3,6\}' \
                | grep -vc "design-tokens\|tokens.css\|// impeccable-ignore" || true)
              if [ -n "$VIOLATIONS" ] && [ "$VIOLATIONS" -gt 0 ]; then
                echo "⚠️ Found $VIOLATIONS raw hex color(s) in tsx files. Use CSS variables instead."
                find . -name "*.tsx" -not -path "*/node_modules/*" -type f | xargs grep -rn '#[0-9a-fA-F]\{3,6\}' | grep -v "design-tokens\|tokens.css"
                exit 1
              fi
              echo "✅ Design token compliance passed."
            shell: bash

          - name: Semantic Duplicate Audit
            run: pnpm run audit:semantic
            shell: bash

          - name: Audit Suppression Inventory
            run: pnpm run audit:inventory
            shell: bash


  test-build:
    name: Build & E2E
    needs: [verify-changes]
    if: needs.verify-changes.outputs.has_changes == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    env:
      NODE_ENV: production
      REPO_NAME: ${{ github.event.repository.name }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - uses: ./boomtick-pkg/mcp/actions/setup

      - run: pnpm install --frozen-lockfile --prefer-offline
        shell: bash

      - name: Build App
        run: |
          VITE_BASE_PATH=/; export VITE_BASE_PATH
          pnpm run build
        shell: bash

      - parallel:
          - name: Bundle Size Check
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
              export PATH="$HOME/.local/bin:/github/home/.local/bin:$PATH"
              td-cli gh bundle-size
            shell: bash

          - name: Run Playwright Smoke Test
            run: |
              # Use different port to avoid contention with Lighthouse
              VITE_BASE_PATH=/ PORT=4174 pnpm run test:e2e
            shell: bash

          - name: Run Lighthouse CI
            run: |
              set -eu
              VITE_BASE_PATH="/"
              CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
              export VITE_BASE_PATH
              export CHROME_PATH
              echo "CHROME_PATH=$CHROME_PATH"
              pnpm run lighthouse --collect.url="http://localhost:4173${VITE_BASE_PATH}"
            env:
              LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            shell: bash

      - name: Check Playwright Report Exists
        id: check_report
        if: always()
        run: |
          if [ -d "playwright-report/" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Upload Test Results
        if: always() && steps.check_report.outputs.exists == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore


  impact-analysis:
    needs: [verify-changes, lint-typecheck, audit, test-build]
    name: Deployment Impact Analysis
    if: needs.verify-changes.outputs.has_changes == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    env:
      DISABLE_MINIFY: true
      MAX_AI_REVIEWS: ${{ vars.MAX_AI_REVIEWS }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_MODELS_MODEL: gpt-4o-mini
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: ./boomtick-pkg/mcp/actions/impact-analysis

        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          pr_number: ${{ github.event.pull_request.number }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}
