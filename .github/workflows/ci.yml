name: CI & Impact Analysis Gate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  run-boomtick-ci:
    name: Call BoomTick Reusable Workflow
    uses: arii/boomtick/.github/workflows/ci.yml@main
    permissions:
      contents: read
      issues: write
      pull-requests: write
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
