name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  variables: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify Lockfile Consistency
        run: git diff --exit-code pnpm-lock.yaml

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run type-check

      - name: TypeScript `any` Ratchet
        run: |
          CURRENT_LOG=$(python3 dev-tools/td_cli.py ratchet-any)
          echo "$CURRENT_LOG"
          CURRENT=$(echo "$CURRENT_LOG" | grep -o 'Current=[0-9]*' | cut -d'=' -f2)

          python3 dev-tools/td_cli.py ratchet-any --update

          if [ "${{ github.ref_name }}" = "main" ]; then
            gh variable set ANY_COUNT_BASELINE --body "$CURRENT"
          fi
        env:
          ANY_COUNT_BASELINE: ${{ vars.ANY_COUNT_BASELINE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Anti-Pattern Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: UI Anti-Pattern Audit (Gate)
        run: |
          # 1. Capture current violations
          CURRENT_LOG=$(pnpm run audit)
          echo "$CURRENT_LOG"
          CURRENT=$(echo "$CURRENT_LOG" | grep "VIOLATION_COUNT=" | cut -d'=' -f2)

          BASELINE=${{ vars.ANTIPATTERN_BASELINE || 0 }}

          echo "Baseline violations: $BASELINE | Current: $CURRENT"
          if [ "$CURRENT" -gt "$BASELINE" ]; then
            echo "❌ New anti-pattern violations introduced ($CURRENT > $BASELINE). Fix before merging."
            exit 1
          fi

          if [ "${{ github.ref_name }}" = "main" ]; then
            gh variable set ANTIPATTERN_BASELINE --body "$CURRENT"
          fi
          echo "✅ No new violations."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Anti-Pattern Report
        uses: actions/upload-artifact@v4
        with:
          name: anti-pattern-report
          path: TODO_ANTIPATTERNS.md

      - name: Design Token Compliance
        run: |
          # Check for raw hex colors not in tokens.css
          VIOLATIONS=$(grep -rn '#[0-9a-fA-F]\{3,6\}' src/features src/pages \
            --include="*.tsx" \
            | grep -v "design-tokens\|tokens.css\|// impeccable-ignore" \
            | wc -l)
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "⚠️ Found $VIOLATIONS raw hex color(s) in tsx files. Use CSS variables instead."
            grep -rn '#[0-9a-fA-F]\{3,6\}' src/features src/pages --include="*.tsx" | grep -v "design-tokens\|tokens.css"
            exit 1
          fi
          echo "✅ Design token compliance passed."

  test-build:
    name: Build & E2E
    needs: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build App
        run: |
          REPO_NAME=${{ github.event.repository.name }}
          if [ "${{ github.ref_name }}" = "main" ]; then
            export VITE_BASE_PATH=/$REPO_NAME/
          else
            export VITE_BASE_PATH=/$REPO_NAME/${{ github.ref_name }}/
          fi
          pnpm run build
        env:
          NODE_ENV: production

      - name: Bundle Size Check
        run: |
          CURRENT_LOG=$(python3 dev-tools/td_cli.py bundle-size)
          echo "$CURRENT_LOG"
          CURRENT=$(echo "$CURRENT_LOG" | grep -o 'Current=[0-9]*' | cut -d'=' -f2)

          python3 dev-tools/td_cli.py bundle-size --update

          if [ "${{ github.ref_name }}" = "main" ]; then
            gh variable set BUNDLE_BASELINE_KB --body "$CURRENT"
          fi
        env:
          BUNDLE_BASELINE_KB: ${{ vars.BUNDLE_BASELINE_KB }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright Smoke Test
        run: |
          REPO_NAME=${{ github.event.repository.name }}
          if [ "${{ github.ref_name }}" = "main" ]; then
            export VITE_BASE_PATH=/$REPO_NAME/
          else
            export VITE_BASE_PATH=/$REPO_NAME/${{ github.ref_name }}/
          fi
          pnpm run test:e2e
        env:
          CI: true
          NODE_ENV: production

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
