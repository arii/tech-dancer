name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'etl/**'
      - '.gitmodules'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'AGENTS.md'
      - 'docs/github-workflows.md'
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.mjs'
      - '**.json'
      - '**.yaml'
      - '**.yml'
      - '**.ini'
      - '**.html'
      - '.npmrc'
  pull_request:
    branches: ['**']
  workflow_dispatch:
  schedule:
    - cron: '45 4 * * 6'

permissions:
  contents: read
  actions: read
  statuses: write
  pull-requests: write
  packages: read
  models: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  MAX_AI_REVIEWS: ${{ vars.MAX_AI_REVIEWS }}
  GITHUB_MODELS_MODEL: gpt-4o-mini
  ANY_COUNT_BASELINE: ${{ vars.ANY_COUNT_BASELINE }}
  BUNDLE_BASELINE_KB: ${{ vars.BUNDLE_BASELINE_KB }}
  AUDIT_BASELINE: ${{ vars.AUDIT_BASELINE }}

jobs:
  verify-changes:
    name: Verify Code Changes
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_code_changes: ${{ steps.check_diff.outputs.has_code_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          fetch-depth: 0
      - name: Verify Code Modifications
        id: check_diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            if git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
              RANGE="origin/$BASE_REF...HEAD"
            else
              RANGE="FETCH_HEAD...HEAD"
            fi
          else
            RANGE="$BEFORE_SHA"
            if [ -z "$RANGE" ] || [ "$RANGE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1"
              if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then RANGE=""; fi
            fi
          fi

          CODE_PATHS=(
            'src/'
            'etl/'
            '.gitmodules'
            'tests/'
            'scripts/'
            'package.json'
            'pnpm-lock.yaml'
            'pnpm-workspace.yaml'
            '.github/workflows/'
            '.github/actions/'
            'AGENTS.md'
            'docs/github-workflows.md'
            '.npmrc'
            ':(glob)**/*.ts'
            ':(glob)**/*.tsx'
            ':(glob)**/*.js'
            ':(glob)**/*.mjs'
            ':(glob)**/*.json'
            ':(glob)**/*.yaml'
            ':(glob)**/*.yml'
            ':(glob)**/*.ini'
            ':(glob)**/*.html'
          )

          if [ -n "$RANGE" ]; then
            if [[ "$RANGE" == *...* ]]; then
              DIFF_CMD=(git diff --quiet "$RANGE" -- "${CODE_PATHS[@]}")
            else
              DIFF_CMD=(git diff --quiet "$RANGE" HEAD -- "${CODE_PATHS[@]}")
            fi

            if "${DIFF_CMD[@]}"; then
              echo "No code changes detected in diff range $RANGE."
              echo "has_code_changes=false" >> "$GITHUB_OUTPUT"
            else
              echo "Code changes detected in diff range $RANGE."
              echo "has_code_changes=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No diff range found; assuming code changes."
            echo "has_code_changes=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  lint-typecheck:
    name: Lint & Type Check
    needs: [verify-changes]
    if: ${{ needs.verify-changes.outputs.has_code_changes == 'true' || github.event_name != 'pull_request' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep
        with:
          submodules: false
          fetch-depth: 0
      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --engine-strict=false
        shell: bash

      - name: Verify lockfile integrity
        run: |
          if ! git diff --quiet pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml is out of date. Run pnpm install and commit."
            exit 1
          fi
        shell: bash

      - name: Lint & Type-check
        run: |
          pnpm run lint
          pnpm run type-check
        shell: bash

      - name: Python Linting
        continue-on-error: true
        run: |
          pnpm run lint:python
          pnpm run type-check:python
        shell: bash

      - name: Ratchet Any
        run: |
          export PATH="$HOME/.local/bin:/github/home/.local/bin:$PATH"
          td gh ratchet-any
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

  audit:
    name: Anti-Pattern Audit
    needs: [verify-changes]
    if: ${{ needs.verify-changes.outputs.has_code_changes == 'true' || github.event_name != 'pull_request' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep
        with:
          submodules: false
          fetch-depth: 0
      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --engine-strict=false
        shell: bash

      - name: Semantic Duplicate Audit
        run: pnpm run audit:semantic

      - name: Audit Suppression Inventory
        run: pnpm run audit:inventory

      - name: Duplicate Code Detection
        run: pnpm run audit:duplication

      - name: UI Anti-Pattern Audit
        run: |
          export PATH="$HOME/.local/bin:/github/home/.local/bin:$PATH"
          pnpm run audit:anti-patterns
          td gh audit-gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

  test-build:
    name: Build & E2E
    needs: [verify-changes]
    if: ${{ needs.verify-changes.outputs.has_code_changes == 'true' || github.event_name != 'pull_request' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    env:
      NODE_ENV: production
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep
        with:
          submodules: false
          fetch-depth: 0
      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --engine-strict=false
        shell: bash

      - name: Ensure correct Playwright browsers
        run: pnpm exec playwright install chromium
        shell: bash

      - name: Build App
        run: |
          VITE_BASE_PATH=/; export VITE_BASE_PATH
          pnpm run build
        shell: bash

      - name: Bundle Size Check
        run: |
          export PATH="$HOME/.local/bin:/github/home/.local/bin:$PATH"
          td gh bundle-size
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Run Playwright E2E
        run: |
          VITE_BASE_PATH=/ pnpm run test:e2e
        shell: bash

      - name: Run Lighthouse CI
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu
          VITE_BASE_PATH="/"
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          export VITE_BASE_PATH
          export CHROME_PATH
          echo "CHROME_PATH=$CHROME_PATH"
          pnpm run lighthouse --collect.url="http://localhost:4173${VITE_BASE_PATH}"
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

  impact-analysis:
    if: ${{ !startsWith(github.head_ref, 'automation/update-submodule-') }}
    needs: [lint-typecheck, audit, test-build]
    name: Deployment Impact Analysis
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    env:
      DISABLE_MINIFY: true
      MAX_AI_REVIEWS: ${{ vars.MAX_AI_REVIEWS }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_MODELS_MODEL: gpt-4o-mini
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep
        with:
          submodules: false
          fetch-depth: 0
      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --engine-strict=false
        shell: bash

      - name: Deployment Impact Analysis
        uses: arii/boomtick@main # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-app-id: ${{ secrets.APP_ID }}
          github-app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          jules-api-key: ${{ secrets.JULES_API_KEY }}
          send-to-jules: "true"

  security-scan:
    name: Security Scan (${{ matrix.scanner }})
    needs: [verify-changes]
    if: ${{ needs.verify-changes.outputs.has_code_changes == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scanner: [oxlint, semgrep, gitleaks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # nosemgrep
        with:
          submodules: false
          fetch-depth: 0
      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --engine-strict=false
        shell: bash

      - name: Initialize CodeQL
        if: matrix.scanner == 'semgrep'
        uses: github/codeql-action/init@v4 # nosemgrep
        with:
          languages: actions, javascript-typescript

      - name: Oxlint Scan
        if: matrix.scanner == 'oxlint'
        run: pnpm run lint:ox
        shell: bash

      - name: Semgrep Static Analysis
        if: matrix.scanner == 'semgrep'
        run: |
          python3 -m pip install --no-cache-dir --break-system-packages semgrep
          pnpm run audit:semgrep
        shell: bash

      - name: Gitleaks Secret Detection
        if: matrix.scanner == 'gitleaks'
        uses: gitleaks/gitleaks-action@v3 # nosemgrep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Perform CodeQL Analysis
        if: matrix.scanner == 'semgrep'
        uses: github/codeql-action/analyze@v4 # nosemgrep
        with:
          category: "/language:security-scan"


  validate-workflows:
    name: Validate all workflow files
    needs: [verify-changes]
    if: ${{ needs.verify-changes.outputs.has_code_changes == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          setup-python: 'false'

      - name: Download actionlint
        id: get_actionlint
        run: |
          curl --retry 5 --retry-delay 5 -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash > download-actionlint.sh
          bash download-actionlint.sh 1.7.12
          rm download-actionlint.sh
        shell: bash

      - name: Lint workflow logic with actionlint
        run: |
          ./actionlint \
            -ignore 'step must run script with "run" section' \
            -ignore 'unexpected key "background"' \
            -ignore 'unexpected key "parallel"' \
            -ignore 'unexpected key "wait"' \
            -ignore 'repository_vulnerability_alert' \
            -ignore 'dependabot_alert' \
            -color
        shell: bash
