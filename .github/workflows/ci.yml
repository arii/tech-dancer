name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'etl/**'
      - 'boomtick-pkg/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
      - 'AGENTS.md'
      - 'docs/github-workflows.md'
      - '*.config.ts'
      - 'tsconfig*.json'
  pull_request:
    branches: ['**']
    paths:
      - 'src/**'
      - 'etl/**'
      - 'boomtick-pkg/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
      - 'AGENTS.md'
      - 'docs/github-workflows.md'
      - '*.config.ts'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write
  pull-requests: write
  packages: read
  models: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  MAX_AI_REVIEWS: ${{ vars.MAX_AI_REVIEWS }}
  GITHUB_MODELS_MODEL: gpt-4o-mini
  ANY_COUNT_BASELINE: ${{ vars.ANY_COUNT_BASELINE }}
  BUNDLE_BASELINE_KB: ${{ vars.BUNDLE_BASELINE_KB }}
  AUDIT_BASELINE: ${{ vars.AUDIT_BASELINE }}

jobs:
  verify-changes:
    uses: ./.github/workflows/reusable-gate.yml
    permissions:
      pull-requests: write
      contents: write

  lint-typecheck:
    name: Lint & Type Check (${{ matrix.target }})
    needs: verify-changes
    if: needs.verify-changes.outputs.has_changes == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    strategy:
      fail-fast: false
      matrix:
        target: [root, boomtick-mcp]
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep
        with:
          fetch-depth: 0
      - uses: ./boomtick-pkg/mcp/actions/lint-typecheck
        with:
          target: ${{ matrix.target }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Anti-Pattern Audit
    needs: verify-changes
    if: needs.verify-changes.outputs.has_changes == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep
        with:
          fetch-depth: 0
      - uses: ./boomtick-pkg/mcp/actions/audit
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Semantic Duplicate Audit
        run: pnpm run audit:semantic

      - name: Audit Suppression Inventory
        run: pnpm run audit:inventory


  test-build:
    name: Build & E2E
    needs: [verify-changes, lint-typecheck]
    if: needs.verify-changes.outputs.has_changes == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    env:
      NODE_ENV: production
      REPO_NAME: ${{ github.event.repository.name }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep
        with:
          fetch-depth: 0
      - uses: ./boomtick-pkg/mcp/actions/test-build
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}


  impact-analysis:
    needs: [verify-changes, lint-typecheck, audit, test-build]
    name: Deployment Impact Analysis
    if: needs.verify-changes.outputs.has_changes == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    env:
      DISABLE_MINIFY: true
      MAX_AI_REVIEWS: ${{ vars.MAX_AI_REVIEWS }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_MODELS_MODEL: gpt-4o-mini
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep
        with:
          fetch-depth: 0
      - uses: ./boomtick-pkg/mcp/actions/impact-analysis

        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          pr_number: ${{ github.event.pull_request.number }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}
