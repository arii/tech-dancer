name: CI

on:
  push:
    branches:
    - main
    paths:
    - src/**
    - etl/**
    - dev-tools/**
    - tests/**
    - scripts/**
    - package.json
    - pnpm-lock.yaml
    - .github/workflows/ci.yml
    - .github/actions/**
    - AGENTS.md
    - docs/github-workflows.md
    - '*.config.ts'
    - tsconfig*.json
  pull_request:
    branches:
    - '**'
    paths:
    - src/**
    - etl/**
    - dev-tools/**
    - tests/**
    - scripts/**
    - package.json
    - pnpm-lock.yaml
    - .github/workflows/ci.yml
    - .github/actions/**
    - AGENTS.md
    - docs/github-workflows.md
    - '*.config.ts'
    - tsconfig*.json
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
  statuses: write
  pull-requests: write
  models: read
  packages: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: true
  MAX_AI_REVIEWS: ${{ vars.MAX_AI_REVIEWS }}
  GITHUB_MODELS_MODEL: gpt-4o-mini
  ANY_COUNT_BASELINE: ${{ vars.ANY_COUNT_BASELINE }}
  BUNDLE_BASELINE_KB: ${{ vars.BUNDLE_BASELINE_KB }}
  AUDIT_BASELINE: ${{ vars.AUDIT_BASELINE }}
jobs:
  verify-changes:
    uses: ./.github/workflows/reusable-gate.yml
    permissions:
      pull-requests: write
      contents: write
  lint-typecheck:
    name: Lint & Type Check
    needs: verify-changes
    if: needs.verify-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    steps:
    - name: Configure Git Safe Directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup Node and pnpm
      uses: ./.github/actions/setup-node-pnpm
    - name: Validate Runtime
      shell: bash
      run: 'echo "::group::Validate Runtime"

        trap ''echo "::endgroup::"'' EXIT

        pnpm run check:runtime-files

        pnpm run doctor

        '
    - name: Verify lockfile integrity
      shell: bash
      run: "echo \"::group::pnpm install\"\ntrap 'echo \"::endgroup::\"' EXIT\npnpm install --frozen-lockfile\necho \"::endgroup::\"\ntrap - EXIT\n\nif ! git diff --quiet pnpm-lock.yaml; then\n  echo \"::error::pnpm-lock.yaml is out of date. Run pnpm install and commit.\"\n  exit 1\nfi\n"
    - name: Lint
      run: pnpm run lint
    - name: Type-check
      run: pnpm run type-check
    - name: Run Unit Tests - Vitest
      run: pnpm test
    - name: Run CLI Unit Tests
      shell: bash
      run: 'echo "::group::Pytest"

        trap ''echo "::endgroup::"'' EXIT

        PYTHONPATH=dev-tools python3 -m pytest tests/dev-tools/test_modern_cli.py

        '
    - name: Check for dead code
      run: pnpm run knip
    - name: TypeScript `any` Ratchet
      shell: bash
      run: 'echo "::group::Ratchet Any"

        trap ''echo "::endgroup::"'' EXIT

        PYTHONPATH="$PYTHONPATH:$(pwd)/dev-tools"

        export PYTHONPATH

        python3 dev-tools/td_cli.py gh ratchet-any

        '
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  audit:
    name: Anti-Pattern Audit
    needs: verify-changes
    if: needs.verify-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    steps:
    - name: Configure Git Safe Directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup Node and pnpm
      uses: ./.github/actions/setup-node-pnpm
    - name: Install dependencies
      shell: bash
      run: 'echo "::group::pnpm install"

        trap ''echo "::endgroup::"'' EXIT

        pnpm install --frozen-lockfile --prefer-offline

        '
    - name: UI Anti-Pattern Audit - Gate
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'echo "::group::Audit"

        trap ''echo "::endgroup::"'' EXIT

        PYTHONPATH="$PYTHONPATH:$(pwd)/dev-tools"

        export PYTHONPATH

        if ! pnpm run audit; then echo "Audit failed"; exit 1; fi

        python3 dev-tools/td_cli.py gh audit-gate

        '
    - name: Design Token Compliance
      run: "# Check for raw hex colors not in tokens.css\nVIOLATIONS=$(grep -rn '#[0-9a-fA-F]\\{3,6\\}' src/features src/pages \\\n  --include=\"*.tsx\" \\\n  | grep -vc \"design-tokens\\|tokens.css\\|// impeccable-ignore\" || echo 0)\nif [ \"$VIOLATIONS\" -gt 0 ]; then\n  echo \"\u26A0\uFE0F Found $VIOLATIONS raw hex color(s) in tsx files. Use CSS variables instead.\"\n  grep -rn '#[0-9a-fA-F]\\{3,6\\}' src/features src/pages --include=\"*.tsx\" | grep -v \"design-tokens\\|tokens.css\"\n  exit 1\nfi\necho \"\u2705 Design token compliance passed.\"\n"
  test-build:
    name: Build & E2E
    needs:
    - verify-changes
    - lint-typecheck
    if: needs.verify-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    env:
      NODE_ENV: production
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
    - name: Configure Git Safe Directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - uses: actions/checkout@v7
    - run: pnpm install --frozen-lockfile --prefer-offline
    - name: Build App
      run: '# Build with root base path for Playwright preview tests.

        # Playwright runs with VITE_BASE_PATH=/, so dist must use root-relative assets.

        VITE_BASE_PATH=/; export VITE_BASE_PATH

        pnpm run build

        '
    - name: Bundle Size Check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'PYTHONPATH="$PYTHONPATH:$(pwd)/dev-tools"

        export PYTHONPATH

        python3 dev-tools/td_cli.py gh bundle-size

        '
    - name: Run Playwright Smoke Test
      run: 'pnpm exec playwright install chromium

        VITE_BASE_PATH=/ pnpm run test:e2e

        '
    - name: Run Lighthouse CI
      run: 'set -eu

        VITE_BASE_PATH="/"

        CHROME_PATH="$(node -e "console.log(require(''playwright'').chromium.executablePath())")"

        export VITE_BASE_PATH

        export CHROME_PATH

        echo "CHROME_PATH=$CHROME_PATH"

        pnpm run lighthouse --collect.url="http://localhost:4173${VITE_BASE_PATH}"

        '
      env:
        LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Check Playwright Report Exists
      id: check_report
      if: always()
      run: "if [ -d \"playwright-report/\" ]; then\n  echo \"exists=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"exists=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Upload Test Results
      if: always() && steps.check_report.outputs.exists == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report-${{ github.run_id }}
        path: playwright-report/
        retention-days: 7
        if-no-files-found: ignore
  impact-analysis:
    needs:
    - verify-changes
    - lint-typecheck
    - audit
    - test-build
    name: Deployment Impact Analysis
    if: needs.verify-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    env:
      DISABLE_MINIFY: true
      MAX_AI_REVIEWS: ${{ vars.MAX_AI_REVIEWS }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_MODELS_MODEL: gpt-4o-mini
    steps:
    - name: Configure Git Safe Directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup Node and pnpm
      uses: ./.github/actions/setup-node-pnpm
    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Cache HuggingFace models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface/hub
        key: ${{ runner.os }}-hf-models
    - name: Install AI Audit dependencies
      run: 'python3 -m pip install --upgrade pip

        python3 -m pip install --break-system-packages chromadb sentence-transformers

        '
    - name: Index Codebase for AI Audit
      run: 'PYTHONPATH="$PYTHONPATH:$(pwd)/dev-tools"

        export PYTHONPATH

        pnpm run ai:index

        '
    - run: pnpm install --frozen-lockfile --prefer-offline
    - name: Deployment Impact Analysis
      run: pnpm run impact:analysis
    - name: Build Main
      env:
        DISABLE_MINIFY: true
      run: pnpm run impact:build-main
    - name: Build PR
      env:
        VITE_BASE_PATH: /
        DISABLE_MINIFY: true
      run: pnpm run build:review
    - name: Visual Diff
      run: pnpm run impact:visual-diff
    - name: DOM Diff
      run: pnpm run impact:dom-diff
    - name: Check if visual changes exist
      id: check_visuals
      run: pnpm exec tsx scripts/check-visual-changes.ts >> "$GITHUB_OUTPUT"
    - name: Code review agent
      if: always() && github.event_name == 'pull_request'
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: pnpm run impact:gemini-code-review
    - name: Code review github models agent
      if: always() && github.event_name == 'pull_request'
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: pnpm run impact:github-models-code-review
    - name: Visual review agent
      if: always() && steps.check_visuals.outputs.changed_routes != '0' && steps.check_visuals.outputs.changed_routes != ''
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: pnpm run impact:gemini-review
    - name: Visual review github models agent
      if: always() && steps.check_visuals.outputs.changed_routes != '0' && steps.check_visuals.outputs.changed_routes != ''
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: pnpm run impact:github-models-review
    - name: Report Summary
      if: always()
      run: "if [ -f artifacts/deployment-review.md ]; then\n  cat artifacts/deployment-review.md >> \"$GITHUB_STEP_SUMMARY\"\n  {\n    echo \"IMPACT_BODY<<EOF\"\n    cat artifacts/deployment-review.md\n    echo \"EOF\"\n  } >> \"$GITHUB_ENV\"\nelif [ -f artifacts/impact-analysis/impact.md ]; then\n  cat artifacts/impact-analysis/impact.md >> \"$GITHUB_STEP_SUMMARY\"\n  {\n    echo \"IMPACT_BODY<<EOF\"\n    cat artifacts/impact-analysis/impact.md\n    echo \"EOF\"\n  } >> \"$GITHUB_ENV\"\nelse\n  {\n    echo \"## Deployment Impact Analysis\"\n    echo \"No impact report found.\"\n  } >> \"$GITHUB_STEP_SUMMARY\"\n  {\n    echo \"IMPACT_BODY<<EOF\"\n    echo \"No impact report found.\"\n    echo \"EOF\"\n  } >> \"$GITHUB_ENV\"\nfi\n\nif [ -f artifacts/gemini-review.md ]; then\n  {\n    echo \"\"\n    cat artifacts/gemini-review.md\n  } >> \"$GITHUB_STEP_SUMMARY\"\nfi\n\nif [ -f artifacts/github-models-review.md ]; then\n  {\n    echo \"\"\n    cat artifacts/github-models-review.md\n  } >> \"\
        $GITHUB_STEP_SUMMARY\"\nfi\n\nif [ -f artifacts/gemini-code-review.md ]; then\n  {\n    echo \"\"\n    cat artifacts/gemini-code-review.md\n  } >> \"$GITHUB_STEP_SUMMARY\"\nfi\n\nif [ -f artifacts/github-models-code-review.md ]; then\n  {\n    echo \"\"\n    cat artifacts/github-models-code-review.md\n  } >> \"$GITHUB_STEP_SUMMARY\"\nfi\n\n# Aggregate verdict \u2014 fail the step explicitly if any verdict file says failed\nFAILED=0\nif [ \"$FAILED\" -eq 0 ]; then\n  for f in artifacts/*-verdict.json; do\n    [ -f \"$f\" ] || continue\n    PASSED=$(jq -r '.passed' \"$f\" || echo \"error\")\n    if [ \"$PASSED\" = \"false\" ]; then\n      HIGH=$(jq -r '.highCount' \"$f\" || echo \"unknown\")\n      echo \"\u274C Review failed: $HIGH HIGH severity issues found ($f)\" >&2\n      FAILED=1\n    elif [ \"$PASSED\" = \"error\" ]; then\n      echo \"\u274C Review failed: Could not parse verdict file ($f)\" >&2\n      FAILED=1\n    fi\n  done\nfi\nexit $FAILED\n"
    - name: Parse Jules session ID from PR description
      if: always()
      id: parse_jules
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
      run: "TASK_ID=$(echo \"$PR_BODY\" \\\n  | grep -oP 'jules\\.google\\.com/task/\\K[0-9]+' \\\n  | head -1)\nif [ -z \"$TASK_ID\" ]; then\n  echo \"No Jules task ID found in PR description. Skipping.\"\n  exit 0\nfi\necho \"Found Jules task ID: $TASK_ID\"\necho \"task_id=$TASK_ID\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Send impact analysis to Jules session
      if: always() && steps.parse_jules.outputs.task_id != ''
      env:
        TASK_ID: ${{ steps.parse_jules.outputs.task_id }}
        JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      run: python3 scripts/send-jules-impact.py
    - name: Update Impact Analysis Feedback (Final Result)
      if: always()
      uses: ./.github/actions/update-pr-comment
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        status_line: "\u2705 **Impact Analysis Complete**"
        impact_body: ${{ env.IMPACT_BODY }}
    - name: Upload Deployment Review Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: deployment-review
        path: artifacts/
