name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'etl/**'
      - 'dev-tools/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
      - 'AGENTS.md'
      - 'docs/github-workflows.md'
      - '*.config.ts'
      - 'tsconfig*.json'
  pull_request:
    branches: ['**']
    paths:
      - 'src/**'
      - 'etl/**'
      - 'dev-tools/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
      - 'AGENTS.md'
      - 'docs/github-workflows.md'
      - '*.config.ts'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write
  pull-requests: write
  models: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANY_COUNT_BASELINE: ${{ vars.ANY_COUNT_BASELINE }}
  BUNDLE_BASELINE_KB: ${{ vars.BUNDLE_BASELINE_KB }}
  AUDIT_BASELINE: ${{ vars.AUDIT_BASELINE }}

jobs:
  verify-changes:
    uses: ./.github/workflows/reusable-gate.yml
    permissions:
      pull-requests: write
      contents: write

  lint-typecheck:
    name: Lint & Type Check
    needs: verify-changes
    if: needs.verify-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    steps:
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Validate Runtime
        shell: bash
        run: |
          echo "::group::Validate Runtime"
          trap 'echo "::endgroup::"' EXIT
          pnpm run check:runtime-files
          pnpm run doctor

      - name: Verify lockfile integrity
        shell: bash
        run: |
          echo "::group::pnpm install"
          trap 'echo "::endgroup::"' EXIT
          pnpm install --frozen-lockfile
          echo "::endgroup::"
          trap - EXIT

          if ! git diff --quiet pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml is out of date. Run pnpm install and commit."
            exit 1
          fi

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run type-check

      - name: Run Unit Tests - Vitest
        run: pnpm test

      - name: Run CLI Unit Tests
        shell: bash
        run: |
          echo "::group::Pytest"
          trap 'echo "::endgroup::"' EXIT
          PYTHONPATH=dev-tools python3 -m pytest tests/dev-tools/test_modern_cli.py

      - name: Check for dead code
        env:
          CI: true
        run: CI=true pnpm run knip

      - name: TypeScript `any` Ratchet
        shell: bash
        run: |
          echo "::group::Ratchet Any"
          trap 'echo "::endgroup::"' EXIT
          PYTHONPATH="$PYTHONPATH:$(pwd)/dev-tools"
          export PYTHONPATH
          python3 dev-tools/td_cli.py gh ratchet-any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Anti-Pattern Audit
    needs: verify-changes
    if: needs.verify-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    steps:
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Setup dependencies once and use caching for speedup.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install dependencies
        shell: bash
        run: |
          echo "::group::pnpm install"
          trap 'echo "::endgroup::"' EXIT
          pnpm install --frozen-lockfile --prefer-offline

      - name: UI Anti-Pattern Audit - Gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Audit"
          trap 'echo "::endgroup::"' EXIT
          PYTHONPATH="$PYTHONPATH:$(pwd)/dev-tools"
          export PYTHONPATH
          if ! pnpm run audit; then echo "Audit failed"; exit 1; fi
          python3 dev-tools/td_cli.py gh audit-gate

      - name: Design Token Compliance
        run: |
          # Check for raw hex colors not in tokens.css
          VIOLATIONS=$(grep -rn '#[0-9a-fA-F]\{3,6\}' src/features src/pages \
            --include="*.tsx" \
            | grep -vc "design-tokens\|tokens.css\|// impeccable-ignore" || echo 0)
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "⚠️ Found $VIOLATIONS raw hex color(s) in tsx files. Use CSS variables instead."
            grep -rn '#[0-9a-fA-F]\{3,6\}' src/features src/pages --include="*.tsx" | grep -v "design-tokens\|tokens.css"
            exit 1
          fi
          echo "✅ Design token compliance passed."

  test-build:
    name: Build & E2E
    needs: [verify-changes, lint-typecheck]
    if: needs.verify-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
      env:
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        PLAYWRIGHT_DOWNLOAD_HOST: https://playwright.azureedge.net
    steps:
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Setup dependencies once and use caching for speedup.
      - uses: actions/checkout@v6
      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build App
        env:
          NODE_ENV: production
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Build with root base path for Playwright preview tests.
          # Playwright runs with VITE_BASE_PATH=/, so dist must use root-relative assets.
          VITE_BASE_PATH=/; export VITE_BASE_PATH
          pnpm run build


      - name: Bundle Size Check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH="$PYTHONPATH:$(pwd)/dev-tools"
          export PYTHONPATH
          python3 dev-tools/td_cli.py gh bundle-size

      - name: Run Playwright Smoke Test
        run: |
          VITE_BASE_PATH=/ pnpm run test:e2e
        env:
          CI: true
          NODE_ENV: production

      - name: Run Lighthouse CI
        run: |
          set -eu
          VITE_BASE_PATH="/"
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          export VITE_BASE_PATH
          export CHROME_PATH
          echo "CHROME_PATH=$CHROME_PATH"
          pnpm run lighthouse --collect.url="http://localhost:4173${VITE_BASE_PATH}"
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}

      - name: Upload Test Results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

  impact-analysis:
    needs: [verify-changes, lint-typecheck, audit, test-build]
    name: Deployment Impact Analysis
    if: needs.verify-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    steps:
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: pnpm install --frozen-lockfile --prefer-offline

      - name: Deployment Impact Analysis
        run: pnpm run impact:analysis
      - name: Build Main
        env:
          DISABLE_MINIFY: true
        run: pnpm run impact:build-main
      - name: Build PR
        env:
          VITE_BASE_PATH: /
          DISABLE_MINIFY: true
        run: pnpm run build:review
      - name: Visual Diff
        run: pnpm run impact:visual-diff
      - name: DOM Diff
        run: pnpm run impact:dom-diff
      - name: Check if visual changes exist
        id: check_visuals
        run: pnpm exec tsx scripts/check-visual-changes.ts >> "$GITHUB_OUTPUT"
      - name: Code review agent
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          MAX_AI_REVIEWS: ${{ vars.MAX_AI_REVIEWS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm run impact:gemini-code-review
      - name: Code review github models agent
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          MAX_AI_REVIEWS: ${{ vars.MAX_AI_REVIEWS }}
          GITHUB_MODELS_MODEL: gpt-4o-mini
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm run impact:github-models-code-review
      - name: Visual review agent
        if: always() && steps.check_visuals.outputs.changed_routes != '0'
        env:
          MAX_AI_REVIEWS: ${{ vars.MAX_AI_REVIEWS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm run impact:gemini-review
      - name: Visual review github models agent
        if: always() && steps.check_visuals.outputs.changed_routes != '0'
        env:
          MAX_AI_REVIEWS: ${{ vars.MAX_AI_REVIEWS }}
          GITHUB_MODELS_MODEL: gpt-4o-mini
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm run impact:github-models-review
      - name: Report Summary
        if: always()
        run: |
          if [ -f artifacts/deployment-review.md ]; then
            cat artifacts/deployment-review.md >> "$GITHUB_STEP_SUMMARY"
            {
              echo "IMPACT_BODY<<EOF"
              cat artifacts/deployment-review.md
              echo "EOF"
            } >> "$GITHUB_ENV"
          elif [ -f artifacts/impact-analysis/impact.md ]; then
            cat artifacts/impact-analysis/impact.md >> "$GITHUB_STEP_SUMMARY"
            {
              echo "IMPACT_BODY<<EOF"
              cat artifacts/impact-analysis/impact.md
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            {
              echo "## Deployment Impact Analysis"
              echo "No impact report found."
            } >> "$GITHUB_STEP_SUMMARY"
            {
              echo "IMPACT_BODY<<EOF"
              echo "No impact report found."
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

          if [ -f artifacts/gemini-review.md ]; then
            {
              echo ""
              cat artifacts/gemini-review.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f artifacts/github-models-review.md ]; then
            {
              echo ""
              cat artifacts/github-models-review.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f artifacts/gemini-code-review.md ]; then
            {
              echo ""
              cat artifacts/gemini-code-review.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f artifacts/github-models-code-review.md ]; then
            {
              echo ""
              cat artifacts/github-models-code-review.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Aggregate verdict — fail the step explicitly if any verdict file says failed
          FAILED=0
          for f in artifacts/*-verdict.json; do
            [ -f "$f" ] || continue
            PASSED=$(jq -r '.passed' "$f")
            if [ "$PASSED" = "false" ]; then
              HIGH=$(jq -r '.highCount' "$f")
              echo "❌ Review failed: $HIGH HIGH severity issues found ($f)" >&2
              FAILED=1
            fi
          done
          exit $FAILED
      - name: Parse Jules session ID from PR description
        if: always()
        id: parse_jules
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          TASK_ID=$(echo "$PR_BODY" \
            | grep -oP 'jules\.google\.com/task/\K[0-9]+' \
            | head -1)
          if [ -z "$TASK_ID" ]; then
            echo "No Jules task ID found in PR description. Skipping."
            exit 0
          fi
          echo "Found Jules task ID: $TASK_ID"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"

      - name: Send impact analysis to Jules session
        if: always() && steps.parse_jules.outputs.task_id != ''
        env:
          TASK_ID: ${{ steps.parse_jules.outputs.task_id }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: python3 scripts/send-jules-impact.py

      - name: Update Impact Analysis Feedback (Final Result)
        if: always()
        uses: ./.github/actions/update-pr-comment
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          status_line: '✅ **Impact Analysis Complete**'
          impact_body: ${{ env.IMPACT_BODY }}

      - name: Upload Deployment Review Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: deployment-review
          path: artifacts/

  oxlint:
    name: Oxlint Scan
    needs: verify-changes
    if: needs.verify-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Check active runtime
        run: |
          pnpm run check:runtime-files
          pnpm run doctor

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Oxlint
        run: pnpm run lint:ox

  gitleaks:
    name: Gitleaks Secret Detection
    needs: verify-changes
    if: needs.verify-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep Static Analysis
    needs: verify-changes
    if: needs.verify-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Semgrep Scan
        run: semgrep scan --config auto --error

  conflict-check:
    name: Merge Conflict Check
    needs: verify-changes
    if: needs.verify-changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Check active runtime
        run: |
          pnpm run check:runtime-files
          pnpm run doctor

      - name: Verify clean merge simulation
        run: |
          git fetch origin main
          git config user.email "ci@test.com"
          git config user.name "CI"
          git checkout -b temp-merge-test
          if git merge --no-commit --no-ff origin/main; then
            echo "✅ Branch merges cleanly into main"
            git merge --abort 2>/dev/null || true
          else
            echo "❌ Branch cannot merge cleanly into main"
            git merge --abort 2>/dev/null || true
            exit 1
          fi
