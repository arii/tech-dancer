name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'etl/**'
      - 'boomtick-pkg/**'
      - 'boomtick-pkg'
      - '.gitmodules'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'AGENTS.md'
      - 'docs/github-workflows.md'
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.mjs'
      - '**.json'
      - '**.yaml'
      - '**.yml'
      - '**.ini'
      - '**.html'
      - '.npmrc'
  pull_request:
    branches: ['**']
    paths:
      - 'src/**'
      - 'etl/**'
      - 'boomtick-pkg/**'
      - 'boomtick-pkg'
      - '.gitmodules'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'AGENTS.md'
      - 'docs/github-workflows.md'
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.mjs'
      - '**.json'
      - '**.yaml'
      - '**.yml'
      - '**.ini'
      - '**.html'
      - '.npmrc'
  workflow_dispatch:
  schedule:
    - cron: '45 4 * * 6'

permissions:
  contents: read
  actions: read
  statuses: write
  pull-requests: write
  packages: read
  models: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  CI: true
  MAX_AI_REVIEWS: ${{ vars.MAX_AI_REVIEWS }}
  GITHUB_MODELS_MODEL: gpt-4o-mini
  ANY_COUNT_BASELINE: ${{ vars.ANY_COUNT_BASELINE }}
  BUNDLE_BASELINE_KB: ${{ vars.BUNDLE_BASELINE_KB }}
  AUDIT_BASELINE: ${{ vars.AUDIT_BASELINE }}

jobs:
  lint-typecheck:
    name: Lint & Type Check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          node-version-file: '.node-version'

      - name: Setup Workspace
        uses: ./boomtick-pkg/mcp/actions/setup-workspace
        with:
          setup-python: 'true'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --engine-strict=false
        shell: bash

      - name: Verify lockfile integrity
        run: |
          if ! git diff --quiet pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml is out of date. Run pnpm install and commit."
            exit 1
          fi
        shell: bash

      - name: Lint & Type-check
        run: |
          pnpm run lint
          pnpm run type-check
        shell: bash

      - name: Python Linting
        continue-on-error: true
        run: |
          pnpm run lint:python
          pnpm run type-check:python
        shell: bash

      - name: Ratchet Any
        run: |
          export PATH="$HOME/.local/bin:/github/home/.local/bin:$PATH"
          td-cli gh ratchet-any
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

  audit:
    name: Anti-Pattern Audit
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          node-version-file: '.node-version'

      - name: Setup Workspace
        uses: ./boomtick-pkg/mcp/actions/setup-workspace
        with:
          setup-python: 'true'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --engine-strict=false
        shell: bash

      - name: Semantic Duplicate Audit
        run: pnpm run audit:semantic

      - name: Audit Suppression Inventory
        run: pnpm run audit:inventory

      - name: Duplicate Code Detection
        run: pnpm run audit:duplication

      - name: UI Anti-Pattern Audit
        run: |
          export PATH="$HOME/.local/bin:/github/home/.local/bin:$PATH"
          pnpm run audit:anti-patterns
          td-cli gh audit-gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

  test-build:
    name: Build & E2E
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    env:
      NODE_ENV: production
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          node-version-file: '.node-version'

      - name: Setup Workspace
        uses: ./boomtick-pkg/mcp/actions/setup-workspace
        with:
          setup-python: 'true'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --engine-strict=false
        shell: bash

      - name: Ensure correct Playwright browsers
        run: pnpm exec playwright install chromium
        shell: bash

      - name: Build App
        run: |
          VITE_BASE_PATH=/; export VITE_BASE_PATH
          pnpm run build
        shell: bash

      - name: Bundle Size Check
        run: |
          export PATH="$HOME/.local/bin:/github/home/.local/bin:$PATH"
          td gh bundle-size
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Run Playwright E2E
        run: |
          VITE_BASE_PATH=/ pnpm run test:e2e
        shell: bash

      - name: Run Lighthouse CI
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu
          VITE_BASE_PATH="/"
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          export VITE_BASE_PATH
          export CHROME_PATH
          echo "CHROME_PATH=$CHROME_PATH"
          pnpm run lighthouse --collect.url="http://localhost:4173${VITE_BASE_PATH}"
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

  impact-analysis:
    needs: [lint-typecheck, audit, test-build]
    name: Deployment Impact Analysis
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    env:
      DISABLE_MINIFY: true
      MAX_AI_REVIEWS: ${{ vars.MAX_AI_REVIEWS }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_MODELS_MODEL: gpt-4o-mini
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          node-version-file: '.node-version'

      - name: Setup Workspace
        uses: ./boomtick-pkg/mcp/actions/setup-workspace
        with:
          setup-python: 'true'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --engine-strict=false
        shell: bash

      - name: Ensure correct Playwright browsers
        run: pnpm exec playwright install chromium
        shell: bash

      - name: Get main branch SHA
        id: main-sha
        shell: bash
        run: |
          git fetch origin main
          echo "SHA=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - name: Cache main build
        uses: actions/cache@v4.2.0 # nosemgrep
        with:
          path: .tmp-main
          key: ${{ runner.os }}-main-build-${{ steps.main-sha.outputs.SHA }}
          restore-keys: |
            ${{ runner.os }}-main-build-

      - name: Impact Analysis
        id: impact_analysis
        run: |
          pnpm run impact:analysis
          echo "has_impact=true" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build Main
        if: steps.impact_analysis.outputs.has_impact == 'true'
        run: pnpm run impact:build-main
        shell: bash

      - name: Build PR
        if: steps.impact_analysis.outputs.has_impact == 'true'
        run: pnpm run build:review
        shell: bash

      - name: Gemini Code Review
        if: always() && github.event_name == 'pull_request' && env.MAX_AI_REVIEWS != '0' && steps.impact_analysis.outputs.has_impact == 'true'
        continue-on-error: true
        run: pnpm run impact:gemini-code-review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: GitHub Models Code Review
        if: always() && github.event_name == 'pull_request' && env.MAX_AI_REVIEWS != '0' && steps.impact_analysis.outputs.has_impact == 'true'
        continue-on-error: true
        run: pnpm run impact:github-models-code-review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash

      - name: Visual Diff
        if: steps.impact_analysis.outputs.has_impact == 'true'
        run: pnpm run impact:visual-diff
        shell: bash

      - name: DOM Diff
        if: steps.impact_analysis.outputs.has_impact == 'true'
        run: pnpm run impact:dom-diff
        shell: bash

      - name: Check if visual changes exist
        if: steps.impact_analysis.outputs.has_impact == 'true'
        id: check_visuals
        env:
          VISUAL_DIFF_THRESHOLD: 1.5
        run: pnpm exec tsx boomtick-pkg/scripts/check-visual-changes.ts >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Visual review agent
        if: always() && steps.check_visuals.outputs.changed_routes != '0' && steps.check_visuals.outputs.changed_routes != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run impact:gemini-review
        shell: bash

      - name: Visual review github models agent
        if: always() && steps.check_visuals.outputs.changed_routes != '0' && steps.check_visuals.outputs.changed_routes != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run impact:github-models-review
        shell: bash

      - name: Report Summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/deployment-review.md ]; then
            cat artifacts/deployment-review.md >> "$GITHUB_STEP_SUMMARY"
            {
              echo "IMPACT_BODY<<EOF"
              cat artifacts/deployment-review.md
              echo "EOF"
            } >> "$GITHUB_ENV"
          elif [ -f artifacts/impact-analysis/impact.md ]; then
            cat artifacts/impact-analysis/impact.md >> "$GITHUB_STEP_SUMMARY"
            {
              echo "IMPACT_BODY<<EOF"
              cat artifacts/impact-analysis/impact.md
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            {
              echo "## Deployment Impact Analysis"
              echo "No impact report found."
            } >> "$GITHUB_STEP_SUMMARY"
            {
              echo "IMPACT_BODY<<EOF"
              echo "No impact report found."
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Update Impact Analysis Feedback
        if: always() && github.event_name == 'pull_request'
        uses: ./boomtick-pkg/mcp/actions/update-pr-comment
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          status_line: '✅ **Impact Analysis Complete**'
          impact_body: ${{ env.IMPACT_BODY }}

      - name: Upload Deployment Review Artifacts
        if: always()
        uses: actions/upload-artifact@v7 # nosemgrep
        with:
          name: deployment-review
          path: artifacts/

  security-scan:
    name: Security Scan (${{ matrix.scanner }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scanner: [oxlint, semgrep, gitleaks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # nosemgrep
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          node-version-file: '.node-version'

      - name: Setup Workspace
        uses: ./boomtick-pkg/mcp/actions/setup-workspace
        with:
          setup-python: 'true'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --engine-strict=false
        shell: bash

      - name: Initialize CodeQL
        if: matrix.scanner == 'semgrep'
        uses: github/codeql-action/init@v4 # nosemgrep
        with:
          languages: actions, javascript-typescript

      - name: Oxlint Scan
        if: matrix.scanner == 'oxlint'
        run: pnpm run lint:ox

      - name: Semgrep Static Analysis
        if: matrix.scanner == 'semgrep'
        run: |
          pip install semgrep
          pnpm run audit:semgrep

      - name: Gitleaks Secret Detection
        if: matrix.scanner == 'gitleaks'
        uses: gitleaks/gitleaks-action@v3 # nosemgrep
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Perform CodeQL Analysis
        if: matrix.scanner == 'semgrep'
        uses: github/codeql-action/analyze@v4 # nosemgrep
        with:
          category: "/language:security-scan"


  validate-workflows:
    name: Validate all workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          node-version-file: '.node-version'

      - name: Download actionlint
        id: get_actionlint
        run: |
          curl --retry 5 --retry-delay 5 -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash > download-actionlint.sh
          bash download-actionlint.sh 1.7.12
          rm download-actionlint.sh
        shell: bash

      - name: Lint workflow logic with actionlint
        run: |
          ./actionlint \
            -ignore 'step must run script with "run" section' \
            -ignore 'unexpected key "background"' \
            -ignore 'unexpected key "parallel"' \
            -ignore 'unexpected key "wait"' \
            -ignore 'repository_vulnerability_alert' \
            -ignore 'dependabot_alert' \
            -color
        shell: bash
