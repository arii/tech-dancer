name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'etl/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'AGENTS.md'
      - 'docs/github-workflows.md'
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.mjs'
      - '**.json'
      - '**.yaml'
      - '**.yml'
      - '**.ini'
      - '**.html'
      - '.npmrc'
  pull_request:
    branches: ['**']
    paths:
      - 'src/**'
      - 'etl/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'AGENTS.md'
      - 'docs/github-workflows.md'
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.mjs'
      - '**.json'
      - '**.yaml'
      - '**.yml'
      - '**.ini'
      - '**.html'
      - '.npmrc'
  workflow_dispatch:
  schedule:
    - cron: '45 4 * * 6'

permissions:
  contents: read
  actions: read
  statuses: write
  pull-requests: write
  packages: read
  models: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  MAX_AI_REVIEWS: ${{ vars.MAX_AI_REVIEWS }}
  GITHUB_MODELS_MODEL: gpt-4o-mini
  ANY_COUNT_BASELINE: ${{ vars.ANY_COUNT_BASELINE }}
  BUNDLE_BASELINE_KB: ${{ vars.BUNDLE_BASELINE_KB }}
  AUDIT_BASELINE: ${{ vars.AUDIT_BASELINE }}

jobs:
  lint-typecheck:
    name: Lint & Type Check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          setup-python: 'false'
      - name: pnpm install
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Lint
        run: pnpm run lint
      - name: Type Check
        run: pnpm run type-check

  audit:
    name: Code Quality Audit
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          setup-python: 'false'
      - name: pnpm install
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Duplicate Code Detection
        run: pnpm run audit:duplication


  test-build:
    name: Build & E2E
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    env:
      NODE_ENV: production
      REPO_NAME: ${{ github.event.repository.name }}
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          setup-python: 'false'
      - name: pnpm install
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build App
        run: |
          VITE_BASE_PATH=/; export VITE_BASE_PATH
          pnpm run build
      - name: Run Playwright Smoke Test
        run: |
          VITE_BASE_PATH=/ pnpm run test:e2e
      - name: Run Lighthouse CI
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu
          VITE_BASE_PATH="/"
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          export VITE_BASE_PATH
          export CHROME_PATH
          echo "CHROME_PATH=$CHROME_PATH"
          pnpm run lighthouse --collect.url="http://localhost:4173${VITE_BASE_PATH}"
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Playwright Report Exists
        id: check_report
        if: always()
        run: |
          if [ -d "playwright-report/" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Test Results
        if: always() && steps.check_report.outputs.exists == 'true'
        uses: actions/upload-artifact@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore


  impact-analysis:
    needs: [lint-typecheck, audit, test-build]
    name: Deployment Impact Analysis
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    env:
      DISABLE_MINIFY: true
      MAX_AI_REVIEWS: ${{ vars.MAX_AI_REVIEWS }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_MODELS_MODEL: gpt-4o-mini
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          setup-python: 'false'

      - name: pnpm install
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run Impact Analysis
        run: pnpm run impact:analysis

      - name: Build Main
        run: pnpm run impact:build-main

      - name: Build PR
        run: pnpm run build:review

      - name: Code Review (Gemini)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run impact:gemini-code-review

      - name: Code Review (GitHub Models)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run impact:github-models-code-review

      - name: Visual Diff
        run: pnpm run impact:visual-diff

      - name: DOM Diff
        run: pnpm run impact:dom-diff

      - name: Check if visual changes exist
        id: check_visuals
        shell: bash
        run: pnpm exec tsx boomtick-pkg/scripts/check-visual-changes.ts >> "$GITHUB_OUTPUT"

      - name: Visual Review (Gemini)
        if: always() && steps.check_visuals.outputs.changed_routes != '0' && steps.check_visuals.outputs.changed_routes != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run impact:gemini-review

      - name: Visual Review (GitHub Models)
        if: always() && steps.check_visuals.outputs.changed_routes != '0' && steps.check_visuals.outputs.changed_routes != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run impact:github-models-review

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          name: deployment-review
          path: artifacts/

  security-scan:
    name: Security Scan (${{ matrix.scanner }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scanner: [oxlint, semgrep, gitleaks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Initialize CodeQL
        if: matrix.scanner == 'semgrep'
        uses: github/codeql-action/init@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          languages: actions, javascript-typescript

      - name: Oxlint Scan
        if: matrix.scanner == 'oxlint'
        run: pnpm run lint:ox

      - name: Semgrep Static Analysis
        if: matrix.scanner == 'semgrep'
        run: |
          # Install semgrep on the host for efficiency
          pip install semgrep
          pnpm run audit:semgrep

      - name: Gitleaks Secret Detection
        if: matrix.scanner == 'gitleaks'
        uses: gitleaks/gitleaks-action@v3 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Perform CodeQL Analysis
        if: matrix.scanner == 'semgrep'
        uses: github/codeql-action/analyze@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          category: "/language:security-scan"


  validate-workflows:
    name: Validate all workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download actionlint
        id: get_actionlint
        run: |
          # Pin to a specific version and commit for security
          # Current commit for v1.7.12 as of 2026-06-26
          curl --retry 5 --retry-delay 5 -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash > download-actionlint.sh
          bash download-actionlint.sh 1.7.12
          rm download-actionlint.sh
        shell: bash

      - name: Lint workflow logic with actionlint
        run: |
          # Ignore 'background', 'parallel', and 'wait' keywords as actionlint does
          # not yet support these new GitHub Actions features.
          ./actionlint \
            -ignore 'step must run script with "run" section' \
            -ignore 'unexpected key "background"' \
            -ignore 'unexpected key "parallel"' \
            -ignore 'unexpected key "wait"' \
            -ignore 'repository_vulnerability_alert' \
            -ignore 'dependabot_alert' \
            -color
        shell: bash
