name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'etl/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'etl/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '45 4 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-changes:
    name: "FOUNDATIONAL GATE: Checks for actual code modifications"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    outputs:
      has_changes: ${{ steps.check_diff.outputs.has_changes }}
    steps:
      - name: Checkout Code with History
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify Diff Composition
        id: check_diff
        run: |
          # Compare the last commit to its parent to ignore empty metadata patches
          if git diff --quiet HEAD~1 HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "EMPTY_COMMIT=true" >> "$GITHUB_ENV"
            echo "❌ Empty commit detected! No code files modified."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "✅ Valid patch found with actual file changes."
          fi

  analyze:
    needs: verify-changes
    if: needs.verify-changes.outputs.has_changes == 'true' || github.event_name == 'schedule'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'actions', 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
