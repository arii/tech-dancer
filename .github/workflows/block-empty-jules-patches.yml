name: Block Empty Jules Patches
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  verify-changes:
    uses: ./.github/workflows/reusable-gate.yml
    permissions:
      pull-requests: write
      contents: write

  block-empty-patch:
    name: Block Empty AI Patch
    needs: verify-changes
    if: needs.verify-changes.outputs.has_changes == 'false'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Close PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body: "🚨 **Auto-Blocked:** This PR contains 0 code changes. Empty patches are prohibited by the repository policy and heavy CI workflows have been bypassed."
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number,
              state: 'closed'
            });
