name: WCS Data Pipeline (Wednesday Build)

on:
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: etl/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: v1-playwright-etl-${{ runner.os }}-chromium-${{ hashFiles('etl/requirements.txt') }}
          restore-keys: |
            v1-playwright-etl-${{ runner.os }}-chromium-

      - name: Install Playwright Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Run Pytest (Data Validation)
        run: |
          PYTHONPATH=etl pytest etl/tests/

      - name: Execute Extraction Script
        run: |
          # Run crawl for a single year in automated workflow to keep it efficient
          # Markdown files are generated in content/studies/ but ignored by .gitignore
          python etl/scraper.py --years 1

      - name: Validate Output
        run: |
          python -c "import pandas as pd; df=pd.read_parquet('etl/data/wcs_prelims.parquet'); assert len(df) > 0"

      - name: Commit via Git LFS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git lfs track "*.parquet"
          # Only track and add the Parquet ledger; Markdown studies are ignored
          git add etl/data/wcs_prelims.parquet .gitattributes

          git diff --staged --quiet || (git commit -m "Automated ETL: New WCS results added" && git push)
