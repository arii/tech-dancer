name: WCS Data Pipeline (Wednesday Build)

on:
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:


jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble
    permissions:
      contents: write
    steps:
      - name: Install git-lfs
        run: |
          apt-get update && apt-get install -y git-lfs

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r etl/requirements.txt

      - name: Run Pytest (Data Validation)
        run: |
          PYTHONPATH=etl pytest etl/tests/

      - name: Execute Extraction Script
        run: |
          # Run crawl for a single year in automated workflow to keep it efficient
          # Markdown files are generated in content/studies/ but ignored by .gitignore
          python etl/scraper.py --years 1

      - name: Validate Output
        run: |
          python -c "import pandas as pd; df=pd.read_parquet('etl/data/wcs_prelims.parquet'); assert len(df) > 0"

      - name: Commit via Git LFS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git lfs track "*.parquet"
          # Only track and add the Parquet ledger; Markdown studies are ignored
          git add etl/data/wcs_prelims.parquet .gitattributes

          git diff --staged --quiet || (git commit -m "Automated ETL: New WCS results added" && git push)
