name: Release Logic

on:
  workflow_call:
    secrets:
      PYPI_API_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Setup Node.js
        uses: actions/setup-node@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          node-version-file: '.node-version'

      - name: Tag and Release
        id: check_version
        uses: ./.github/actions/tag-and-release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        if: steps.check_version.outputs.should_release == 'true'
        uses: actions/setup-python@v6 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pnpm
        if: steps.check_version.outputs.should_release == 'true'
        uses: pnpm/action-setup@v6 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Install dependencies
        if: steps.check_version.outputs.should_release == 'true'
        run: |
          set -eo pipefail
          pnpm install --frozen-lockfile
          pip install -r boomtick-pkg/cli/requirements.txt
          pip install build twine

      - name: Sync schemas/contracts
        if: steps.check_version.outputs.should_release == 'true'
        run: |
          set -eo pipefail
          PYTHONPATH="$PYTHONPATH:$(pwd)/boomtick-pkg/cli"
          export PYTHONPATH
          python3 boomtick-pkg/cli/dev_tools/schema_gen.py
          pnpm exec tsx boomtick-pkg/mcp/scripts/sync-contracts.ts

      - name: Build TypeScript MCP
        if: steps.check_version.outputs.should_release == 'true'
        run: |
          set -eo pipefail
          pnpm --filter @boomtick/mcp build

      - name: Copy compiled JS
        if: steps.check_version.outputs.should_release == 'true'
        run: |
          set -eo pipefail
          mkdir -p boomtick-pkg/cli/dev_tools/dist
          cp -r boomtick-pkg/mcp/dist/* boomtick-pkg/cli/dev_tools/dist/

      - name: Build Python Package
        if: steps.check_version.outputs.should_release == 'true'
        run: |
          set -eo pipefail
          cd boomtick-pkg/cli
          python3 -m build

      - name: Publish to PyPI
        if: steps.check_version.outputs.should_release == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -eo pipefail
          twine upload boomtick-pkg/cli/dist/*
