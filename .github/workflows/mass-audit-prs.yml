name: Mass Audit PRs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight


jobs:
  audit:
    runs-on: ubuntu-latest
    container: ghcr.io/arii/tech-dancer:latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      AI_MODEL: gpt-4o-mini
      GITHUB_MODELS_BASE_URL: https://models.inference.ai.azure.com
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}/dev-tools
    steps:
      - name: Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0


      - name: Check active runtime
        run: |
          pnpm run check:runtime-files
          pnpm run doctor

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          if [ -f "dev-tools/setup.py" ] || [ -f "dev-tools/pyproject.toml" ]; then
            pip install -e dev-tools/
          else
            echo "⚠️ dev-tools/ is not a valid Python package. Skipping installation."
          fi

      - name: Run Headless Audit
        run: |
          bash dev-tools/audit_headless.sh --sync

      - name: Commit and Push REVIEW_TRACKING.md
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: "chore: update PR review tracking"
          file_pattern: 'REVIEW_TRACKING.md pr_overlaps.txt'
