name: Mass Audit PRs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight


jobs:
  audit:
    runs-on: ubuntu-latest
    container: ghcr.io/arii/tech-dancer:latest
    permissions:
      contents: write
      pull-requests: write
    env:
      AI_MODEL: gpt-4o-mini
      GITHUB_MODELS_BASE_URL: https://models.inference.ai.azure.com
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run Headless Audit
        env:
          DEBUG: true
        run: |
          bash dev-tools/audit_headless.sh --sync

      - name: Upload Audit Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-audit-logs
          path: dev-tools/logs/

      - name: Commit and Push REVIEW_TRACKING.md
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore: update PR review tracking"
          file_pattern: 'REVIEW_TRACKING.md pr_overlaps.txt'
