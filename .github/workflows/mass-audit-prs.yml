name: AI Mass Audit PRs

on:
  schedule:
    - cron: '0 0 * * *' # Every night at midnight
  workflow_dispatch:
    inputs:
      pr_count:
        description: 'Number of recent PRs to audit'
        required: false
        default: '5'
        type: string

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  mass-audit:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run Mass Audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_COUNT: ${{ inputs.pr_count || '5' }}
        run: |
          # Fetch recent open PRs
          PRS=$(gh pr list --state open --limit "$PR_COUNT" --json number -q '.[].number')

          for PR in $PRS; do
            echo "::group::Auditing PR #$PR"
            # We use the td_cli to audit PRs. This will trigger the underlying scripts
            # which now have structured logging.
            PYTHONPATH=dev-tools python3 dev-tools/td_cli.py gh audit-pr "$PR" --fetch --audit --execute || true
            echo "::endgroup::"
          done

      - name: Upload AI Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-logs-${{ github.run_id }}
          path: dev-tools/logs/ai/
          retention-days: 14
