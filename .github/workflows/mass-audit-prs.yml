name: Mass Audit PRs

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight


jobs:
  audit:
    if: github.repository == 'disabled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install PyGithub

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Check active runtime
        run: |
          pnpm run check:runtime-files
          pnpm run doctor

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh > install_ollama.sh
          sh install_ollama.sh
          rm install_ollama.sh

      - name: Start Ollama Server
        run: |
          ollama serve > ollama_output.log 2>&1 &
          sleep 5
          curl -f --retry 10 --retry-delay 2 http://localhost:11434/api/tags || (cat ollama_output.log && exit 1)

      - name: Pull Model
        run: ollama pull qwen2.5-coder:7b

      - name: Run Headless Audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash dev-tools/audit_headless.sh --sync

      - name: Commit and Push REVIEW_TRACKING.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update PR review tracking"
          file_pattern: 'REVIEW_TRACKING.md pr_overlaps.txt'