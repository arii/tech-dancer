name: Mass Audit PRs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight


jobs:
  audit:
    if: github.repository == 'disabled'
    runs-on: ubuntu-latest
    container: ghcr.io/arii/tech-dancer:latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check active runtime
        run: |
          pnpm run check:runtime-files
          pnpm run doctor

      - name: Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Headless Audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash dev-tools/audit_headless.sh --sync

      - name: Commit and Push REVIEW_TRACKING.md
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update PR review tracking"
          file_pattern: 'REVIEW_TRACKING.md pr_overlaps.txt'