name: Issue to Content PR

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  create-pr:
    # Security Gate: Only run if the issue title starts with 'Draft:'
    # AND the author matches the site owner (arii)
    if: |
      contains(github.event.issue.title, 'Draft:') &&
      (github.event.issue.user.login == 'arii')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Parse Issue and Generate Markdown File
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          echo "$ISSUE_BODY" > issue_body.txt
          python3 dev-tools/content_parser.py issue_body.txt "$ISSUE_TITLE" > parser_output.txt
          cat parser_output.txt

          # Extract variables from parser output
          FILE_CREATED=$(grep FILE_CREATED parser_output.txt | cut -d'=' -f2)
          SAFE_TITLE=$(grep SAFE_TITLE parser_output.txt | cut -d'=' -f2)

          echo "NEW_FILE=$FILE_CREATED" >> $GITHUB_ENV
          echo "SAFE_TITLE=$SAFE_TITLE" >> $GITHUB_ENV

      - name: Create Pull Request via GitHub CLI
        env:
          # Use PAT_TOKEN as requested to bypass branch protections and trigger workflows
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          BRANCH_NAME="content/${{ env.SAFE_TITLE }}"

          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Create and switch to branch
          git checkout -b "$BRANCH_NAME"

          # Add and commit the new file
          git add "${{ env.NEW_FILE }}"
          git commit -m "docs: add content from issue #$ISSUE_NUMBER"

          # Push the branch
          git push origin "$BRANCH_NAME" --force

          # Create Pull Request
          gh pr create \
            --title "Content: $ISSUE_TITLE" \
            --body "This PR was automatically generated from issue #$ISSUE_NUMBER." \
            --base main \
            --head "$BRANCH_NAME" \
            --label "automated-content" || echo "PR already exists or failed to create"
