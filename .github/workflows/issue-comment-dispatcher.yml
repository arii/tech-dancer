name: Issue Comment Dispatcher

on:
  issue_comment:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dispatch:
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - name: Check commands
        id: check
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [[ "$COMMENT_BODY" == *"@conflict-resolve"* ]]; then
            echo "conflict_resolve=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$COMMENT_BODY" == *"@update-snapshots"* ]]; then
            echo "update_snapshots=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$COMMENT_BODY" == *"/ollama-fix"* ]] || [[ "$COMMENT_BODY" == *"/ollama-review"* ]]; then
            echo "ollama_chatops=true" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$COMMENT_BODY" == *"@jules-fix-ci"* ]]; then
             if [[ "${{ github.event.comment.author_association }}" == 'OWNER' ]] || [[ "${{ github.event.comment.author_association }}" == 'MEMBER' ]] || [[ "${{ github.event.comment.author_association }}" == 'COLLABORATOR' ]]; then
               echo "jules_fix_ci=true" >> "$GITHUB_OUTPUT"
             fi
          fi

      - name: Checkout repository to dispatch workflows
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve Branch Details
        if: steps.check.outputs.conflict_resolve == 'true' || steps.check.outputs.update_snapshots == 'true' || steps.check.outputs.ollama_chatops == 'true' || steps.check.outputs.jules_fix_ci == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh pr view ${{ github.event.issue.number }} --json headRefName,baseRefName || echo '{}')
          HEAD_REF=$(echo "$PR_JSON" | jq -r '.headRefName // empty')
          BASE_REF=$(echo "$PR_JSON" | jq -r '.baseRefName // "main"')
          echo "HEAD_REF=$HEAD_REF" >> "$GITHUB_ENV"
          echo "BASE_REF=$BASE_REF" >> "$GITHUB_ENV"

      - name: Trigger Conflict Resolver
        if: steps.check.outputs.conflict_resolve == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh workflow run auto-conflict-resolver.yml -f issue_number="$ISSUE_NUMBER" -f comment_body="$COMMENT_BODY" -f source_branch="$HEAD_REF" -f target_branch="$BASE_REF" || true

      - name: Trigger Update Snapshots
        if: steps.check.outputs.update_snapshots == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh workflow run update-snapshots.yml --ref "$HEAD_REF" -f issue_number="$ISSUE_NUMBER" -f comment_body="$COMMENT_BODY" || true

      - name: Trigger Ollama ChatOps
        if: steps.check.outputs.ollama_chatops == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh workflow run ollama-chatops.yml --ref "$HEAD_REF" -f issue_number="$ISSUE_NUMBER" -f comment_body="$COMMENT_BODY" || true

      - name: Trigger Jules Fix CI
        if: steps.check.outputs.jules_fix_ci == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh workflow run jules-fix-trigger.yml --ref "$HEAD_REF" -f issue_number="$ISSUE_NUMBER" -f comment_body="$COMMENT_BODY" || true
