name: Issue Comment Dispatcher

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  dispatch:
    uses: ./boomtick-pkg/workflows/issue-comment-dispatcher-reusable.yml
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
