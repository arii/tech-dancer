name: Auto-Resolve Merge Conflicts

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: write
  pull-requests: write


jobs:
  resolve-conflicts:
    runs-on: ubuntu-latest
    if: github.event.pull_request.mergeable == false || contains(github.event.pull_request.labels.*.name, 'has-conflicts')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@10.28.2 --activate

      - name: Check active runtime
        run: |
          pnpm run check:runtime-files
          pnpm run doctor

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh > install_ollama.sh
          sh install_ollama.sh
          rm install_ollama.sh

      - name: Install Click
        run: pip install click

      - name: Start Ollama Server
        run: |
          ollama serve > ollama_output.log 2>&1 &
          sleep 5
          curl -f --retry 10 --retry-delay 2 http://localhost:11434/api/tags || (cat ollama_output.log && exit 1)

      - name: Pull Model
        run: ollama pull qwen2.5-coder:7b

      - name: Find and Resolve Conflicts
        run: |
          # Use our unified CLI for resolution
          # Setting PYTHONPATH ensures modules can find each other without sys.path hacks
          PYTHONPATH="$PYTHONPATH:$(pwd)/dev-tools"; export PYTHONPATH
          python3 dev-tools/td_cli.py gh resolve

      - name: Validate Resolution
        run: |
          pnpm install --frozen-lockfile
          pnpm run type-check

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-resolved merge conflicts using MergeLlama"
          file_pattern: '.'
