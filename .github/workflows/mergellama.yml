name: Auto-Resolve Merge Conflicts

on:
  pull_request:
    types: [opened, synchronize, reopened]


permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true



jobs:
  resolve-conflicts:
    runs-on: ubuntu-latest
    container: ghcr.io/arii/tech-dancer:latest
    if: github.event.pull_request.mergeable == false || contains(github.event.pull_request.labels.*.name, 'has-conflicts')
    env:
      AI_MODEL: gpt-4o-mini
      GITHUB_MODELS_BASE_URL: https://models.inference.ai.azure.com
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Check active runtime
        run: |
          pnpm run check:runtime-files
          pnpm run doctor

      - name: Find and Resolve Conflicts
        run: |
          # Use our unified CLI for resolution
          # Setting PYTHONPATH ensures modules can find each other without sys.path hacks
          PYTHONPATH="$PYTHONPATH:$(pwd)/dev-tools"; export PYTHONPATH
          python3 dev-tools/td_cli.py gh resolve

      - name: Validate Resolution
        run: |
          pnpm install --frozen-lockfile
          pnpm run type-check

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        with:
          commit_message: "chore: auto-resolved merge conflicts using AI"
          file_pattern: '.'
