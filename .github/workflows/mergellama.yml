name: Auto-Resolve Merge Conflicts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write


jobs:
  resolve-conflicts:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer/ollama-base:latest
      env:
        OLLAMA_MODELS: /root/.ollama/models
    if: github.event.pull_request.mergeable == false || contains(github.event.pull_request.labels.*.name, 'has-conflicts')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Dependencies
        run: |
          if ! python3 -c "import click" 2>/dev/null; then
            pip3 install --break-system-packages click
          fi

      - name: Start Ollama Server
        run: |
          ollama serve > ollama_output.log 2>&1 &
          # Wait for server with 30s timeout
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Ollama server failed to start"
          cat ollama_output.log
          exit 1

      - name: Find and Resolve Conflicts
        run: |
          # Use our unified CLI for resolution
          # Setting PYTHONPATH ensures modules can find each other without sys.path hacks
          export PYTHONPATH="$PYTHONPATH:$(pwd)/dev-tools"
          python3 dev-tools/td_cli.py gh resolve

      - name: Validate Resolution
        run: |
          pnpm install --frozen-lockfile
          pnpm run type-check

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-resolved merge conflicts using MergeLlama"
          file_pattern: '.'
