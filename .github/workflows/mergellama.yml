name: Auto-Resolve Merge Conflicts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  mergellama:
    uses: ./boomtick-pkg/workflows/mergellama-reusable.yml
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
