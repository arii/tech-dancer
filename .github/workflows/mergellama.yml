name: Auto-Resolve Merge Conflicts

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true



jobs:
  resolve-conflicts:
    runs-on: ubuntu-latest
    if: github.event.pull_request.mergeable == false || contains(github.event.pull_request.labels.*.name, 'has-conflicts')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Check active runtime
        run: |
          pnpm run check:runtime-files
          pnpm run doctor

      - name: Setup Ollama
        id: setup-ollama
        run: |
          if ! curl -fsSL https://ollama.com/install.sh | sh; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Failed to install Ollama"
            exit 0
          fi
          ollama serve > /tmp/ollama.log 2>&1 &
          echo "Waiting for Ollama to be ready..."
          for i in {1..15}; do
            if curl -sf http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama is ready!"
              ollama list
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting... ($i/15)"
            sleep 2
          done
          echo "Ollama failed to start"
          cat /tmp/ollama.log
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: |
          if ! python3 -c "import click, github, requests" 2>/dev/null; then
            pip install click PyGithub requests
          fi

      - name: Pull Model
        if: steps.setup-ollama.outputs.ready == 'true'
        run: ollama pull qwen2.5-coder:7b

      - name: Find and Resolve Conflicts
        if: steps.setup-ollama.outputs.ready == 'true'
        run: |
          # Use our unified CLI for resolution
          # Setting PYTHONPATH ensures modules can find each other without sys.path hacks
          PYTHONPATH="$PYTHONPATH:$(pwd)/dev-tools"; export PYTHONPATH
          python3 dev-tools/td_cli.py gh resolve

      - name: Diagnostic Mode
        if: steps.setup-ollama.outputs.ready != 'true'
        run: |
          echo "⚠️ Ollama is unavailable. Conflict resolution skipped."
          echo "Ollama Logs:"
          cat /tmp/ollama.log || echo "No logs found."

      - name: Validate Resolution
        run: |
          pnpm install --frozen-lockfile
          pnpm run type-check

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-resolved merge conflicts using MergeLlama"
          file_pattern: '.'
