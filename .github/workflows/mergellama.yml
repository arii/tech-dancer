name: Auto-Resolve Merge Conflicts

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OLLAMA_MODEL: qwen2.5-coder:1.5b

permissions:
  contents: write
  pull-requests: write


jobs:
  resolve-conflicts:
    runs-on: ubuntu-latest
    if: github.event.pull_request.mergeable == false || contains(github.event.pull_request.labels.*.name, 'has-conflicts')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@10.28.2 --activate

      - name: Check active runtime
        run: |
          pnpm run check:runtime-files
          pnpm run doctor

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          echo "Waiting for Ollama to be ready..."
          for i in {1..15}; do
            if curl -sf http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama is ready!"
              exit 0
            fi
            echo "Waiting... ($i/15)"
            sleep 2
          done
          echo "Ollama failed to start"
          cat /tmp/ollama.log
          exit 1

      - name: Install Dependencies
        run: pip install click PyGithub requests

      - name: Pull Model
        run: ollama pull ${{ env.OLLAMA_MODEL }}

      - name: Find and Resolve Conflicts
        run: |
          # Use our unified CLI for resolution
          # Setting PYTHONPATH ensures modules can find each other without sys.path hacks
          PYTHONPATH="$PYTHONPATH:$(pwd)/dev-tools"; export PYTHONPATH
          python3 dev-tools/td_cli.py gh resolve

      - name: Validate Resolution
        run: |
          pnpm install --frozen-lockfile
          pnpm run type-check

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-resolved merge conflicts using MergeLlama"
          file_pattern: '.'
