name: Release boomtick-cli

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: arii/tech-dancer/boomtick-pkg/.github/workflows/release-logic.yml@fix/release-workflow-manual-trigger
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
