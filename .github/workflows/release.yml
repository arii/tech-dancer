name: Release boomtick-cli

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Setup Node.js
        uses: actions/setup-node@v6 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          node-version-file: '.node-version'

      - name: Check version and tag status
        id: check_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v$CURRENT_VERSION"
          
          # Fetch tags to check existence
          git fetch --tags
          
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists."
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              echo "Triggered directly by tag. Proceeding."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Version has not changed or tag already exists. Skipping release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Tag $TAG_NAME does not exist. Proceeding with new release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Git Tag and GitHub Release
        if: steps.check_version.outputs.should_release == 'true' && steps.check_version.outputs.create_tag == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.check_version.outputs.tag_name }}
          VERSION: ${{ steps.check_version.outputs.version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          gh release create "$TAG_NAME" --title "chore: release $TAG_NAME" --generate-notes

      - name: Setup Python
        if: steps.check_version.outputs.should_release == 'true'
        uses: actions/setup-python@v6 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pnpm
        if: steps.check_version.outputs.should_release == 'true'
        uses: pnpm/action-setup@v6 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Install dependencies
        if: steps.check_version.outputs.should_release == 'true'
        run: |
          pnpm install --frozen-lockfile
          pip install -r boomtick-pkg/cli/requirements.txt
          pip install build twine

      - name: Sync schemas/contracts
        if: steps.check_version.outputs.should_release == 'true'
        run: |
          PYTHONPATH="$PYTHONPATH:$(pwd)/boomtick-pkg/cli"
          export PYTHONPATH
          python3 boomtick-pkg/cli/dev_tools/schema_gen.py
          pnpm exec tsx boomtick-pkg/mcp/scripts/sync-contracts.ts

      - name: Build TypeScript MCP
        if: steps.check_version.outputs.should_release == 'true'
        run: pnpm --filter @boomtick/mcp build

      - name: Copy compiled JS
        if: steps.check_version.outputs.should_release == 'true'
        run: |
          mkdir -p boomtick-pkg/cli/dev_tools/dist
          cp -r boomtick-pkg/mcp/dist/* boomtick-pkg/cli/dev_tools/dist/

      - name: Build Python Package
        if: steps.check_version.outputs.should_release == 'true'
        run: |
          cd boomtick-pkg/cli
          python3 -m build

      - name: Publish to PyPI
        if: steps.check_version.outputs.should_release == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload boomtick-pkg/cli/dist/*
