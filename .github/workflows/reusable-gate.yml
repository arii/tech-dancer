name: Reusable CI Gate

on:
  workflow_call:
    outputs:
      has_changes:
        description: "True if changes were detected"
        value: ${{ jobs.verify-changes.outputs.has_changes }}

jobs:
  verify-changes:
    name: "FOUNDATIONAL GATE: Checks for actual code modifications"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    outputs:
      has_changes: ${{ steps.check_diff.outputs.has_changes }}
    steps:
      - name: Checkout Code with History
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify Diff Composition
        id: check_diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Comparing against base branch: $BASE_REF"
            git fetch origin "$BASE_REF"
            if git diff --quiet "origin/$BASE_REF...HEAD"; then
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "❌ Empty pull request detected! No code files modified."
            else
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "✅ Valid pull request found with actual file changes."
            fi
          else
            # For pushes, compare the push range to ignore empty metadata patches
            # Default to checking against previous commit if before_sha is missing/empty
            DIFF_TARGET="HEAD~1"
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
               # New branch or tag, check against parent if it exists
               if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                 DIFF_TARGET=""
               fi
            else
               DIFF_TARGET="$BEFORE_SHA"
            fi

            if [ -n "$DIFF_TARGET" ]; then
              if git diff --quiet "$DIFF_TARGET" HEAD; then
                echo "has_changes=false" >> "$GITHUB_OUTPUT"
                echo "❌ Empty commit detected! No code files modified."
              else
                echo "has_changes=true" >> "$GITHUB_OUTPUT"
                echo "✅ Valid patch found with actual file changes."
              fi
            else
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "✅ Initial commit found."
            fi
          fi
