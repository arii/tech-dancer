name: Reusable CI Gate Trigger

on:
  workflow_call:
    outputs:
      has_changes:
        description: "True if changes were detected"
        value: ${{ jobs.call-workflow.outputs.has_changes }}

jobs:
  call-workflow:
    uses: ./boomtick-pkg/workflows/reusable-gate.yml
    secrets: inherit
    permissions:
      pull-requests: write
      contents: write
