name: 'Self-Healing CI'

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  issue_comment:
    types: [created]

env:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  repair:
    if: github.repository == 'disabled'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: dev-tools
      OLLAMA_MODEL: qwen2.5-coder:1.5b
      OLLAMA_SYNTHESIS_MODEL: qwen2.5-coder:1.5b
      OLLAMA_BASE_URL: http://localhost:11434
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Main (Trusted)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Fetch and Apply PR Patch
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # We use patch application to avoid checking out untrusted code context natively via actions/checkout,
          # which mitigates CodeQL alerts about untrusted checkout with later potential execution.
          if [ "$EVENT_NAME" == "workflow_run" ]; then
            PR_NUMBER=$(gh pr list --head "$HEAD_SHA" --json number -q '.[0].number')
          else
            PR_NUMBER="$ISSUE_NUMBER"
          fi

          if [ -n "$PR_NUMBER" ]; then
            # We fetch the target PR branch to track history properly for commits, but via safe local git branch creation
            PR_HEAD=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
            git checkout -b "$PR_HEAD" || git checkout "$PR_HEAD"

            # Download the PR diff and apply it
            gh pr diff "$PR_NUMBER" > pr.patch
            git apply pr.patch || git apply pr.patch --3way || true
            rm pr.patch
          fi

      - name: Fetch Trusted Dev-Tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: trusted-tools-temp
          ref: main

      - name: Restore Trusted Dev-Tools
        run: |
          rm -rf dev-tools
          cp -r trusted-tools-temp/dev-tools dev-tools
          rm -rf trusted-tools-temp
          chmod +x dev-tools/low-compute-review.sh

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Check active runtime
        run: |
          pnpm run check:runtime-files
          pnpm run doctor

      - name: Install dependencies (Safe)
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Native Auto-Fix
        run: |
          if ! pnpm eslint . --fix; then echo "eslint failed"; exit 1; fi
          if ! pnpm oxlint --fix; then echo "oxlint failed"; exit 1; fi

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          echo "Waiting for Ollama to be ready..."
          for i in {1..15}; do
            if curl -sf http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama is ready!"
              ollama list
              exit 0
            fi
            echo "Waiting... ($i/15)"
            sleep 2
          done
          echo "Ollama failed to start"
          cat /tmp/ollama.log
          exit 1

      - name: Validate CLI
        run: |
          python3 dev-tools/td_cli.py gh --help
          python3 dev-tools/td_cli.py ai --help

      - name: Resolve PR Number
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$EVENT_NAME" == "workflow_run" ]; then
            PR_NUMBER=$(gh pr list --head "$HEAD_BRANCH" --json number -q '.[0].number')
          else
            PR_NUMBER="$ISSUE_NUMBER"
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Execute Review
        run: |
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            ./dev-tools/low-compute-review.sh "$PR_NUMBER" --no-cache
          else
            echo "No PR found for this run. Skipping AI review."
          fi

      - name: Verify Fixes
        id: verify
        run: |
          echo "Verifying repairs..."
          if pnpm run lint:ox && pnpm run type-check; then
            echo "Repair verified successfully!"
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "Repair failed verification or only partially fixed."
            if [ -n "$(git status --porcelain)" ]; then
               echo "success=partial" >> "$GITHUB_OUTPUT"
            else
               echo "success=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Commit & Push Changes
        if: steps.verify.outputs.success != 'false'
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            NEW_BRANCH="ai-repair-$RUN_ID"
            if [ "$EVENT_NAME" == "issue_comment" ]; then
              NEW_BRANCH="ai-repair-pr-$PR_NUMBER"
            fi

            git checkout -b "$NEW_BRANCH"
            git add .
            git commit -m "🤖 AI-generated fix for CI failures"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" "$NEW_BRANCH" --force

            PR_MSG="Automated repair attempt for failed run."
            if [ "${{ steps.verify.outputs.success }}" == "success" ]; then
              PR_MSG="✅ $PR_MSG (Verified to pass lint/types)"
            else
              PR_MSG="⚠️ $PR_MSG (Partial fix, still has some issues)"
            fi

            if [ "$EVENT_NAME" == "workflow_run" ]; then
              if [ "$HEAD_REPO" == "$REPO" ]; then
                if ! gh pr create --title "🤖 AI Repair: Fix CI failures" --body "$PR_MSG" --head "$NEW_BRANCH" --base "$HEAD_BRANCH"; then echo "PR creation failed"; exit 1; fi
              fi
            else
              gh pr comment "$PR_NUMBER" --body "🤖 I've attempted to fix the CI failures. $PR_MSG. See the proposed changes in branch \`$NEW_BRANCH\`."
            fi
          else
            echo "No changes to commit."
          fi
