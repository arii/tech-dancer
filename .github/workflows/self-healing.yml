name: 'Self-Healing CI'

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  repair:
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@jules-fix-local'))
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: dev-tools
      OLLAMA_MODEL: qwen2.5-coder:1.5b
      OLLAMA_SYNTHESIS_MODEL: qwen2.5-coder:1.5b
      OLLAMA_BASE_URL: http://localhost:11434
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code (Trusted)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Backup Trusted Dev-Tools
        run: |
          mkdir -p /tmp/trusted-dev-tools
          cp -r dev-tools/. /tmp/trusted-dev-tools/

      - name: Checkout failing branch
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            git fetch origin "${{ github.event.workflow_run.head_sha }}"
            git checkout "${{ github.event.workflow_run.head_sha }}"
          else
            gh pr checkout "${{ github.event.issue.number }}"
          fi

      - name: Restore Trusted Dev-Tools
        run: |
          rm -rf dev-tools
          cp -r /tmp/trusted-dev-tools dev-tools
          chmod +x dev-tools/low-compute-review.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pinned pnpm
        run: corepack prepare pnpm@10.28.2 --activate

      - name: Check active runtime
        run: |
          pnpm run check:runtime-files
          pnpm run doctor

      - name: Install dependencies (Safe)
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Native Auto-Fix
        run: |
          if ! pnpm eslint . --fix; then echo "eslint failed"; exit 1; fi
          if ! pnpm oxlint --fix; then echo "oxlint failed"; exit 1; fi

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          ollama list

      - name: Validate CLI
        run: |
          python3 dev-tools/td_cli.py gh --help
          python3 dev-tools/td_cli.py ai --help

      - name: Resolve PR Number
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            PR_NUMBER=$(gh pr list --head "${{ github.event.workflow_run.head_branch }}" --json number -q '.[0].number')
          else
            PR_NUMBER="${{ github.event.issue.number }}"
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Execute Review
        run: |
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            ./dev-tools/low-compute-review.sh "$PR_NUMBER" --no-cache
          else
            echo "No PR found for this run. Skipping AI review."
          fi

      - name: Verify Fixes
        id: verify
        run: |
          echo "Verifying repairs..."
          if pnpm run lint:ox && pnpm run type-check; then
            echo "Repair verified successfully!"
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "Repair failed verification or only partially fixed."
            if [ -n "$(git status --porcelain)" ]; then
               echo "success=partial" >> "$GITHUB_OUTPUT"
            else
               echo "success=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Commit & Push Changes
        if: steps.verify.outputs.success != 'false'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            EVENT_NAME="${{ github.event_name }}"
            REPO="${{ github.repository }}"
            RUN_ID="${{ github.run_id }}"
            PR_NUMBER="${{ env.PR_NUMBER }}"

            NEW_BRANCH="ai-repair-$RUN_ID"
            if [ "$EVENT_NAME" == "issue_comment" ]; then
              NEW_BRANCH="ai-repair-pr-$PR_NUMBER"
            fi

            git checkout -b "$NEW_BRANCH"
            git add .
            git commit -m "🤖 AI-generated fix for CI failures"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" "$NEW_BRANCH" --force

            PR_MSG="Automated repair attempt for failed run."
            if [ "${{ steps.verify.outputs.success }}" == "success" ]; then
              PR_MSG="✅ $PR_MSG (Verified to pass lint/types)"
            else
              PR_MSG="⚠️ $PR_MSG (Partial fix, still has some issues)"
            fi

            if [ "$EVENT_NAME" == "workflow_run" ]; then
              HEAD_REPO="${{ github.event.workflow_run.head_repository.full_name }}"
              HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
              if [ "$HEAD_REPO" == "$REPO" ]; then
                if ! gh pr create --title "🤖 AI Repair: Fix CI failures" --body "$PR_MSG" --head "$NEW_BRANCH" --base "$HEAD_BRANCH"; then echo "PR creation failed"; exit 1; fi
              fi
            else
              gh pr comment "$PR_NUMBER" --body "🤖 I've attempted to fix the CI failures. $PR_MSG. See the proposed changes in branch \`$NEW_BRANCH\`."
            fi
          else
            echo "No changes to commit."
          fi
