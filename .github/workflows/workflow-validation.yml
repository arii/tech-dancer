name: Workflow Validation

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.yamllint.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.yamllint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Validate all workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate workflow YAML syntax with PyYAML
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          workflow_dir = Path('.github/workflows')
          files = sorted(workflow_dir.glob('*.yml')) + sorted(workflow_dir.glob('*.yaml'))
          if not files:
              raise SystemExit('No workflow files found.')

          for file in files:
              with file.open('r', encoding='utf-8') as fp:
                  yaml.safe_load(fp)
              print(f'✅ Parsed: {file}')
          PY

      - name: Lint workflow logic with actionlint
        uses: rhysd/actionlint@v1
