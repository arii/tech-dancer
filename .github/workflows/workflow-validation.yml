name: Workflow Validation

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.yamllint.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.yamllint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Validate all workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint workflow logic with actionlint
        uses: rhysd/actionlint@v1
