name: Workflow Validation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.yamllint.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.yamllint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Validate all workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download actionlint
        id: get_actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash > download-actionlint.sh
          bash download-actionlint.sh
          rm download-actionlint.sh
        shell: bash

      - name: Lint workflow logic with actionlint
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash
