name: Workflow Validation


on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.yamllint.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.yamllint.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  validate-workflows:
    name: Validate all workflow files
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.CI_CONTAINER_IMAGE }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download actionlint
        id: get_actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash > download-actionlint.sh
          bash download-actionlint.sh
          rm download-actionlint.sh
        shell: bash

      - name: Lint workflow logic with actionlint
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash
