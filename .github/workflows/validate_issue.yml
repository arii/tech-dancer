name: Validate Issue Quality

on:
  issues:
    types: [opened, edited]

env:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.x'
      - run: pip install PyGithub
      - name: Validate Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/dev-tools
        run: |
          python3 dev-tools/td_cli.py validate-issue --issue-number ${{ github.event.issue.number }} --post-comments --execute
