name: Validate Issue Quality

on:
  issues:
    types: [opened, edited]


jobs:
  validate:
    runs-on: ubuntu-latest
    concurrency:
      group: validate-issue-${{ github.event.issue.number }}
      cancel-in-progress: true
    container:
      image: ghcr.io/arii/tech-dancer:latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace
        with:
          setup-node: 'false'

      - name: Validate Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          td-cli gh validate-issue --issue-number ${{ github.event.issue.number }} --post-comments --execute || { echo "::error ::Issue validation failed. Check logs."; exit 1; }
