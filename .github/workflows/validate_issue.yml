name: Validate Issue Quality

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  validate:
    uses: ./boomtick-pkg/workflows/validate-issue-reusable.yml
    with:
      issue_number: ${{ github.event.issue.number }}
    secrets: inherit # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
