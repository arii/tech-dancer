name: Validate Issue Quality

on:
  issues:
    types: [opened, edited]


jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v6
      - name: Validate Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/dev-tools
        run: |
          python3 dev-tools/td_cli.py gh validate-issue --issue-number ${{ github.event.issue.number }} --post-comments --execute
