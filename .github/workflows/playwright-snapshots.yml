name: Playwright Snapshots Update

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-snapshots:
    name: Update Playwright Snapshots
    # Only allow owners, members, or collaborators to trigger this
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/update-snapshots') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.50.0-noble # Use noble (Ubuntu 24.04) based image
    steps:
      - name: Get PR branch
        id: get-branch
        run: |
          # Fetch PR details to get the head branch name
          PR_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}")
          HEAD_REF=$(echo "$PR_DATA" | jq -r .head.ref)
          echo "head_ref=$HEAD_REF" >> $GITHUB_OUTPUT

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get-branch.outputs.head_ref }}
          fetch-depth: 0

      - name: Fix dubious ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Playwright Snapshots
        run: pnpm run test:e2e --update-snapshots
        env:
          CI: true
          NODE_ENV: production

      - name: Commit and push updated snapshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update playwright snapshots [skip ci]"
          file_pattern: 'tests/**/*.{png,yml}'
