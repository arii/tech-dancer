name: Update Submodule

on:
  repository_dispatch:
    types: [update-submodule]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch name, commit hash, or tag to update the submodule to'
        required: true
        default: 'main'
        type: string
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Workspace
        uses: ./boomtick-pkg/mcp/actions/setup-workspace
        with:
          setup-python: 'false'

      - name: Determine Target Ref
        id: target
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          TARGET_REF="${INPUT_REF:-main}"
          echo "target_ref=$TARGET_REF" >> "$GITHUB_OUTPUT"

          # Replace slashes with hyphens for safe branch name
          SAFE_REF=$(echo "$TARGET_REF" | tr '/' '-')

          # Further sanitize to ensure a valid branch name
          SAFE_REF=$(echo "$SAFE_REF" | tr -cd '[:alnum:]_.-')

          echo "safe_ref=$SAFE_REF" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Update submodules
        env:
          TARGET_REF: ${{ steps.target.outputs.target_ref }}
        run: |
          set -eo pipefail

          echo "Updating boomtick-pkg to ref: $TARGET_REF"

          cd boomtick-pkg
          git fetch origin
          git checkout "$TARGET_REF"
          cd ..

          if [[ -n $(git status --porcelain boomtick-pkg) ]]; then
            # Install dependencies to update lockfile
            pnpm install --no-frozen-lockfile
          else
            echo "No changes in submodules."
          fi
        shell: bash

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update submodule to ${{ steps.target.outputs.target_ref }} and update lockfile"
          branch: "automation/update-submodule-${{ steps.target.outputs.safe_ref }}"
          delete-branch: true
          title: "chore: update submodule to ${{ steps.target.outputs.target_ref }}"
          body: |
            ## Submodule Update
            - Updated `boomtick-pkg` to ref: `${{ steps.target.outputs.target_ref }}`
            - Updated `pnpm-lock.yaml`
            - Automated update triggered by ${{ github.event_name }}

      - name: Trigger CI on new PR
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        run: |
          gh workflow run ci.yml --ref "automation/update-submodule-${{ steps.target.outputs.safe_ref }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - Automated update triggered by `${{ github.event_name }}`

            _This PR was automatically generated to sync the submodule._

      - name: Job Summary
        env:
          INPUT_REF: ${{ github.event.inputs.ref || 'main' }}
        run: |
          if [ -n "${{ steps.cpr.outputs.pull-request-number }}" ]; then
            {
              echo "### ✅ Pull Request Created/Updated"
              echo "- **PR:** #${{ steps.cpr.outputs.pull-request-number }}"
              echo "- **URL:** ${{ steps.cpr.outputs.pull-request-url }}"
              echo "- **Branch:** \`automation/update-submodule-$INPUT_REF\`"
              echo "- **Target Ref:** \`$INPUT_REF\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ℹ️ No Pull Request Created"
              echo "No changes were detected in the submodule or lockfile."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash
