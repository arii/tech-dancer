name: Update Submodule

on:
  repository_dispatch:
    types: [update-submodule]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch name, commit hash, or tag to update the submodule to'
        required: true
        default: 'main'
        type: string
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # nosemgrep
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4 # nosemgrep
        with:
          node-version-file: '.node-version'

      - name: Update submodules and push changes
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          set -eo pipefail

          TARGET_REF="${INPUT_REF:-main}"
          echo "Updating boomtick-pkg to ref: $TARGET_REF"

          cd boomtick-pkg
          git fetch origin
          git checkout "$TARGET_REF"
          cd ..

          if [[ -n $(git status --porcelain boomtick-pkg) ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            corepack enable
            corepack prepare pnpm@10.28.2 --activate
            pnpm install --no-frozen-lockfile

            git add boomtick-pkg pnpm-lock.yaml
            git commit -m "chore: update submodule to $TARGET_REF and update lockfile"
            git push
            echo "Submodules updated and changes pushed."
          else
            echo "No changes in submodules."
          fi
