name: Security & Quality Scan

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'etl/**'
      - 'dev-tools/**'
      - 'boomtick-mcp/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'etl/**'
      - 'dev-tools/**'
      - 'boomtick-mcp/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '45 4 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-changes:
    uses: ./.github/workflows/reusable-gate.yml
    permissions:
      pull-requests: write
      contents: write

  security-scan:
    needs: verify-changes
    if: needs.verify-changes.outputs.has_changes == 'true' || github.event_name == 'schedule'
    name: Security Scan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/arii/tech-dancer:latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Workspace
        uses: ./.github/actions/setup-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Gitleaks Secret Detection
        run: |
          # Use the gitleaks binary installed in the container
          gitleaks detect --redact -v --exit-code=2

      - name: Semgrep Static Analysis
        run: pnpm run audit:semgrep

      - name: Oxlint Scan
        run: pnpm run lint:ox

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
