name: 'Setup Workspace'
description: 'Bootstraps the workspace natively'
inputs:
  setup-node:
    description: "Install Node.js and pnpm"
    required: false
    default: 'true'
  setup-python:
    description: "Install dev-tools (Python)"
    required: false
    default: 'true'
  node-version-file:
    description: "Path to .node-version file"
    required: false
    default: '.node-version'
  pnpm-version:
    description: "Version of pnpm to activate"
    required: false
    default: '10.28.2'
  force-node24:
    description: "Force JavaScript actions to run on Node 24"
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      if: ${{ inputs.setup-node == 'true' }}
      uses: actions/setup-node@v4
      with:
        node-version-file: ${{ inputs.node-version-file }}

    - name: Setup pnpm
      if: ${{ inputs.setup-node == 'true' }}
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Python
      if: ${{ inputs.setup-python == 'true' }}
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install boomtick CLI
      if: ${{ inputs.setup-python == 'true' }}
      shell: bash
      run: |
        python3 -m pip install --break-system-packages boomtick
