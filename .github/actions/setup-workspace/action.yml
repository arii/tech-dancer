name: 'Setup Workspace'
description: 'Bootstraps the workspace by installing Node.js and pnpm'
inputs:
  setup-node:
    description: "Install Node.js and pnpm"
    required: false
    default: 'true'
  setup-python:
    description: "Install Python (Not implemented, provided for compatibility)"
    required: false
    default: 'false'
  node-version-file:
    description: "Path to .node-version file"
    required: false
    default: ".node-version"

runs:
  using: 'composite'
  steps:
    - name: Resolve pnpm version
      if: inputs.setup-node == 'true'
      id: pnpm-version
      shell: bash
      run: |
        # Extract pnpm version from package.json packageManager field
        PNPM_VER=$(node -e "console.log(require('./package.json').packageManager?.split('@')[1] || '10.28.2')")
        echo "version=$PNPM_VER" >> "$GITHUB_OUTPUT"

    - name: Setup pnpm
      if: inputs.setup-node == 'true'
      uses: pnpm/action-setup@v6 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      with:
        version: ${{ steps.pnpm-version.outputs.version }}

    - name: Get pnpm store directory
      if: inputs.setup-node == 'true'
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      if: inputs.setup-node == 'true'
      uses: actions/cache@v4.2.0 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Setup Node.js
      if: inputs.setup-node == 'true'
      uses: actions/setup-node@v6 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      with:
        node-version-file: ${{ inputs.node-version-file }}

    - name: Enable Corepack
      if: inputs.setup-node == 'true'
      run: corepack enable
      shell: bash

    - name: Activate pinned pnpm
      if: inputs.setup-node == 'true'
      env:
        PNPM_VERSION: ${{ steps.pnpm-version.outputs.version }}
      run: corepack prepare pnpm@"$PNPM_VERSION" --activate
      shell: bash
