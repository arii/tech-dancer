name: 'Setup Workspace'
description: 'Bootstraps the workspace by installing dev-tools and configuring the environment'
runs:
  using: 'composite'
  steps:
    - name: Install dev-tools
      shell: bash
      run: |
        echo "::group::Install dev-tools"
        pip install -e dev-tools/ --break-system-packages

        # Add multiple potential local bin paths to GITHUB_PATH to ensure td-cli resolution
        # across different GHA runner configurations and container users.
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "/github/home/.local/bin" >> "$GITHUB_PATH"

        echo "::endgroup::"

    - name: Verify td-cli on PATH
      shell: bash
      run: |
        if ! command -v td-cli >/dev/null 2>&1; then
          echo "::error::td-cli not found on PATH after installation."
          exit 1
        fi
        echo "✅ td-cli is resolvable on PATH."

    - name: Export PYTHONPATH
      shell: bash
      run: |
        # Use $(pwd) to get the container-internal path, avoiding host-path leakage from $GITHUB_WORKSPACE
        REPO_DIR=$(pwd)
        echo "PYTHONPATH=$PYTHONPATH:$REPO_DIR/dev-tools" >> "$GITHUB_ENV"
        echo "✅ PYTHONPATH exported as $REPO_DIR/dev-tools"
