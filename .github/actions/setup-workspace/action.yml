name: 'Setup Workspace'
description: 'Bootstraps the workspace natively'
inputs:
  setup-node:
    description: "Install Node.js and pnpm"
    required: false
    default: 'true'
  setup-python:
    description: "Install dev-tools (Python)"
    required: false
    default: 'true'
  node-version-file:
    description: "Path to .node-version file"
    required: false
    default: '.node-version'
  pnpm-version:
    description: "Version of pnpm to activate"
    required: false
    default: '10.28.2'
  force-node24:
    description: "Force JavaScript actions to run on Node 24"
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      if: ${{ inputs.setup-node == 'true' }}
      uses: actions/setup-node@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      with:
        node-version-file: ${{ inputs.node-version-file }}

    - name: Setup pnpm
      if: ${{ inputs.setup-node == 'true' }}
      uses: pnpm/action-setup@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Python
      if: ${{ inputs.setup-python == 'true' }}
      uses: actions/setup-python@v5 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      with:
        python-version: '3.12'

    - name: Install boomtick CLI & ETL Dependencies
      if: ${{ inputs.setup-python == 'true' }}
      shell: bash
      run: |
        python3 -m pip install --break-system-packages boomtick-cli
        if [ -f "etl/requirements.txt" ]; then
          python3 -m pip install --break-system-packages -r etl/requirements.txt
        fi
        if [ -f "requirements-dev.txt" ]; then
          python3 -m pip install --break-system-packages -r requirements-dev.txt
        fi
