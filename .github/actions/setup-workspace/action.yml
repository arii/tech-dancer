name: 'Setup Workspace (Legacy Wrapper)'
description: 'Bootstraps the workspace (Wrapper for backward compatibility)'
inputs:
  setup-node:
    description: "Install Node.js and pnpm"
    required: false
    default: 'true'
  setup-python:
    description: "Install dev-tools (Python)"
    required: false
    default: 'true'
  node-version-file:
    description: "Path to .node-version file"
    required: false
    default: '.node-version'
  pnpm-version:
    description: "Version of pnpm to activate"
    required: false
    default: '10.28.2'
  force-node24:
    description: "Force JavaScript actions to run on Node 24"
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - uses: arii/boomtick/.github/actions/setup-workspace@main
      with:
        setup-node: ${{ inputs.setup-node }}
        setup-python: ${{ inputs.setup-python }}
        node-version-file: ${{ inputs.node-version-file }}
        pnpm-version: ${{ inputs.pnpm-version }}
        force-node24: ${{ inputs.force-node24 }}
