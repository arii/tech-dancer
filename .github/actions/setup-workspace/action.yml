name: 'Setup Workspace'
description: 'Bootstraps the workspace by installing Node.js, pnpm, Python, and dev-tools'
inputs:
  setup-node:
    description: "Install Node.js and pnpm"
    required: false
    default: 'true'
  setup-python:
    description: "Install dev-tools (Python)"
    required: false
    default: 'true'
  node-version-file:
    description: "Path to .node-version file"
    required: false
    default: '.node-version'
  pnpm-version:
    description: "Version of pnpm to activate"
    required: false
    default: '10.28.2'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      if: inputs.setup-node == 'true'
      uses: actions/setup-node@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      with:
        node-version-file: ${{ inputs.node-version-file }}

    - name: Setup pnpm
      if: inputs.setup-node == 'true'
      uses: pnpm/action-setup@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Verify active Node.js and pnpm
      if: inputs.setup-node == 'true'
      shell: bash
      run: |
        echo "Active Node: $(which node) ($(node -v))"
        echo "Active pnpm: $(which pnpm) ($(pnpm -v))"

    - name: Ensure Python dev tooling and boomtick-cli are installed
      if: inputs.setup-python == 'true'
      shell: bash
      run: |
        PYTHON_CMD="python3"
        if ! command -v python3 >/dev/null 2>&1 && command -v python >/dev/null 2>&1; then
          PYTHON_CMD="python"
        fi

        echo "Ensuring boomtick-cli and dev tooling are installed..."
        if [ -f "requirements-dev.txt" ]; then
          $PYTHON_CMD -m pip install --no-cache-dir --break-system-packages -r requirements-dev.txt
        else
          $PYTHON_CMD -m pip install --no-cache-dir --break-system-packages --upgrade "boomtick-cli>=0.12.1"
        fi

        # Ensure python scripts directory is on PATH
        SCRIPTS_DIR=$($PYTHON_CMD -c "import sysconfig; print(sysconfig.get_path('scripts'))" 2>/dev/null || true)
        if [ -n "$SCRIPTS_DIR" ] && [ -d "$SCRIPTS_DIR" ]; then
          echo "$SCRIPTS_DIR" >> "$GITHUB_PATH"
        fi
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

        echo "Verifying installed tools..."
        command -v td || echo "::warning::td not found on PATH"
        command -v pylint || echo "::warning::pylint not found on PATH"
        td --help >/dev/null || true
