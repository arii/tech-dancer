name: 'Setup Ollama'
description: 'Installs dependencies and sets up Ollama'
runs:
  using: 'composite'
  steps:
    - name: Install dependencies and Ollama
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y zstd
        curl -fsSL https://ollama.com/install.sh > install_ollama.sh
        sh install_ollama.sh
        rm install_ollama.sh
