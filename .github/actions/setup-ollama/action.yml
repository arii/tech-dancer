name: 'Setup Ollama'
description: 'Installs Ollama, starts server, and checks readiness'
inputs:
  model:
    description: 'Optional model to pull after startup'
    required: false
    default: ''
outputs:
  ready:
    description: 'true if Ollama is ready, false otherwise'
    value: ${{ steps.setup.outputs.ready }}
runs:
  using: 'composite'
  steps:
    - id: setup
      shell: bash
      run: |
        if ! curl -fsSL https://ollama.com/install.sh | sh; then
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "Failed to install Ollama"
          exit 0
        fi
        ollama serve > /tmp/ollama.log 2>&1 &
        echo "Waiting for Ollama to be ready..."
        for i in {1..15}; do
          if curl -sf http://localhost:11434/api/tags > /dev/null; then
            echo "Ollama is ready!"
            if [ -n "$OLLAMA_MODEL" ]; then
              echo "Pulling model $OLLAMA_MODEL..."
              ollama pull "$OLLAMA_MODEL"
            fi
            ollama list
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Waiting... ($i/15)"
          sleep 2
        done
        echo "Ollama failed to start"
        cat /tmp/ollama.log
        echo "ready=false" >> "$GITHUB_OUTPUT"
      env:
        OLLAMA_MODEL: ${{ inputs.model }}
