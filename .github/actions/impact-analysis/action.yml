name: 'Impact Analysis Wrapper'
description: 'Wrapper for impact analysis to handle pathing correctly'
inputs:
  github_token:
    description: "GitHub Token"
    required: true
  pr_number:
    description: "Pull Request Number"
    required: true
  jules_api_key:
    description: "Jules API Key"
    required: true
  gemini_api_key:
    description: "Gemini API Key"
    required: false

runs:
  using: 'composite'
  steps:
    - name: Pre-patch Impact Analysis Action
      run: |
        sed -i 's|RESOLVED_PATH=\$(realpath "${{ github.action_path }}/../../../scripts/send-jules-impact.py")|if [ -f "\$GITHUB_WORKSPACE/boomtick-pkg/scripts/send-jules-impact.py" ]; then\n          RESOLVED_PATH="\$GITHUB_WORKSPACE/boomtick-pkg/scripts/send-jules-impact.py"\n        elif [ -f "\$GITHUB_WORKSPACE/scripts/send-jules-impact.py" ]; then\n          RESOLVED_PATH="\$GITHUB_WORKSPACE/scripts/send-jules-impact.py"\n        else\n          RESOLVED_PATH=""\n        fi|g' boomtick-pkg/mcp/actions/impact-analysis/action.yml

        sed -i 's|td-cli gh summary-report >> "\$GITHUB_STEP_SUMMARY"|export PATH="\$HOME/.local/bin:/github/home/.local/bin:\$PATH"\n        td-cli gh summary-report >> "\$GITHUB_STEP_SUMMARY"|g' boomtick-pkg/mcp/actions/impact-analysis/action.yml
      shell: bash

    - uses: ./boomtick-pkg/mcp/actions/impact-analysis # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      with:
        github_token: ${{ inputs.github_token }}
        pr_number: ${{ inputs.pr_number }}
        jules_api_key: ${{ inputs.jules_api_key }}
        gemini_api_key: ${{ inputs.gemini_api_key }}
