name: 'BoomTick Impact Analysis Wrapper'
description: 'Comprehensive deployment impact analysis, diffing, AI reviews, and reporting'
inputs:
  github_token:
    description: 'GitHub token'
    required: true
  gemini_api_key:
    description: 'Gemini API key'
    required: true
  pr_number:
    description: 'PR number'
    required: true
  jules_api_key:
    description: 'Jules API key required for authenticating with the Jules API to send impact analysis results. Ensure this key is stored securely and not exposed in logs.'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Pre-flight Validations
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        INPUT_JULES_API_KEY: ${{ inputs.jules_api_key }}
      run: |
        echo "=== Pre-flight Validations ==="

        # Mask sensitive inputs immediately to prevent any log exposure
        if [[ -n "$INPUT_JULES_API_KEY" ]]; then
          echo "::add-mask::$INPUT_JULES_API_KEY"
        fi
        if [[ -n "$INPUT_GEMINI_API_KEY" ]]; then
          echo "::add-mask::$INPUT_GEMINI_API_KEY"
        fi
        if [[ -n "$INPUT_GITHUB_TOKEN" ]]; then
          echo "::add-mask::$INPUT_GITHUB_TOKEN"
        fi

        # Validate pr_number is a clean integer (if provided)
        if [[ -n "$INPUT_PR_NUMBER" ]]; then
          if [[ ! "$INPUT_PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "❌ Error: pr_number must be a positive integer."
            exit 1
          fi
        fi

        # Validate github_token (if provided)
        if [[ -n "$INPUT_GITHUB_TOKEN" ]]; then
          if [[ "$INPUT_GITHUB_TOKEN" == -* ]]; then
            echo "❌ Error: github_token starts with a hyphen."
            exit 1
          fi
        fi

        # Validate gemini_api_key format (if provided)
        if [[ -n "$INPUT_GEMINI_API_KEY" ]]; then
          if [[ "$INPUT_GEMINI_API_KEY" == -* ]]; then
            echo "❌ Error: gemini_api_key starts with a hyphen."
            exit 1
          fi
        fi

        # Validate jules_api_key format and constraints (if provided)
        if [[ -n "$INPUT_JULES_API_KEY" ]]; then
          if [[ "$INPUT_JULES_API_KEY" == -* ]]; then
            echo "❌ Error: jules_api_key starts with a hyphen."
            exit 1
          fi
          # Check for forbidden shell metacharacters to prevent any injection
          if [[ "$INPUT_JULES_API_KEY" =~ [;&\|$\(\)\<\>\'\`\"\\#] ]]; then
            echo "❌ Error: jules_api_key contains forbidden characters."
            exit 1
          fi
        fi

        echo "✅ Pre-flight Validations Passed!"

    - name: Symlink host path to container workspace
      shell: bash
      run: |
        if [ ! -d "/home/runner/work/tech-dancer/tech-dancer" ]; then
          echo "Creating host-to-container symlink for path resolution..."
          mkdir -p /home/runner/work/tech-dancer
          ln -s /__w/tech-dancer/tech-dancer /home/runner/work/tech-dancer/tech-dancer || true
        fi

    - name: Invoke Submodule Impact Analysis
      uses: ./boomtick-pkg/mcp/actions/impact-analysis
      with:
        github_token: ${{ inputs.github_token }}
        gemini_api_key: ${{ inputs.gemini_api_key }}
        pr_number: ${{ inputs.pr_number }}
        jules_api_key: ${{ inputs.jules_api_key }}
