name: "Setup Node.js and pnpm"
description: "Consolidated action to setup Node.js, pnpm, and check runtime"
inputs:
  node-version-file:
    description: "Path to .node-version file"
    required: false
    default: ".node-version"
  pnpm-version:
    description: "Version of pnpm to activate"
    required: false
    default: "10.28.2"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml
        node-version-file: ${{ inputs.node-version-file }}
