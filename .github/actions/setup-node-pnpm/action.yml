name: "Setup Node.js and pnpm"
description: "Consolidated action to setup Node.js, pnpm, and check runtime"
inputs:
  node-version-file:
    description: "Path to .node-version file"
    required: false
    default: ".node-version"
  node-version:
    description: "Explicit Node.js version to use, overrides node-version-file if set"
    required: false
  pnpm-version:
    description: "Version of pnpm to activate"
    required: false
    default: "10.28.2"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml
        node-version-file: ${{ inputs.node-version == '' && inputs.node-version-file || null }}
        node-version: ${{ inputs.node-version != '' && inputs.node-version || null }}

    - name: Enable Corepack
      run: corepack enable
      shell: bash

    - name: Activate pinned pnpm
      env:
        PNPM_VERSION: ${{ inputs.pnpm-version }}
      run: corepack prepare pnpm@"$PNPM_VERSION" --activate
      shell: bash
