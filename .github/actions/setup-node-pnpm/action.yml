name: "Setup Node.js and pnpm"
description: "Consolidated action to setup Node.js, pnpm, and check runtime"
inputs:
  node-version-file:
    description: "Path to .node-version file"
    required: false
    default: ".node-version"
  node-version:
    description: "Explicit Node.js version to use, overrides node-version-file if set"
    required: false
  pnpm-version:
    description: "Version of pnpm to activate"
    required: false
    default: "10.28.2"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml
        node-version-file: ${{ inputs.node-version == '' && inputs.node-version-file || null }}
        node-version: ${{ inputs.node-version != '' && inputs.node-version || null }}

    - name: Enable Corepack
      run: corepack enable
      shell: bash

    - name: Activate pinned pnpm
      env:
        PNPM_VERSION: ${{ inputs.pnpm-version }}
      run: corepack prepare pnpm@"$PNPM_VERSION" --activate
      shell: bash

    - name: Install Python dependencies
      run: |
        if [ -f "pyproject.toml" ]; then
          python3 -m pip install chromadb sentence-transformers
        fi
      shell: bash
